# 54Bank On-Premise Kubernetes Cluster Configuration
# Deployment: kubeadm on bare-metal servers in Nigerian data center
# Architecture: 3 control-plane + 6 worker + 3 storage nodes
#
# Prerequisites:
#   - Ubuntu 22.04 LTS on all nodes
#   - Each node: min 16 CPU, 64GB RAM, 500GB NVMe
#   - Network: 10GbE between nodes, VPN to DR site
#   - DNS: *.54bank.local resolving to MetalLB VIP range
#
# Usage:
#   kubeadm init --config cluster-config.yaml

---
apiVersion: kubeadm.k8s.io/v1beta3
kind: InitConfiguration
localAPIEndpoint:
  advertiseAddress: "10.0.1.10"
  bindPort: 6443
nodeRegistration:
  criSocket: unix:///var/run/containerd/containerd.sock
  taints:
    - key: node-role.kubernetes.io/control-plane
      effect: NoSchedule

---
apiVersion: kubeadm.k8s.io/v1beta3
kind: ClusterConfiguration
clusterName: 54bank-onprem
kubernetesVersion: v1.29.0

# HA control plane behind keepalived VIP
controlPlaneEndpoint: "k8s-api.54bank.local:6443"

networking:
  podSubnet: "10.244.0.0/16"      # Calico pod CIDR
  serviceSubnet: "10.96.0.0/12"   # Service CIDR
  dnsDomain: cluster.local

etcd:
  local:
    dataDir: /var/lib/etcd
    extraArgs:
      # Performance tuning for financial workloads
      quota-backend-bytes: "8589934592"  # 8GB
      auto-compaction-mode: periodic
      auto-compaction-retention: "8h"
      snapshot-count: "5000"
    serverCertSANs:
      - "10.0.1.10"
      - "10.0.1.11"
      - "10.0.1.12"
      - "k8s-api.54bank.local"
    peerCertSANs:
      - "10.0.1.10"
      - "10.0.1.11"
      - "10.0.1.12"

apiServer:
  certSANs:
    - "k8s-api.54bank.local"
    - "10.0.1.10"
    - "10.0.1.11"
    - "10.0.1.12"
    - "10.0.1.100"  # Keepalived VIP
  extraArgs:
    # Audit logging — CBN requires transaction audit trail
    audit-log-path: /var/log/kubernetes/audit.log
    audit-log-maxage: "365"
    audit-log-maxsize: "500"
    audit-log-maxbackup: "10"
    audit-policy-file: /etc/kubernetes/audit-policy.yaml
    # Encryption at rest for secrets
    encryption-provider-config: /etc/kubernetes/encryption-config.yaml
    # RBAC + Node authorization
    authorization-mode: "Node,RBAC"
    # Request limits
    max-requests-inflight: "800"
    max-mutating-requests-inflight: "400"
    # Enable admission controllers
    enable-admission-plugins: >-
      NamespaceLifecycle,LimitRanger,ServiceAccount,
      DefaultStorageClass,DefaultTolerationSeconds,
      MutatingAdmissionWebhook,ValidatingAdmissionWebhook,
      ResourceQuota,PodSecurityPolicy,NodeRestriction,
      PodSecurity
  extraVolumes:
    - name: audit-log
      hostPath: /var/log/kubernetes
      mountPath: /var/log/kubernetes
    - name: audit-policy
      hostPath: /etc/kubernetes/audit-policy.yaml
      mountPath: /etc/kubernetes/audit-policy.yaml
      readOnly: true
    - name: encryption-config
      hostPath: /etc/kubernetes/encryption-config.yaml
      mountPath: /etc/kubernetes/encryption-config.yaml
      readOnly: true

controllerManager:
  extraArgs:
    bind-address: "0.0.0.0"
    terminated-pod-gc-threshold: "100"
    node-monitor-period: "5s"
    node-monitor-grace-period: "40s"

scheduler:
  extraArgs:
    bind-address: "0.0.0.0"

---
apiVersion: kubeadm.k8s.io/v1beta3
kind: JoinConfiguration
nodeRegistration:
  criSocket: unix:///var/run/containerd/containerd.sock
discovery:
  bootstrapToken:
    apiServerEndpoint: "k8s-api.54bank.local:6443"
    unsafeSkipCAVerification: false

---
# Kubelet configuration for all nodes
apiVersion: kubelet.config.k8s.io/v1beta1
kind: KubeletConfiguration
cgroupDriver: systemd
containerLogMaxSize: "50Mi"
containerLogMaxFiles: 5
evictionHard:
  memory.available: "500Mi"
  nodefs.available: "10%"
  imagefs.available: "15%"
evictionSoft:
  memory.available: "1Gi"
  nodefs.available: "15%"
evictionSoftGracePeriod:
  memory.available: "1m30s"
  nodefs.available: "1m30s"
maxPods: 250
serializeImagePulls: false
