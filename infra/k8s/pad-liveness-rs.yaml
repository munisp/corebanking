apiVersion: apps/v1
kind: Deployment
metadata:
  name: pad-liveness-rs
  labels:
    app: pad-liveness-rs
    tier: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pad-liveness-rs
  template:
    metadata:
      labels:
        app: pad-liveness-rs
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do sleep 2; done"]
      containers:
        - name: pad-liveness-rs
          image: 54bank/pad-liveness-rs:latest
          ports:
            - containerPort: 9031
          env:
            - name: PORT
              value: "9031"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: REDIS_URL
              value: "redis://redis:6379"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9031
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9031
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: pad-liveness-rs
spec:
  selector:
    app: pad-liveness-rs
  ports:
    - port: 9031
      targetPort: 9031
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pad-liveness-rs-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pad-liveness-rs
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pad-liveness-rs-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pad-liveness-rs
