[package]
name = "service-framework"
version = "0.1.0"
edition = "2021"
description = "Shared service framework for all 54Bank Rust microservices"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
