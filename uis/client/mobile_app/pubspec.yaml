name: mobile_app
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.3.3
  flutter_svg: ^2.2.3
  lottie: ^3.3.2

  # State Management
  provider: ^6.1.5+1
  riverpod: ^2.6.1
  flutter_riverpod: ^2.6.1

  # Network & API
  dio: ^5.9.0
  http: ^1.6.0

  # Firebase (Updated versions for compatibility)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

  # Local Storage & Security
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.3.3
  path: ^1.9.1

  # Authentication
  local_auth: ^2.3.0
  jwt_decoder: ^2.0.1

  # QR Code
  qr_flutter: ^4.1.0
  share_plus: ^7.2.1
  mobile_scanner: ^7.2.0

  # # Notifications
  # flutter_local_notifications: ^16.3.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.2
  file_picker: ^10.3.7
  universal_html: ^2.2.4
  url_launcher: ^6.3.1

  # Charts
  fl_chart: ^0.69.2

  # Voice Banking
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.0
  permission_handler: ^11.3.1
  avatar_glow: ^3.0.1
  audioplayers: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.3

  # Testing
  integration_test:
    sdk: flutter
  mockito: ^5.6.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/badges/

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icons/bp.png
  android_12:
    image: assets/icons/bp.png
    icon_background_color: "#FFFFFF"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icons/bp.png"

  # Adaptive icon for Android (modern look on Android 8.0+)
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/bp.png"

  # Remove alpha channel for iOS
  remove_alpha_ios: true

  # Optional: Specify min SDK for adaptive icons
  min_sdk_android: 21
