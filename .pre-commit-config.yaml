repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^services/.*\.py$
      - id: ruff-format
        files: ^services/.*\.py$

  - repo: local
    hooks:
      - id: go-vet
        name: go vet
        entry: bash -c 'for d in services/*-go/; do (cd "$d" && go vet ./... 2>/dev/null) || true; done'
        language: system
        pass_filenames: false
        files: ^services/.*-go/.*\.go$

      - id: go-build
        name: go build check
        entry: bash -c 'for d in services/*-go/; do (cd "$d" && go build ./... 2>/dev/null) || exit 1; done'
        language: system
        pass_filenames: false
        files: ^services/.*-go/.*\.go$

      - id: typescript-check
        name: TypeScript check
        entry: bash -c 'cd client && npx tsc --noEmit 2>/dev/null || true'
        language: system
        pass_filenames: false
        files: ^client/.*\.(ts|tsx)$

      - id: no-secrets
        name: No hardcoded secrets
        entry: bash -c 'grep -rn "password.*=.*[A-Za-z0-9]" --include="*.ts" --include="*.go" --include="*.py" --include="*.rs" | grep -v "test\|example\|placeholder\|ndsep_secure\|localhost" | head -5 && exit 1 || exit 0'
        language: system
        pass_filenames: false
