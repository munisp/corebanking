# APISIX Declarative Gateway Configuration for 54Bank Platform
# This config replaces the Express proxy routes with declarative YAML routing
# Deploy alongside APISIX for production-grade API gateway features

apisix:
  node_listen: 9080
  admin_key:
    - name: "admin"
      key: "${APISIX_ADMIN_KEY:-54bank-admin-key}"
      role: admin

# Global plugins
global_rules:
  - id: 1
    plugins:
      cors:
        allow_origins: "*"
        allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
        allow_headers: "Content-Type, Authorization, X-Correlation-ID, X-API-Version"
      prometheus:
        prefer_name: true
      request-id:
        header_name: "X-Correlation-ID"
        include_in_response: true
      ip-restriction:
        blacklist: []

# Rate limiting
plugin_configs:
  - id: 1
    desc: "Standard rate limit"
    plugins:
      limit-req:
        rate: 100
        burst: 50
        key_type: "var"
        key: "remote_addr"
        rejected_code: 429
  - id: 2
    desc: "Strict rate limit (auth endpoints)"
    plugins:
      limit-req:
        rate: 10
        burst: 5
        key_type: "var"
        key: "remote_addr"
        rejected_code: 429

# Upstream service definitions
upstreams:
  - id: agriculture
    type: roundrobin
    nodes:
      "localhost:8090": 1
    timeout:
      connect: 5
      send: 10
      read: 10
    checks:
      active:
        http_path: "/healthz"
        healthy:
          interval: 5
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3

  - id: teller
    type: roundrobin
    nodes:
      "localhost:8091": 1
    checks:
