apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: business-service-netpol
  namespace: banking-platform
spec:
  podSelector:
    matchLabels:
      app: business-service
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: banking-platform
    - podSelector:
        matchLabels:
          app: api-gateway
    ports:
    - protocol: TCP
      port: 8086
  egress:
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  # Allow to PostgreSQL
  - to:
    - namespaceSelector:
        matchLabels:
          name: banking-platform
      podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  # Allow to Kafka
  - to:
    - namespaceSelector:
        matchLabels:
          name: kafka
    ports:
    - protocol: TCP
      port: 9092
  # Allow to Keycloak
  - to:
    - namespaceSelector:
        matchLabels:
          name: banking-platform
      podSelector:
        matchLabels:
          app: keycloak
    ports:
    - protocol: TCP
      port: 8443
  # Allow to Permify
  - to:
    - namespaceSelector:
        matchLabels:
          name: banking-platform
      podSelector:
        matchLabels:
          app: permify
    ports:
    - protocol: TCP
      port: 3476
