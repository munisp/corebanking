[package]
name = "sanctions-screening-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonwebtoken = "9.3.0"
webpki-roots = "0.25.4"
actix-web = "4.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.41", features = ["serde"] }
deadpool-postgres = { version = "0.14.1", features = ["rt_tokio_1"] }
tokio-postgres = { version = "0.7.13", features = ["with-chrono-0_4", "with-uuid-1"] }
tokio-postgres-rustls = "0.12"
rustls = { version = "0.23.10", features = ["ring"] }
tokio = { version = "1.43.1", features = ["rt-multi-thread", "macros", "time"] }
quick-xml = "0.37.4"
reqwest = { version = "0.12.22", default-features = false, features = ["json", "rustls-tls"] }
strsim = "0.11"
uuid = { version = "1.17.0", features = ["v4"] }
log = "0.4.27"
env_logger = "0.11.8"

[profile.release]
opt-level = "z"
lto = true
