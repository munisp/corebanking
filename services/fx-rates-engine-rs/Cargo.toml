[package]
name = "fx-rates-engine"
version = "0.1.0"
edition = "2021"
description = "54Bank FX & Rates Engine — exchange rates, currency conversion, spreads, rate history"

[dependencies]
actix-cors = "0.7"
sha2 = "0.10"
lazy_static = "1"
tokio-postgres = { version = "0.7", features = ["default"] }
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
log = "0.4"
env_logger = "0.11"
