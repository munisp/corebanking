[package]
name = "fx-rates-engine"
version = "0.1.0"
edition = "2021"
description = "54link-dev FX & Rates Engine — exchange rates, currency conversion, spreads, rate history"

[dependencies]
tokio-postgres = { version = "0.7", features = ["default"] }
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
