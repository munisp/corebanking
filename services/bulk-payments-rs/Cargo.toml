[package]
name = "bulk-payments"
version = "0.1.0"
edition = "2021"
description = "54link-dev Bulk Payment Processor — salary batch, NIBSS bulk transfers, reconciliation"

[dependencies]
jsonwebtoken = "9.3.0"
tokio-postgres = { version = "0.7.13", features = ["default"] }
actix-web = "4.9.0"
actix-rt = "2.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.17.0", features = ["v4"] }
chrono = { version = "0.4.41", features = ["serde"] }
tokio = { version = "1.43.1", features = ["full"] }
reqwest = { version = "0.12.22", features = ["json"] }
otelkit = { path = "../../shared/otel/rust", features = ["actix-web"] }
# MN-18: deterministic per-leg idempotency keys (sha256(batch_id|index))
sha2 = "0.10.8"
hex = "0.4.3"
