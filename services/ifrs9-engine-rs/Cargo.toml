[package]
name = "ifrs9-engine-rs"
version = "0.1.1"
edition = "2021"

[dependencies]
jsonwebtoken = "9.3.0"
reqwest = { version = "0.12.22", features = ["json"] }
actix-web = "4.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.43.1", features = ["net", "time", "io-util"] }
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "postgres"] }
