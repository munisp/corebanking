[package]
name = "code-signing-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.43.1", features = ["full"] }
tokio-postgres = "0.7.13"
sha2 = "0.10.9"
hex = "0.4.3"
chrono = { version = "0.4.41", features = ["serde"] }
