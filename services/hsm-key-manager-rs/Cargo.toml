[package]
name = "hsm-key-manager-rs"
version = "3.0.0"
edition = "2021"

[dependencies]
tokio-postgres = { version = "0.7", features = ["default"] }
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
log = "0.4"
env_logger = "0.11"
