# PL-04: alembic configuration for account-service (was missing — the
# migration chain could not be executed from source at all).
# Override the URL at runtime: DATABASE_URL=... alembic upgrade head

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is overridden from the DATABASE_URL env var by alembic/env.py.
# The value below is a placeholder for offline (`--sql`) use only.
sqlalchemy.url = postgresql://localhost:5432/account_service

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
