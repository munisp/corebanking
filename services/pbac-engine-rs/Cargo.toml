[package]
name = "pbac_engine_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["default"] }
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"

sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
log = "0.4"
env_logger = "0.11"
[profile.release]
opt-level = 3
lto = true
