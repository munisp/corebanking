[package]
name = "dormancy-management"
version = "0.1.0"
edition = "2021"

[dependencies]
jsonwebtoken = "9.3.0"
reqwest = { version = "0.12.22", features = ["json"] }
actix-web = "4.9.0"
tokio = { version = "1.43.1", features = ["full"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.41", features = ["serde"] }
