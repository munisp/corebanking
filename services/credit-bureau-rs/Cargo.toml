[package]
name = "credit-bureau-integration"
version = "0.1.0"
edition = "2021"
description = "54link-dev Credit Bureau Integration — CRC, FirstCentral, CreditRegistry scoring and reporting"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["default"] }
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
