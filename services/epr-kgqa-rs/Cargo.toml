[package]
name = "epr-kgqa-rs"
version = "2.0.0"
edition = "2021"

[dependencies]
uuid = { version = "1", features = ["v4"] }
tokio-postgres = { version = "0.7", features = ["default"] }
actix-web = "4"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
