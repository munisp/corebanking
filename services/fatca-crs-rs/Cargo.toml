[package]
name = "fatca-crs-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
lazy_static = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["full"] }
tokio-postgres = { version = "0.7", features = ["default"] }
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
