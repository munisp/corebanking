[package]
name = "rust-risk-evaluator"
version = "0.1.0"
edition = "2021"
description = "Rust utility for deterministic fraud and risk hot-path evaluation"

[dependencies]
axum = "0.8.4"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.43.1", features = ["macros", "rt-multi-thread", "net"] }
