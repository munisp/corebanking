[package]
name = "rust-risk-evaluator"
version = "0.1.0"
edition = "2021"
description = "Rust utility for deterministic fraud and risk hot-path evaluation"

[dependencies]
axum = "0.7"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
