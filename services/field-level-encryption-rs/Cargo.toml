[package]
name = "field-level-encryption-rs"
version = "3.0.0"
edition = "2021"

[dependencies]
actix-cors = "0.7"
sha2 = "0.10"
lazy_static = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tokio-postgres = { version = "0.7", features = ["default"] }
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
hex = "0.4"
