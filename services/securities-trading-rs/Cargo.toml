[package]
name = "securities_trading_rs"
version = "0.1.0"
edition = "2021"

[dependencies]
actix-web = "4.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
chrono = "0.4.41"

sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
log = "0.4.27"
env_logger = "0.11.8"
[profile.release]
opt-level = 3
lto = true
