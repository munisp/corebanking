[package]
name = "sanctions-engine-rs"
version = "2.0.0"
edition = "2021"
[[bin]]
name = "sanctions-engine-rs"
path = "src/main.rs"
[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4"] }
actix-web = "4.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.43.1", features = ["full"] }
