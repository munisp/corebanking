[package]
name = "tigerbeetle-multicurrency"
version = "0.1.0"
edition = "2021"
[dependencies]
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4"] }
tokio = { version = "1.43.1", features = ["full"] }
tokio-postgres = { version = "0.7.13", features = ["default"] }
actix-web = "4.9.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
