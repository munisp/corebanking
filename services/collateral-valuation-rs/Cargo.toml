[package]
name = "collateral-valuation"
version = "0.1.0"
edition = "2021"
description = "54link-dev Collateral Valuation Engine — property, vehicle, securities, forced sale value, haircuts"

[dependencies]
actix-web = "4"
actix-rt = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tokio = { version = "1", features = ["full"] }
