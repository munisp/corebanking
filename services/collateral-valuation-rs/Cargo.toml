[package]
name = "collateral-valuation"
version = "0.1.0"
edition = "2021"
description = "54link-dev Collateral Valuation Engine — property, vehicle, securities, forced sale value, haircuts"

[dependencies]
jsonwebtoken = "9.3.0"
reqwest = { version = "0.12.22", features = ["json"] }
actix-web = "4.9.0"
actix-rt = "2.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tokio = { version = "1.43.1", features = ["full"] }
