[package]
name = "product_factory"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "product_factory"
path = "src/main.rs"

[dependencies]
actix-cors = "0.7"
sha2 = "0.10"
lazy_static = "1"
tokio-postgres = { version = "0.7", features = ["default"] }
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
