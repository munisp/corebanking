[package]
name = "data-export-engine"
version = "0.1.0"
edition = "2021"
description = "54link-dev Data Export/ETL Engine — CSV/JSON/PDF generation, scheduled exports, data warehouse feeds"

[dependencies]
jsonwebtoken = "9.3.0"
chrono = { version = "0.4.41", features = ["serde"] }
uuid = { version = "1.17.0", features = ["v4"] }
tokio = { version = "1.43.1", features = ["full"] }
tokio-postgres = { version = "0.7.13", features = ["default"] }
actix-web = "4.9.0"
actix-rt = "2.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sqlx = { version = "0.8.3", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"] }
log = "0.4.27"
env_logger = "0.11.8"
