[package]
name = "aml-engine-rs"
version = "2.0.0"
edition = "2021"

[dependencies]
sha2 = "0.10"
lazy_static = "1"
uuid = { version = "1", features = ["v4"] }
tokio-postgres = { version = "0.7", features = ["default"] }
actix-web = "4"
axum = "0.7"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
