[package]
name = "offline-pin-guard"
version = "0.1.0"
edition = "2021"
description = "Rust hardening utility for secure offline PIN bundle generation and verification"

[dependencies]
aes-gcm = "0.10.3"
argon2 = "=0.4.1"
base64 = "0.22.1"
base64ct = "=1.6.0"
chrono = { version = "0.4.41", features = ["serde"] }
clap = { version = "=4.4.18", features = ["derive"] }
hmac = "0.12.1"
rand = "0.9.1"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
subtle = "2.5"
