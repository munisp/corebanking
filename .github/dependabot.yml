version: 2

updates:
  # ── Node.js (npm) ──────────────────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 10
    reviewers:
      - "munisp"
    labels:
      - "dependencies"
      - "security"
    groups:
      drizzle:
        patterns: ["drizzle-*"]
      vite-ecosystem:
        patterns: ["vite", "@vitejs/*", "vitest", "@vitest/*"]
      react-ecosystem:
        patterns: ["react", "react-*", "@types/react*"]
    ignore:
      # Only auto-update patch versions for major libs to avoid breaking changes
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]

  # ── GitHub Actions ─────────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"

  # ── Python (pip) — root ────────────────────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    groups:
      fastapi-ecosystem:
        patterns: ["fastapi", "uvicorn", "starlette", "pydantic*"]
      crypto-libs:
        patterns: ["cryptography", "pyjwt", "python-jose", "bcrypt", "argon2*"]

  # ── Python (pip) — Islamic Banking service ────────────────────────────
  - package-ecosystem: "pip"
    directory: "/services/islamic-banking-py"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python", "islamic-banking"]

  # ── Python (pip) — KYC/AML service ───────────────────────────────────
  - package-ecosystem: "pip"
    directory: "/services/kyc-aml-screening-py"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python", "kyc-aml"]

  # ── Python (pip) — Batch processing service ───────────────────────────
  - package-ecosystem: "pip"
    directory: "/services/batch-processing-py"
    schedule:
      interval: "weekly"
      day: "tuesday"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python", "batch"]

  # ── Docker ─────────────────────────────────────────────────────────────
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Africa/Lagos"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "infrastructure"
    ignore:
      # Pin TigerBeetle and Fluvio — these have strict version requirements
      - dependency-name: "ghcr.io/tigerbeetle/tigerbeetle"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "infinyon/fluvio"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
