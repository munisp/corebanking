name: Build Customer Management Consolidated Service

on:
  push:
    branches:
      - main
    paths:
      - 'services/customer-360-py/**'
      - 'services/customer-engagement-py/**'
      - 'services/customer-feedback-py/**'
      - 'services/expense-mgmt-go/**'
      - 'services/i18n-service-go/**'
      - 'services/relationship-manager-service/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/customer-management.yaml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=customer-360-py,customer-engagement-py,customer-feedback-py,expense-mgmt-go,i18n-service-go,relationship-manager-service
            PRIMARY_LANG=python
            PORT_BASE=9348
          tags: registry.digitalocean.com/talentgraph-auth/54link-customer-management:0.0.1
