name: Build Core Payments Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/beneficiary-management-go/**'
      - 'services/commission-settlement/**'
      - 'services/mandate-management-go/**'
      - 'services/merchant-service/**'
      - 'services/nibss-direct-debit-go/**'
      - 'services/nibss-nip-engine-go/**'
      - 'services/payment-hub/**'
      - 'services/payment-investigation-go/**'
      - 'services/payment-processing-service/**'
      - 'services/payment-rails-connectors/**'
      - 'services/qr-payments-go/**'
      - 'services/standing-orders-go/**'
      - 'services/utility-payments-go/**'
      - 'services/whatsapp-payment-integration-go/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/entrypoint.sh'
      - 'docker/build-services.sh'
      - '.github/workflows/core-payments.yaml'

env:
  TAG: "0.0.24"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=beneficiary-management-go,commission-settlement,mandate-management-go,merchant-service,nibss-direct-debit-go,nibss-nip-engine-go,payment-hub,payment-investigation-go,payment-processing-service,payment-rails-connectors,qr-payments-go,standing-orders-go,utility-payments-go,whatsapp-payment-integration-go
            PRIMARY_LANG=go
            PORT_BASE=9330
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-core-payments:${{ env.TAG }}
