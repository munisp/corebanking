name: Build Customer Pricing Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/aggregation-center-go/**'
      - 'services/product-factory-rs/**'
      - 'services/rate-cascade-rs/**'
      - 'services/realtime-pricing-rs/**'
      - 'services/relationship-pricing-rs/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - '.github/workflows/customer-pricing.yaml'

env:
  TAG: "0.0.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=aggregation-center-go,product-factory-rs,rate-cascade-rs,realtime-pricing-rs,relationship-pricing-rs
            PRIMARY_LANG=go
            PORT_BASE=9356
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-customer-pricing:${{ env.TAG }}
