name: Build Platform Devops Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/ab-testing-py/**'
      - 'services/certificate-manager-py/**'
      - 'services/feature-entitlement-go/**'
      - 'services/feature-flag-engine-rs/**'
      - 'services/flag-audit-rs/**'
      - 'services/graduated-rollout-rs/**'
      - 'services/hpa-autoscaler-go/**'
      - 'services/keda-scaler-go/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/platform-devops.yaml'

env:
  TAG: "0.0.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=ab-testing-py,certificate-manager-py,feature-entitlement-go,feature-flag-engine-rs,flag-audit-rs,graduated-rollout-rs,hpa-autoscaler-go,keda-scaler-go
            PRIMARY_LANG=go
            PORT_BASE=9508
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-platform-devops:${{ env.TAG }}
