name: Build Infra Messaging Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/billing-event-processor-py/**'
      - 'services/event-bus-go/**'
      - 'services/event-correlator-py/**'
      - 'services/event-dedup-engine-rs/**'
      - 'services/event-sourcing-go/**'
      - 'services/event-streaming-go/**'
      - 'services/fluvio-streams-rs/**'
      - 'services/fluvio-wasm-transform-rs/**'
      - 'services/kafka-batch-producer-rs/**'
      - 'services/kafka-broker-go/**'
      - 'services/kafka-consumer-optimizer-go/**'
      - 'services/kafka-lakehouse-connector/**'
      - 'services/kafka-schema-registry-go/**'
      - 'services/kafka-streaming-go/**'
      - 'services/stream-response-go/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/infra-messaging.yaml'

env:
  TAG: "0.0.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=billing-event-processor-py,event-bus-go,event-correlator-py,event-dedup-engine-rs,event-sourcing-go,event-streaming-go,fluvio-streams-rs,fluvio-wasm-transform-rs,kafka-batch-producer-rs,kafka-broker-go,kafka-consumer-optimizer-go,kafka-lakehouse-connector,kafka-schema-registry-go,kafka-streaming-go,stream-response-go
            PRIMARY_LANG=go
            PORT_BASE=9415
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-infra-messaging:${{ env.TAG }}
