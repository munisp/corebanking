name: Build and Deploy Verification Service

on:
  push:
    branches:
      - main
    paths:
      - 'services/verification-service/**'
      - 'infrastructure/charts/verification-service/**'
      - 'infrastructure/apisix-resources/routes/verification-service.yaml'
      - '.github/workflows/verification-service.yaml'

env:
  IMAGE: registry.digitalocean.com/talentgraph-auth/54link-dev-verification-service
  TAG: "2.0.1"
  CHART: infrastructure/charts/verification-service
  RELEASE: verification-service
  NAMESPACE: 54link-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/verification-service
          file: ./services/verification-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

