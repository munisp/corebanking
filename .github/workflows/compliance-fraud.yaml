name: Build Compliance Fraud Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/agent-fraud-detection-py/**'
      - 'services/ai-fraud-scoring-rs/**'
      - 'services/anomaly-detector-py/**'
      - 'services/fraud-detection-rs/**'
      - 'services/fraud-service/**'
      - 'services/fraudfusion/**'
      - 'services/fraudfusion-ensemble-rs/**'
      - 'services/gnn-fraud-detection-py/**'
      - 'services/mcmc-bayesian-risk-py/**'
      - 'services/txn-pattern-analyzer-py/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/entrypoint.sh'
      - 'docker/build-services.sh'
      - '.github/workflows/compliance-fraud.yaml'

env:
  TAG: "0.0.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=agent-fraud-detection-py,ai-fraud-scoring-rs,anomaly-detector-py,fraud-detection-rs,fraud-service,fraudfusion,fraudfusion-ensemble-rs,gnn-fraud-detection-py,mcmc-bayesian-risk-py,txn-pattern-analyzer-py
            PRIMARY_LANG=go
            PORT_BASE=9197
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-compliance-fraud:${{ env.TAG }}
