name: Build Security Waf Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/body-limit-enforcer-go/**'
      - 'services/clickjack-defender-rs/**'
      - 'services/cloud-kms-bridge-rs/**'
      - 'services/csp-nonce-engine-go/**'
      - 'services/ddos-protection-go/**'
      - 'services/ddos-shield-go/**'
      - 'services/distroless-builder-py/**'
      - 'services/docker-hardener-py/**'
      - 'services/field-level-encryption-rs/**'
      - 'services/helm-validator-go/**'
      - 'services/hsm-key-manager-rs/**'
      - 'services/image-scanner-go/**'
      - 'services/ip-allowlist-rs/**'
      - 'services/key-rotation-engine-go/**'
      - 'services/ml-security-service/**'
      - 'services/openappsec-waf-rs/**'
      - 'services/output-encoder-rs/**'
      - 'services/pci-scanner-rs/**'
      - 'services/security-service/**'
      - 'services/sri-validator-rs/**'
      - 'services/waf-rules-engine-rs/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/security-waf.yaml'

env:
  TAG: "0.0.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=body-limit-enforcer-go,clickjack-defender-rs,cloud-kms-bridge-rs,csp-nonce-engine-go,ddos-protection-go,ddos-shield-go,distroless-builder-py,docker-hardener-py,field-level-encryption-rs,helm-validator-go,hsm-key-manager-rs,image-scanner-go,ip-allowlist-rs,key-rotation-engine-go,ml-security-service,openappsec-waf-rs,output-encoder-rs,pci-scanner-rs,security-service,sri-validator-rs,waf-rules-engine-rs
            PRIMARY_LANG=go
            PORT_BASE=9540
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-security-waf:${{ env.TAG }}
