name: Build Treasury Investments Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/cash-pooling-go/**'
      - 'services/commodity-exchange-rs/**'
      - 'services/commodity-price-intelligence-py/**'
      - 'services/custody-service-go/**'
      - 'services/etd-trading-rs/**'
      - 'services/insurance-portfolio-analytics-py/**'
      - 'services/money-market-rs/**'
      - 'services/multicurrency-revaluation-rs/**'
      - 'services/otc-derivatives-rs/**'
      - 'services/portfolio-mgmt-rs/**'
      - 'services/securities-trading-rs/**'
      - 'services/treasury-liquidity-py/**'
      - 'services/treasury-liquidity-rs/**'
      - 'services/treasury-service/**'
      - 'services/wealth-mgmt-py/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/treasury-investments.yaml'

env:
  TAG: "0.0.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=cash-pooling-go,commodity-exchange-rs,commodity-price-intelligence-py,custody-service-go,etd-trading-rs,insurance-portfolio-analytics-py,money-market-rs,multicurrency-revaluation-rs,otc-derivatives-rs,portfolio-mgmt-rs,securities-trading-rs,treasury-liquidity-py,treasury-liquidity-rs,treasury-service,wealth-mgmt-py
            PRIMARY_LANG=go
            PORT_BASE=9641
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-treasury-investments:${{ env.TAG }}
