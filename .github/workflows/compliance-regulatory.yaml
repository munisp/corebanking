name: Build Compliance Regulatory Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/agent-regulatory-returns-py/**'
      - 'services/audit-service/**'
      - 'services/basel-engine-rs/**'
      - 'services/cbn-agri-returns-py/**'
      - 'services/cbn-agsmeis-go/**'
      - 'services/cbn-anchor-borrowers-go/**'
      - 'services/cbn-compliance-checker-py/**'
      - 'services/cbn-returns-py/**'
      - 'services/cbn-service/**'
      - 'services/ctr-auto-filer-go/**'
      - 'services/efass-generator-rs/**'
      - 'services/fatca-crs-rs/**'
      - 'services/gl-regulatory-pipeline-py/**'
      - 'services/ifrs9-ecl-engine-rs/**'
      - 'services/ifrs9-engine-rs/**'
      - 'services/internal-auditor-service/**'
      - 'services/lcr-nsfr-rs/**'
      - 'services/nfiu-ctr-str-filing-py/**'
      - 'services/regulatory-automation-py/**'
      - 'services/regulatory-reporting-go/**'
      - 'services/regulatory-sandbox-go/**'
      - 'services/sar-filing-engine-go/**'
      - 'services/soc2-evidence-collector-py/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - '.github/workflows/compliance-regulatory.yaml'

env:
  TAG: "0.0.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=agent-regulatory-returns-py,audit-service,basel-engine-rs,cbn-agri-returns-py,cbn-agsmeis-go,cbn-anchor-borrowers-go,cbn-compliance-checker-py,cbn-returns-py,cbn-service,ctr-auto-filer-go,efass-generator-rs,fatca-crs-rs,gl-regulatory-pipeline-py,ifrs9-ecl-engine-rs,ifrs9-engine-rs,internal-auditor-service,lcr-nsfr-rs,nfiu-ctr-str-filing-py,regulatory-automation-py,regulatory-reporting-go,regulatory-sandbox-go,sar-filing-engine-go,soc2-evidence-collector-py
            PRIMARY_LANG=go
            PORT_BASE=9244
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-compliance-regulatory:${{ env.TAG }}
