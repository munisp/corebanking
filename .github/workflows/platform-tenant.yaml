name: Build Platform Tenant Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/billing-enforcement-rs/**'
      - 'services/billing-ingestor-go/**'
      - 'services/billing-orchestrator-go/**'
      - 'services/billing-rating-rs/**'
      - 'services/billing-rbac-rs/**'
      - 'services/billing-service/**'
      - 'services/multi-entity-go/**'
      - 'services/tenant-billing-go/**'
      - 'services/tenant-export-go/**'
      - 'services/tenant-isolation-go/**'
      - 'services/tenant-management/**'
      - 'services/tenant-metering-go/**'
      - 'services/tenant-ratelimit-rs/**'
      - 'services/white-label-engine-go/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/platform-tenant.yaml'

env:
  TAG: "0.0.7"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=billing-enforcement-rs,billing-ingestor-go,billing-orchestrator-go,billing-rating-rs,billing-rbac-rs,billing-service,multi-entity-go,tenant-billing-go,tenant-export-go,tenant-isolation-go,tenant-management,tenant-metering-go,tenant-ratelimit-rs,white-label-engine-go
            PRIMARY_LANG=go
            PORT_BASE=9518
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-platform-tenant:${{ env.TAG }}
