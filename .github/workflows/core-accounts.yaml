name: Build Core Accounts Consolidated Service

on:
  push:
    branches:
      - main
    paths:
      - 'services/account-closure-go/**'
      - 'services/account-opening-go/**'
      - 'services/account-service/**'
      - 'services/account-statement-go/**'
      - 'services/agent-account-opening-py/**'
      - 'services/cif-management-go/**'
      - 'services/customer-onboarding/**'
      - 'services/dormancy-management-rs/**'
      - 'services/virtual-account-service/**'
      - 'services/virtual-accounts-go/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/core-accounts.yaml'

env:
  TAG: "0.0.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=account-closure-go,account-opening-go,account-service,account-statement-go,agent-account-opening-py,cif-management-go,customer-onboarding,dormancy-management-rs,virtual-account-service,virtual-accounts-go
            PRIMARY_LANG=go
            PORT_BASE=9278
          tags: registry.digitalocean.com/talentgraph-auth/54link-core-accounts:${{ env.TAG }}
