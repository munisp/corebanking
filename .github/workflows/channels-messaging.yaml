name: Build Channels Messaging Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/branded-comms-py/**'
      - 'services/communication-hub/**'
      - 'services/notification-router-go/**'
      - 'services/notification-service/**'
      - 'services/omini-service/**'
      - 'services/realtime-notification-service/**'
      - 'services/sms-alert-notification-py/**'
      - 'services/sms-banking-gateway-go/**'
      - 'services/sms-email-gateway-go/**'
      - 'services/sms-otp-service-rs/**'
      - 'services/sms-service/**'
      - 'services/telegram-banking-commands-rs/**'
      - 'services/telegram-bot-gateway-go/**'
      - 'services/telegram-mini-app-go/**'
      - 'services/telegram-notification-py/**'
      - 'services/telegram-service/**'
      - 'services/whatsapp-banking-flows-rs/**'
      - 'services/whatsapp-business-gateway-go/**'
      - 'services/whatsapp-cloud-api-go/**'
      - 'services/whatsapp-document-service-rs/**'
      - 'services/whatsapp-notification-py/**'
      - 'services/whatsapp-service/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - '.github/workflows/channels-messaging.yaml'

env:
  TAG: "0.0.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=branded-comms-py,communication-hub,notification-router-go,notification-service,omini-service,realtime-notification-service,sms-alert-notification-py,sms-banking-gateway-go,sms-email-gateway-go,sms-otp-service-rs,sms-service,telegram-banking-commands-rs,telegram-bot-gateway-go,telegram-mini-app-go,telegram-notification-py,telegram-service,whatsapp-banking-flows-rs,whatsapp-business-gateway-go,whatsapp-cloud-api-go,whatsapp-document-service-rs,whatsapp-notification-py,whatsapp-service
            PRIMARY_LANG=go
            PORT_BASE=9145
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-channels-messaging:${{ env.TAG }}
