name: Build Ai Graph Search Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/cocoindex-pipeline-py/**'
      - 'services/epr-kgqa-engine-py/**'
      - 'services/epr-kgqa-go/**'
      - 'services/epr-kgqa-py/**'
      - 'services/epr-kgqa-rs/**'
      - 'services/falkordb-coa-go/**'
      - 'services/falkordb-coa-py/**'
      - 'services/falkordb-coa-rs/**'
      - 'services/falkordb-graph-engine-rs/**'
      - 'services/falkordb-graph-rs/**'
      - 'services/kgqa-reasoning-engine-py/**'
      - 'services/langchain-agent-go/**'
      - 'services/neo4j-coa-graph-go/**'
      - 'services/neo4j-coa-graph-rs/**'
      - 'services/neo4j-knowledge-graph-go/**'
      - 'services/ollama-inference-go/**'
      - 'services/qdrant-financial-search-go/**'
      - 'services/qdrant-vector-store-rs/**'
      - 'services/search-service/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/ai-graph-search.yaml'

env:
  TAG: "0.0.1"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=cocoindex-pipeline-py,epr-kgqa-engine-py,epr-kgqa-go,epr-kgqa-py,epr-kgqa-rs,falkordb-coa-go,falkordb-coa-py,falkordb-coa-rs,falkordb-graph-engine-rs,falkordb-graph-rs,kgqa-reasoning-engine-py,langchain-agent-go,neo4j-coa-graph-go,neo4j-coa-graph-rs,neo4j-knowledge-graph-go,ollama-inference-go,qdrant-financial-search-go,qdrant-vector-store-rs,search-service
            PRIMARY_LANG=go
            PORT_BASE=9107
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-ai-graph-search:${{ env.TAG }}
