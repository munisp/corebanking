name: Build and Deploy Bulk Payments Service

on:
  push:
    branches:
      - main
    paths:
      - 'services/bulk-payments-rs/**'
      - 'infrastructure/charts/bulk-payments-rs/**'
      - 'infrastructure/apisix-resources/routes/bulk-payments-rs.yaml'
      - '.github/workflows/bulk-payments-rs.yaml'

env:
  IMAGE: registry.digitalocean.com/talentgraph-auth/54link-dev-bulk-payments-rs
  TAG: "0.0.1"
  CHART: infrastructure/charts/bulk-payments-rs
  RELEASE: bulk-payments-rs
  NAMESPACE: 54link-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/bulk-payments-rs
          file: ./services/bulk-payments-rs/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

