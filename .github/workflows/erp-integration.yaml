name: Build Erp Integration Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/erpnext-bridge-go/**'
      - 'services/erpnext-integration-service/**'
      - 'services/erpnext-sync-py/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - '.github/workflows/erp-integration.yaml'

env:
  TAG: "0.0.3"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=erpnext-bridge-go,erpnext-integration-service,erpnext-sync-py
            PRIMARY_LANG=go
            PORT_BASE=9750
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-erp-integration:${{ env.TAG }}
