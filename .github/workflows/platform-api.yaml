name: Build Platform Api Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/admin-service/**'
      - 'services/api-key-enforcer-go/**'
      - 'services/api-key-vault-go/**'
      - 'services/api-marketplace-go/**'
      - 'services/api-metering/**'
      - 'services/api-versioning-go/**'
      - 'services/apisix-plugin-optimizer-go/**'
      - 'services/bundle-splitter-py/**'
      - 'services/cors-gateway-go/**'
      - 'services/dapr-sidecar-go/**'
      - 'services/graphql-gateway-go/**'
      - 'services/plugin-marketplace-py/**'
      - 'services/security-gateway-go/**'
      - 'services/webhook-engine-go/**'
      - 'services/orchestrator-service/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/platform-api.yaml'

env:
  TAG: "0.0.14"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=admin-service,api-key-enforcer-go,api-key-vault-go,api-marketplace-go,api-metering,api-versioning-go,apisix-plugin-optimizer-go,bundle-splitter-py,cors-gateway-go,dapr-sidecar-go,graphql-gateway-go,plugin-marketplace-py,security-gateway-go,webhook-engine-go,orchestrator-service
            PRIMARY_LANG=go
            PORT_BASE=9492
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-platform-api:${{ env.TAG }}
