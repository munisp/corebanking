name: Build Ledger Reconciliation Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/banking-clearing-ops-rs/**'
      - 'services/ledger-reconciliation-rs/**'
      - 'services/mojaloop-settlement-mgr-go/**'
      - 'services/recon-engine-rs/**'
      - 'services/reconciliation-engine-rs/**'
      - 'services/reconciliation-service/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/entrypoint.sh'
      - 'docker/build-services.sh'
      - '.github/workflows/ledger-reconciliation.yaml'

env:
  TAG: "0.0.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=banking-clearing-ops-rs,ledger-reconciliation-rs,mojaloop-settlement-mgr-go,recon-engine-rs,reconciliation-engine-rs,reconciliation-service
            PRIMARY_LANG=go
            PORT_BASE=9481
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-ledger-reconciliation:${{ env.TAG }}
