name: Build and Deploy Compliance Service

on:
  push:
    branches:
      - main
    paths:
      - 'services/compliance-service/**'
      - 'infrastructure/charts/compliance-service/**'
      - '.github/workflows/compliance-service.yaml'

env:
  IMAGE: registry.digitalocean.com/talentgraph-auth/54link-compliance-service
  TAG: "0.0.2"
  CHART: infrastructure/charts/compliance-service
  RELEASE: compliance-service
  NAMESPACE: 54link-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/compliance-service
          file: ./services/compliance-service/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

