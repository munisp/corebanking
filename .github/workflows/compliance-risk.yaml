name: Build Compliance Risk Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/contingent-liabilities-rs/**'
      - 'services/risk-based-approach-py/**'
      - 'services/risk-manager-service/**'
      - 'services/risk-scoring-rs/**'
      - 'services/tenant-provisioning-go/**'
      - 'services/tenant-provisioning-py/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - '.github/workflows/compliance-risk.yaml'

env:
  TAG: "0.0.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=contingent-liabilities-rs,risk-based-approach-py,risk-manager-service,risk-scoring-rs,tenant-provisioning-go,tenant-provisioning-py
            PRIMARY_LANG=go
            PORT_BASE=9270
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-compliance-risk:${{ env.TAG }}
