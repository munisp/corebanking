name: Build Infra Observability Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/apm-sentry-py/**'
      - 'services/changelog-generator-py/**'
      - 'services/corporate-monitoring-go/**'
      - 'services/error-telemetry-py/**'
      - 'services/incident-responder-go/**'
      - 'services/kpi-threshold-monitor-rs/**'
      - 'services/ops-dashboard/**'
      - 'services/otel-collector-go/**'
      - 'services/siem-exporter-py/**'
      - 'services/synthetic-monitoring/**'
      - 'services/txn-monitoring-rules-rs/**'
      - 'services/wire-transfer-monitor-rs/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/infra-observability.yaml'

env:
  TAG: "0.0.7"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=apm-sentry-py,changelog-generator-py,corporate-monitoring-go,error-telemetry-py,incident-responder-go,kpi-threshold-monitor-rs,ops-dashboard,otel-collector-go,siem-exporter-py,synthetic-monitoring,txn-monitoring-rules-rs,wire-transfer-monitor-rs
            PRIMARY_LANG=go
            PORT_BASE=9451
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-infra-observability:${{ env.TAG }}
