name: Build Trade Supply Chain Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/bank-guarantees-go/**'
      - 'services/equipment-leasing-go/**'
      - 'services/escrow-go/**'
      - 'services/escrow-service/**'
      - 'services/factoring-go/**'
      - 'services/leasing-go/**'
      - 'services/locker-go/**'
      - 'services/lpo-service/**'
      - 'services/project-finance-go/**'
      - 'services/supply-chain-finance-go/**'
      - 'services/supply-chain-service/**'
      - 'services/trust-estate-rs/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - 'docker/entrypoint.sh'
      - '.github/workflows/trade-supply-chain.yaml'

env:
  TAG: "0.0.3"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=bank-guarantees-go,equipment-leasing-go,escrow-go,escrow-service,factoring-go,leasing-go,locker-go,lpo-service,project-finance-go,supply-chain-finance-go,supply-chain-service,trust-estate-rs
            PRIMARY_LANG=go
            PORT_BASE=9627
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-trade-supply-chain:${{ env.TAG }}
