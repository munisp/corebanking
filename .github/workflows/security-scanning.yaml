name: Security Vulnerability Scanning

on:
  push:
    branches: [main, development, "fix/**", "feat/**"]
  pull_request:
    branches: [main, development]
  schedule:
    # Run daily at 02:00 UTC to catch newly published CVEs
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write  # Required for uploading SARIF to GitHub Security tab

jobs:
  # ── 1. Trivy: Docker image scanning ──────────────────────────────────────
  trivy-docker-images:
    name: Trivy — Docker Image Scan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - "redis:7.4.6-alpine"
          - "temporalio/auto-setup:1.30.3"
          - "quay.io/keycloak/keycloak:24.0.9"
          - "apache/apisix:3.11.0-debian"
          - "opensearchproject/opensearch:2.19.0"
          - "confluentinc/cp-kafka:7.6.5"
          - "ghcr.io/permify/permify:v1.1.4"
          - "postgres:16-alpine"
    steps:
      - name: Run Trivy vulnerability scanner on ${{ matrix.image }}
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: ${{ matrix.image }}
          format: "sarif"
          output: "trivy-${{ strategy.job-index }}.sarif"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-${{ strategy.job-index }}.sarif"
          category: "trivy-docker-${{ strategy.job-index }}"

  # ── 2. Trivy: Filesystem scan (IaC, secrets, misconfigs) ─────────────────
  trivy-filesystem:
    name: Trivy — Filesystem & IaC Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.30.0
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          exit-code: "1"
          ignore-unfixed: true
          scanners: "vuln,secret,misconfig"

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-fs.sarif"
          category: "trivy-filesystem"

  # ── 3. OSV-Scanner: Go, Rust, Python, Node.js dependency audit ───────────
  osv-scanner:
    name: OSV-Scanner — Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run OSV-Scanner
        uses: google/osv-scanner-action@v2
        with:
          scan-args: |-
            --recursive
            --format=sarif
            --output=osv-results.sarif
            .

      - name: Upload OSV-Scanner results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "osv-results.sarif"
          category: "osv-scanner"

  # ── 4. npm audit: Node.js packages ───────────────────────────────────────
  npm-audit:
    name: npm audit — Node.js Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run npm audit (fail on high/critical)
        run: npm audit --audit-level=high --json > npm-audit.json || true

      - name: Parse and report npm audit results
        run: |
          node -e "
            const audit = require('./npm-audit.json');
            const vulns = audit.vulnerabilities || {};
            const critical = Object.values(vulns).filter(v => v.severity === 'critical');
            const high = Object.values(vulns).filter(v => v.severity === 'high');
            console.log('Critical:', critical.length, '| High:', high.length);
            if (critical.length > 0 || high.length > 0) {
              console.error('FAIL: Critical or high severity vulnerabilities found');
              process.exit(1);
            }
          "

  # ── 5. Cargo audit: Rust crates ──────────────────────────────────────────
  cargo-audit:
    name: cargo-audit — Rust Crates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit on all workspace Cargo.toml files
        run: |
          EXIT_CODE=0
          for cargo_file in $(find services -name "Cargo.toml" | head -50); do
            dir=$(dirname "$cargo_file")
            echo "Auditing $dir..."
            cd "$dir"
            cargo audit --deny warnings 2>&1 || EXIT_CODE=1
            cd /home/runner/work/corebanking/corebanking
          done
          exit $EXIT_CODE

  # ── 6. pip-audit: Python packages ────────────────────────────────────────
  pip-audit:
    name: pip-audit — Python Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit on all requirements.txt files
        run: |
          EXIT_CODE=0
          for req in $(find services -name "requirements.txt" | head -50); do
            echo "Auditing $req..."
            pip-audit -r "$req" --fix --dry-run -f json 2>/dev/null | python3 -c "
          import sys, json
          data = json.load(sys.stdin)
          vulns = data.get('dependencies', [])
          critical = [v for d in vulns for v in d.get('vulns', []) if v.get('fix_versions')]
          if critical:
              print(f'  WARN: {len(critical)} fixable vulnerabilities in $req')
          " || true
          done

  # ── 7. Secret scanning: Gitleaks ─────────────────────────────────────────
  gitleaks:
    name: Gitleaks — Secret Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for secret scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 8. CodeQL: SAST for JavaScript/TypeScript ────────────────────────────
  codeql:
    name: CodeQL — Static Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
