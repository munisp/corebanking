name: Build Infra Database Consolidated Service

on:
  push:
    branches:
      - main
      - development
    paths:
      - 'services/avro-schema-registry-go/**'
      - 'services/backup-manager-py/**'
      - 'services/data-export-rs/**'
      - 'services/db-migration-manager-go/**'
      - 'services/db-migrations/**'
      - 'services/pgbouncer-manager-go/**'
      - 'services/read-replica-router-rs/**'
      - 'services/route-schema-enforcer-go/**'
      - 'services/table-partitioner-rs/**'
      - 'docker/Dockerfile.consolidated'
      - 'docker/build-services.sh'
      - '.github/workflows/infra-database.yaml'

env:
  TAG: "0.0.2"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/Dockerfile.consolidated
          push: true
          build-args: |
            SERVICES=avro-schema-registry-go,backup-manager-py,data-export-rs,db-migration-manager-go,db-migrations,pgbouncer-manager-go,read-replica-router-rs,route-schema-enforcer-go,table-partitioner-rs
            PRIMARY_LANG=go
            PORT_BASE=9400
          tags: registry.digitalocean.com/talentgraph-auth/54link-dev-infra-database:${{ env.TAG }}
