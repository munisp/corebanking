name: Build and Deploy Agent Banking Service

on:
  push:
    branches:
      - main
    paths:
      - 'services/agent-banking-go/**'
      - 'infrastructure/charts/agent-banking-go/**'
      - 'infrastructure/apisix-resources/routes/agent-banking-go.yaml'
      - '.github/workflows/agent-banking-go.yaml'

env:
  IMAGE: registry.digitalocean.com/talentgraph-auth/54link-dev-agent-banking-go
  TAG: "0.0.1"
  CHART: infrastructure/charts/agent-banking-go
  RELEASE: agent-banking-go
  NAMESPACE: 54link-dev

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to DigitalOcean Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.digitalocean.com
          username: docker
          password: ${{ secrets.DO_API_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent-banking-go
          file: ./services/agent-banking-go/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

