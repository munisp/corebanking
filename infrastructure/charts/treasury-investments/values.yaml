  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
secrets:
  APP_PORT: "9641"
  PORT_BASE: "9641"
  SERVICE_GROUP: treasury-investments
  SERVICES: "cash-pooling-go,commodity-exchange-rs,commodity-price-intelligence-py,custody-service-go,etd-trading-rs,insurance-portfolio-analytics-py,money-market-rs,multicurrency-revaluation-rs,otc-derivatives-rs,portfolio-mgmt-rs,securities-trading-rs,treasury-liquidity-py,treasury-liquidity-rs,treasury-service,wealth-mgmt-py"
