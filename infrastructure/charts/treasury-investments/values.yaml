replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54link-dev-treasury-investments
  pullPolicy: IfNotPresent
  tag: "0.0.2"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  name: 54link
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  ports:
    - port: 9641
    - port: 9642
    - port: 9643
    - port: 9644
    - port: 9645
    - port: 9646
    - port: 9647
    - port: 9648
    - port: 9649
    - port: 9650
    - port: 9651
    - port: 9652
    - port: 9653
    - port: 9654
    - port: 9655
