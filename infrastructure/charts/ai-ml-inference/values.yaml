replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54link-dev-ai-ml-inference
  pullPolicy: IfNotPresent
  tag: "0.0.2"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  name: 54link
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  ports:
    - port: 9128
    - port: 9129
    - port: 9130
    - port: 9131
    - port: 9132
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    ephemeral-storage: 2Gi
    cpu: 500m
    memory: 1Gi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: ai-ml-inference
  appPort: 9130
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
secrets:
  APP_PORT: "9128"
  PORT_BASE: "9128"
  SERVICE_GROUP: ai-ml-inference
  SERVICES: "art-adversarial-robustness-py,crop-yield-prediction-py,customer-insights-py,ml-service,soil-analysis-py"
