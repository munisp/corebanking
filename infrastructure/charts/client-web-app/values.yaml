replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54link-dev-client-web-app
  pullPolicy: IfNotPresent
  tag: 0.0.3
nameOverride: ''
fullnameOverride: ''
serviceAccount:
  create: false
  name: 54link
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  targetPort: 5173
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    ephemeral-storage: 2Gi
    cpu: 750m
    memory: 1000Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
