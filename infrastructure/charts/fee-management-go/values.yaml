replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54link-dev-fee-management-go
  pullPolicy: IfNotPresent
  tag: "0.0.2"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  name: 54link
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  ports:
    - port: 8080
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    ephemeral-storage: 1Gi
    cpu: 200m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: fee-management-go
  appPort: 8080
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
secrets:
  APP_PORT: "8080"
  PORT: "8080"
  PORT_BASE: "8080"
  SERVICE_GROUP: fee-management-go
  SERVICES: "fee-management-go"
