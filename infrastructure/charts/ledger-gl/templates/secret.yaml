apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ledger-gl.fullname" . }}-secrets
type: Opaque
stringData:
  # Fail-closed: the Postgres connection URL (contains credentials) is
  # injected at deploy time and is never stored in version control.
  POSTGRES_URL: {{ required "secrets.POSTGRES_URL must be set (inject the Postgres connection URL at deploy time, e.g. helm --set secrets.POSTGRES_URL=...)" .Values.secrets.POSTGRES_URL | quote }}
{{- range $key, $value := .Values.secrets }}
{{- if ne $key "POSTGRES_URL" }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
