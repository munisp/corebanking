replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54link-dev-cheque-clearing-go
  pullPolicy: IfNotPresent
  tag: "0.0.1"
nameOverride: ""
fullnameOverride: "cheque-clearing-go"
serviceAccount:
  create: false
  name: 54link
podAnnotations: {}
podLabels: {}
service:
  type: ClusterIP
  port: 8080
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    ephemeral-storage: 512Mi
    cpu: 200m
    memory: 256Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
dapr:
  appId: cheque-clearing-go
  appPort: 8080
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 50m
  cpu-limit: 150m
  memory-request: 64Mi
  memory-limit: 256Mi
secrets:
  PORT: "8080"
  SERVICE_NAME: cheque-clearing-go
  ACCOUNT_SVC_URL: "http://core-accounts.54link-dev.svc.cluster.local:9280"
  MOJALOOP_CONNECTOR_URL: "http://mojaloop-connector.54link-dev.svc.cluster.local:9489"
