apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "compliance-service.fullname" . }}
  labels:
    {{- include "compliance-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "compliance-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        dapr.io/app-id: "{{ .Values.dapr.appId }}"
        dapr.io/app-port: "{{ .Values.dapr.appPort }}"
        dapr.io/enable-metrics: "{{ .Values.dapr.enableMetrics }}"
        dapr.io/enabled: "{{ .Values.dapr.enabled }}"
        dapr.io/metrics-port: "{{ .Values.dapr.metricsPort }}"
        dapr.io/sidecar-listen-addresses: "{{ .Values.dapr.sidecarListenAddresses }}"
        dapr.io/log-level: "debug"
        dapr.io/sidecar-cpu-request:    '{{ index .Values.dapr "cpu-request" }}'
        dapr.io/sidecar-cpu-limit:      '{{ index .Values.dapr "cpu-limit" }}'
        dapr.io/sidecar-memory-request: '{{ index .Values.dapr "memory-request" }}'
        dapr.io/sidecar-memory-limit:   '{{ index .Values.dapr "memory-limit" }}'
      labels:
        {{- include "compliance-service.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "compliance-service.serviceAccountName" . }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "compliance-service.fullname" . }}-secrets
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
