apiVersion: v1
kind: Secret
metadata:
  name: {{ include "platform-api.fullname" . }}-secrets
type: Opaque
stringData:
  # Fail-closed: the verification-service Keycloak client secret is injected
  # at deploy time and is never stored in version control.
  VERIFICATION_SVC_CLIENT_SECRET: {{ required "secrets.VERIFICATION_SVC_CLIENT_SECRET must be set (inject the Keycloak client secret at deploy time, e.g. helm --set secrets.VERIFICATION_SVC_CLIENT_SECRET=...)" .Values.secrets.VERIFICATION_SVC_CLIENT_SECRET | quote }}
{{- range $key, $value := .Values.secrets }}
{{- if ne $key "VERIFICATION_SVC_CLIENT_SECRET" }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
