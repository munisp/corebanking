replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54link-dev-core-accounts
  pullPolicy: IfNotPresent
  tag: "0.0.10"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  name: 54link
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  ports:
    - port: 9278
    - port: 9279
    - port: 9280
    - port: 9281
    - port: 9282
    - port: 9283
    - port: 9284
    - port: 9285
    - port: 9286
    - port: 9287
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    ephemeral-storage: 2Gi
    cpu: 500m
    memory: 1Gi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: core-accounts
  appPort: 9280
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
secrets:
  APP_PORT: "9278"
  PORT_BASE: "9278"
  SERVICE_GROUP: core-accounts
  SERVICES: "account-closure-go,account-opening-go,account-service,account-statement-go,agent-account-opening-py,cif-management-go,customer-onboarding,dormancy-management-rs,virtual-account-service,virtual-accounts-go"
