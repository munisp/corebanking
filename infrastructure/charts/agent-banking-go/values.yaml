replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54link-dev-agent-banking-go
  pullPolicy: IfNotPresent
  tag: "0.0.1"
nameOverride: ""
fullnameOverride: "agent-banking-go"
serviceAccount:
  create: false
  name: 54link
podAnnotations: {}
podLabels: {}
service:
  type: ClusterIP
  port: 8080
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    ephemeral-storage: 512Mi
    cpu: 300m
    memory: 512Mi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
nodeSelector: {}
tolerations: []
dapr:
  appId: agent-banking-go
  appPort: 8080
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 50m
  cpu-limit: 150m
  memory-request: 128Mi
  memory-limit: 512Mi
secrets:
  PORT: "8080"
