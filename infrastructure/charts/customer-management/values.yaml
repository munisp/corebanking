replicaCount: 1
image:
  repository: registry.digitalocean.com/talentgraph-auth/54link-dev-customer-management
  pullPolicy: IfNotPresent
  tag: "0.0.1"
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: false
  name: 54link
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  ports:
    - port: 9348
    - port: 9349
    - port: 9350
    - port: 9351
    - port: 9352
    - port: 9353
resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    ephemeral-storage: 2Gi
    cpu: 500m
    memory: 1Gi
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
volumes: []
volumeMounts: []
nodeSelector: {}
tolerations: []
affinity: {}
dapr:
  appId: customer-management
  appPort: 9351
  enableMetrics: true
  enabled: true
  metricsPort: 9099
  sidecarListenAddresses: "0.0.0.0"
  cpu-request: 100m
  cpu-limit: 300m
  memory-request: 250Mi
  memory-limit: 1000Mi
secrets:
  APP_PORT: "9348"
  PORT_BASE: "9348"
  SERVICE_GROUP: customer-management
  SERVICES: "customer-360-py,customer-engagement-py,customer-feedback-py,expense-mgmt-go,i18n-service-go,relationship-manager-service"
