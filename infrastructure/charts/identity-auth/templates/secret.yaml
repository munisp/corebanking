apiVersion: v1
kind: Secret
metadata:
  name: {{ include "identity-auth.fullname" . }}-secrets
type: Opaque
stringData:
  # Fail-closed: the Keycloak client secret is injected at deploy time and
  # is never stored in version control.
  DEFAULT_CLIENT_SECRET: {{ required "secrets.DEFAULT_CLIENT_SECRET must be set (inject the Keycloak client secret at deploy time, e.g. helm --set secrets.DEFAULT_CLIENT_SECRET=...)" .Values.secrets.DEFAULT_CLIENT_SECRET | quote }}
{{- range $key, $value := .Values.secrets }}
{{- if ne $key "DEFAULT_CLIENT_SECRET" }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
{{- end }}
