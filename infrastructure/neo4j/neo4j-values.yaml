# Neo4j Helm chart values
# Chart: neo4j/neo4j (v5.x / 2026.04.0)
# Consumers: neo4j-knowledge-graph-go (port 8293), neo4j-coa-graph-rs (port 8292)
# Bolt:  neo4j://neo4j.neo4j.svc.cluster.local:7687
# HTTP:  http://neo4j.neo4j.svc.cluster.local:7474

neo4j:
  name: "neo4j"
  password: "StrongPassword123!"
  edition: "community"
  acceptLicenseAgreement: "yes"

volumes:
  data:
    mode: dynamic
    dynamic:
      storageClassName: rook-ceph-block
      requests:
        storage: 50Gi

# Neo4j 5.x config keys (server.* replaces deprecated dbms.*)
config:
  server.default_listen_address: "0.0.0.0"
  server.bolt.enabled: "true"
  server.bolt.listen_address: "0.0.0.0:7687"
  server.bolt.advertised_address: "neo4j.neo4j.svc.cluster.local:7687"
  server.http.enabled: "true"
  server.http.listen_address: "0.0.0.0:7474"
  server.https.enabled: "false"
  dbms.security.auth_enabled: "true"
  dbms.security.procedures.unrestricted: "apoc.*,gds.*"
  dbms.security.procedures.allowlist: "apoc.*,gds.*"
  # Memory — kept low to fit within node capacity
  server.memory.heap.initial_size: "256m"
  server.memory.heap.max_size: "512m"
  server.memory.pagecache.size: "256m"

# APOC + GDS required for graph traversal and knowledge-graph queries
env:
  NEO4J_PLUGINS: '["apoc", "graph-data-science"]'

services:
  neo4j:
    enabled: true
    type: ClusterIP

statefulset:
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
