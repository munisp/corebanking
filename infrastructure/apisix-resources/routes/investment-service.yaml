# investment — served by treasury-service (/api/v1/portfolios)
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-investment-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /investment/*
      backends:
        - serviceName: treasury-investments
          servicePort: 9654
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/investment/v1/portfolios(.*)"
              - "/api/v1/portfolios$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
