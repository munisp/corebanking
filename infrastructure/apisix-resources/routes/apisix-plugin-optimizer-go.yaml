# apisix-plugin-optimizer-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-apisix-plugin-optimizer-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /apisix-plugin-optimizer/*
      backends:
        - serviceName: platform-api
          servicePort: 9498
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/apisix-plugin-optimizer/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
