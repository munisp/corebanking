# adverse-media-scanner-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-adverse-media-scanner-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /adverse-media-scanner/*
      backends:
        - serviceName: compliance-kyc-aml
          servicePort: 9210
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/adverse-media-scanner/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
