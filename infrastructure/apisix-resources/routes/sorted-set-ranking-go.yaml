# sorted-set-ranking-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-sorted-set-ranking-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /sorted-set-ranking/*
      backends:
        - serviceName: specialized-engagement
          servicePort: 9598
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/sorted-set-ranking/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
