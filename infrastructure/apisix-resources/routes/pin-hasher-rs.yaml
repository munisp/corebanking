# pin-hasher-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-pin-hasher-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /pin-hasher/*
      backends:
        - serviceName: core-cards
          servicePort: 9296
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/pin-hasher/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
