# cooperative-credit-scoring-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-cooperative-credit-scoring-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /cooperative-credit-scoring/*
      backends:
        - serviceName: core-lending
          servicePort: 9313
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/cooperative-credit-scoring/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
