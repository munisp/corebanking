# tigerbeetle-protocol-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-tigerbeetle-protocol-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /tigerbeetle-protocol/*
      backends:
        - serviceName: ledger-gl
          servicePort: 9476
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/tigerbeetle-protocol/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
