# education-loans-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-education-loans-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /education-loans/*
      backends:
        - serviceName: core-lending
          servicePort: 9318
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/education-loans/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
