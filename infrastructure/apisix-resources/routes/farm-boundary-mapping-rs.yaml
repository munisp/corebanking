# farm-boundary-mapping-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-farm-boundary-mapping-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /farm-boundary-mapping/*
      backends:
        - serviceName: specialized-agri
          servicePort: 9579
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/farm-boundary-mapping/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
