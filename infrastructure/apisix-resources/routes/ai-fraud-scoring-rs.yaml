# ai-fraud-scoring-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-ai-fraud-scoring-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /ai-fraud-scoring/*
      backends:
        - serviceName: compliance-fraud
          servicePort: 9198
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/ai-fraud-scoring/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
