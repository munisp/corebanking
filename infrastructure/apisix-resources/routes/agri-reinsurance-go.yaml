# agri-reinsurance-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-agri-reinsurance-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /agri-reinsurance/*
      backends:
        - serviceName: specialized-agri
          servicePort: 9569
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/agri-reinsurance/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
