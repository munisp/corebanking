# component-memoizer-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-component-memoizer-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /component-memoizer/*
      backends:
        - serviceName: specialized-engagement
          servicePort: 9593
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/component-memoizer/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
