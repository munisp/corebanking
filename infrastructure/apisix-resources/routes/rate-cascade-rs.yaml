# rate-cascade-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-rate-cascade-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /rate-cascade/*
      backends:
        - serviceName: customer-pricing
          servicePort: 9358
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/rate-cascade/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
