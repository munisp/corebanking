# payment-hub
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-payment-hub-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /payment-hub/*
      backends:
        - serviceName: core-payments
          servicePort: 9336
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/payment-hub(?:/system)?/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
