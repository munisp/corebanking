# escrow-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-escrow-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /escrow/v1/*
      backends:
        - serviceName: trade-supply-chain
          servicePort: 9629
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/escrow/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
