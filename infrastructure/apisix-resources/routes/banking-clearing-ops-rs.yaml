# banking-clearing-ops-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-banking-clearing-ops-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /banking-clearing-ops/*
      backends:
        - serviceName: ledger-reconciliation
          servicePort: 9481
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/banking-clearing-ops/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
