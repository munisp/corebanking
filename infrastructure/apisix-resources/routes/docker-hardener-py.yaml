# docker-hardener-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-docker-hardener-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /docker-hardener/*
      backends:
        - serviceName: security-waf
          servicePort: 9547
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/docker-hardener/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
