# mtls-mesh-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-mtls-mesh-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /mtls-mesh/*
      backends:
        - serviceName: infra-network
          servicePort: 9442
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/mtls-mesh/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
