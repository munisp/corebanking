# loan-calculator-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-loan-calculator-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /loan-calculator/*
      backends:
        - serviceName: core-lending
          servicePort: 9321
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/loan-calculator/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
