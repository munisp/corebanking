# fraudfusion-ensemble-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-fraudfusion-ensemble-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /fraudfusion-ensemble/*
      backends:
        - serviceName: compliance-fraud
          servicePort: 9203
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/fraudfusion-ensemble/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
