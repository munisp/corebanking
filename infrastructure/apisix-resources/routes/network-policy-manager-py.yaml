# network-policy-manager-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-network-policy-manager-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /network-policy-manager/*
      backends:
        - serviceName: infra-network
          servicePort: 9444
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/network-policy-manager/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
