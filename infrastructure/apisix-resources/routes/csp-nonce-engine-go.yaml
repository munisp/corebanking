# csp-nonce-engine-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-csp-nonce-engine-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /csp-nonce-engine/*
      backends:
        - serviceName: security-waf
          servicePort: 9543
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/csp-nonce-engine/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
