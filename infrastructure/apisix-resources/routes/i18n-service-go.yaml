# i18n-service-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-i18n-service-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /i18n/*
      backends:
        - serviceName: customer-management
          servicePort: 9352
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/i18n/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
