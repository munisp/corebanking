# developer-platform-service
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-developer-platform-service-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    # Main Developer Platform API
    - name: developer-platform-api
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /developers/*
          - /v1/apps/*
          - /v1/marketplace/*
          - /v1/oauth/*
          - /v1/sandbox/*
          - /v1/monetization/*
          - /v1/tenants/*
          - /v1/gateway/*
          - /v1/fees/*
          - /v1/security/*
      backends:
        - serviceName: channels-mobile-web
          servicePort: 9170
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"

    # Admin API Routes
    - name: developer-platform-admin-api
      priority: 11
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /v1/admin/developers/*
          - /v1/admin/organizations/*
          - /v1/admin/kyb/*
          - /v1/admin/apps/*
          - /v1/admin/security/*
          - /v1/admin/marketplace/*
          - /v1/admin/fees/*
          - /v1/admin/analytics/*
          - /v1/admin/tenants/*
          - /v1/admin/config/*
          - /v1/admin/system/*
          - /v1/admin/audit/*
          - /v1/admin/emergency/*
          - /v1/admin/bulk/*
      backends:
        - serviceName: channels-mobile-web
          servicePort: 9170
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
        # TODO: Add admin authentication/authorization
        # - name: jwt-auth
        #   enable: true
        #   config:
        #     key: admin-jwt-key
        #     secret: admin-jwt-secret

    # Health and Metrics Endpoints
    - name: developer-platform-health
      priority: 12
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /health
          - /metrics
      backends:
        - serviceName: channels-mobile-web
          servicePort: 9170
      plugins:
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
        # - name: 54link-access-plugin
        #   enable: true
        #   config:
        #     authorizer_url: "http://auth-service/token"
        #     keycloak_public_key_url: "http://tenant-management/tenant/keycloak-public-key/"
        # - name: ucard-jwt-payload-decoder
        #   enable: true
        #   config:
        #     authorizer_url: "http://auth-service.54link-dev.svc.cluster.local/token/validate"
