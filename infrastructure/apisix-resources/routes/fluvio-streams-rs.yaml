# fluvio-streams-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-fluvio-streams-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /fluvio-streams/*
      backends:
        - serviceName: infra-messaging
          servicePort: 9421
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/fluvio-streams/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
