# tenant-web-app (PUP)
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-tenant-web-app-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    # Static hashed assets — immutable cache (1 year)
    - name: hashed-assets
      priority: 20
      match:
        hosts:
          - pup.54link-dev.upi.dev
        paths:
          - /assets/*
      backends:
        - serviceName: pup-web-app
          servicePort: 80
      plugins:
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                Cache-Control: "public, max-age=31536000, immutable"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"

    # Service worker — never cache
    - name: service-worker
      priority: 15
      match:
        hosts:
          - pup.54link-dev.upi.dev
        paths:
          - /sw.js
      backends:
        - serviceName: pup-web-app
          servicePort: 80
      plugins:
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                Cache-Control: "no-cache, no-store, must-revalidate"
                Pragma: "no-cache"
                Expires: "0"

    # HTML pages and fallback — no cache
    - name: html-no-cache
      priority: 10
      match:
        hosts:
          - pup.54link-dev.upi.dev
        paths:
          - /*
      backends:
        - serviceName: pup-web-app
          servicePort: 80
      plugins:
        - name: response-rewrite
          enable: true
          config:
            headers:
              set:
                Cache-Control: "no-cache, no-store, must-revalidate"
                Pragma: "no-cache"
                Expires: "0"
        - name: cors
          enable: true
          config:
            allow_origins: "https://54link-dev.upi.dev,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
            allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allow_headers: "Content-Type,Authorization,x-keycloak-realm,X-API-Key,X-Request-Id,X-Request-ID,X-Correlation-Id,X-Trace-Id,X-CSRF-Token,Idempotency-Key,x-idempotency-key,x-tenant-id,X-Tenant-ID,x-tenant-name,X-Tenant-Name,x-keycloak-id,X-Keycloak-ID,x-ledger-id,X-Ledger-ID,x-mint-id,X-Mint-ID,x-mint-account-id,X-Mint-Account-ID,x-staff-id,X-Staff-ID,x-user-id,X-User-ID,x-user-role,X-User-Role,x-branch-id,X-Branch-ID,x-customer-id,X-Customer-ID,x-default-account-id,X-Default-Account-ID,x-device-id,X-Device-ID,x-actor-id,X-Actor-ID,x-bank-code,X-Bank-Code,x-bank-id,X-Bank-ID,x-client-id,X-Client-ID,x-merchant-id,X-Merchant-ID,x-network-type,X-Network-Type,x-service-name,X-Service-Name,x-source-service,X-Source-Service,x-synthetic-test,X-Synthetic-Test,X-Timestamp,x-keycloak-pub-key,X-Keycloak-Pub-Key,x-operator-role,X-Operator-Role,x-switch-name,X-Switch-Name,x-ams-name,X-Ams-Name"
            expose_headers: "Content-Length"
