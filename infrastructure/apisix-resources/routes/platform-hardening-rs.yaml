# platform-hardening-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-platform-hardening-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /platform-hardening/*
      backends:
        - serviceName: workflow-operations
          servicePort: 9696
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/platform-hardening/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
