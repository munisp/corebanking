# cdn-edge-cache-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-cdn-edge-cache-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /cdn-edge-cache/*
      backends:
        - serviceName: infra-caching
          servicePort: 9389
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/cdn-edge-cache/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
