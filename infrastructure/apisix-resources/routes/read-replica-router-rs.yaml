# read-replica-router-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-read-replica-router-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /read-replica-router/*
      backends:
        - serviceName: infra-database
          servicePort: 9410
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/read-replica-router/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
