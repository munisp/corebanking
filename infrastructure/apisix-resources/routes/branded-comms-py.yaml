# branded-comms-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-branded-comms-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /branded-comms/*
      backends:
        - serviceName: channels-messaging
          servicePort: 9145
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/branded-comms/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
