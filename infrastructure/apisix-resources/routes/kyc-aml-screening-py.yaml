# kyc-aml-screening-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-kyc-aml-screening-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /kyc-aml-screening/*
      backends:
        - serviceName: compliance-kyc-aml
          servicePort: 9225
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/kyc-aml-screening/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
