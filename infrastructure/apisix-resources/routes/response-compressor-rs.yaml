# response-compressor-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-response-compressor-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /response-compressor/*
      backends:
        - serviceName: workflow-operations
          servicePort: 9711
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/response-compressor/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
