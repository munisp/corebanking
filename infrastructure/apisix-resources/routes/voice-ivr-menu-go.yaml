# voice-ivr-menu-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-voice-ivr-menu-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /voice-ivr-menu/*
      backends:
        - serviceName: channels-voice
          servicePort: 9192
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/voice-ivr-menu/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
