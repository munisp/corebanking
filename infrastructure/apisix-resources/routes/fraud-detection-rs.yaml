# fraud-detection-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-fraud-detection-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /fraud-detection/*
      backends:
        - serviceName: compliance-fraud
          servicePort: 9200
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/fraud-detection/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
