# optimistic-ui-engine-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-optimistic-ui-engine-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /optimistic-ui-engine/*
      backends:
        - serviceName: specialized-engagement
          servicePort: 9596
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/optimistic-ui-engine/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
