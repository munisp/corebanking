# bloom-filter-cache-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-bloom-filter-cache-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /bloom-filter-cache/*
      backends:
        - serviceName: infra-caching
          servicePort: 9387
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/bloom-filter-cache/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
