apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: kpi-engine-go
  namespace: 54link-dev
spec:
  http:
    - name: kpi-engine-go
      match:
        hosts:
          - 54link.upi.dev
        paths:
          - /kpi-engine-go/*
      backends:
        - serviceName: workflow-reporting
          servicePort: 9732
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/kpi-engine-go/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Authorization,Content-Type,x-tenant-id,x-keycloak-id"
        # - name: 54link-access-plugin
        #   enable: true
        #   config:
        #     authorizer_url: "http://auth-service/token"
        #     keycloak_public_key_url: "http://tenant-management/tenant/keycloak-public-key/"
