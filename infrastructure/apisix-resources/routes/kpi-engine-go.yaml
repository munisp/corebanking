apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: kpi-engine-go
  namespace: 54link-dev
spec:
  http:
    - name: kpi-engine-go
      match:
        hosts:
          - 54link.upi.dev
        paths:
          - /kpi-engine-go/*
      backends:
        - serviceName: workflow-reporting
          servicePort: 9732
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/kpi-engine-go/(.*)"
              - "/$1"
        - name: 54link-jwt-payload-decoder
          enable: true
          config: {}
        - name: 54link-access-plugin
          enable: true
          config:
            authorizer_url: "http://auth-service/token"
            mint_account_url: "http://core-accounts/system/create-mint-account"
            keycloak_public_key_url: "http://platform-tenant/tenant/keycloak-public-key"
        - name: cors
          enable: true
          config:
            allow_origins: "https://54link-dev.upi.dev,http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173"
            allow_methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
            allow_headers: "Content-Type,Authorization,X-API-Key,X-Request-Id,X-Request-ID,X-Correlation-Id,X-Trace-Id,X-CSRF-Token,Idempotency-Key,x-idempotency-key,x-tenant-id,X-Tenant-ID,x-tenant-name,X-Tenant-Name,x-keycloak-id,X-Keycloak-ID,x-ledger-id,X-Ledger-ID,x-mint-id,X-Mint-ID,x-mint-account-id,X-Mint-Account-ID,x-staff-id,X-Staff-ID,x-user-id,X-User-ID,x-user-role,X-User-Role,x-branch-id,X-Branch-ID,x-customer-id,X-Customer-ID,x-default-account-id,X-Default-Account-ID,x-device-id,X-Device-ID,x-actor-id,X-Actor-ID,x-bank-code,X-Bank-Code,x-bank-id,X-Bank-ID,x-client-id,X-Client-ID,x-merchant-id,X-Merchant-ID,x-network-type,X-Network-Type,x-service-name,X-Service-Name,x-source-service,X-Source-Service,x-synthetic-test,X-Synthetic-Test,X-Timestamp"
            expose_headers: "Content-Length"
