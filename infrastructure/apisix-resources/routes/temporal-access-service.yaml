# temporal-access-service
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-temporal-access-service-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-options-preflight
      priority: 20
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /temporal-access/*
        methods:
          - OPTIONS
      backends:
        - serviceName: workflow-batch
          servicePort: 9663
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/temporal-access(?:/system)?/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
            allow_headers: "*"
            expose_headers: "*"
            max_age: 3600
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /temporal-access/*
      backends:
        - serviceName: workflow-batch
          servicePort: 9663
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/temporal-access(?:/system)?/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "GET, POST, PUT, DELETE, OPTIONS"
            allow_headers: "*"
            expose_headers: "*"
            max_age: 3600
