# platform-security-infra-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-platform-security-infra-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /platform-security-infra/*
      backends:
        - serviceName: workflow-operations
          servicePort: 9697
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/platform-security-infra/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
