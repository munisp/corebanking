# safe-deposit-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-safe-deposit-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /safe-deposit/*
      backends:
        - serviceName: safe-deposit-go
          servicePort: 9423
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/safe-deposit(.*)"
              - "$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
