# ctr-auto-filer-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-ctr-auto-filer-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /ctr-auto-filer/*
      backends:
        - serviceName: compliance-regulatory
          servicePort: 9254
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/ctr-auto-filer/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
