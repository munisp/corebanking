# iso20022-hub-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-iso20022-hub-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /iso20022/*
      backends:
        - serviceName: trade-fx
          servicePort: 9618
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/iso20022/v1/(.*)"
              - "/v1/iso20022/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
