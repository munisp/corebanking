# multi-bureau-verification-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-multi-bureau-verification-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /multi-bureau-verification/*
      backends:
        - serviceName: compliance-kyc-aml
          servicePort: 9231
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/multi-bureau-verification/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
