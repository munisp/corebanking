# payment-investigation — served by transaction-ledger
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-payment-investigation-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /payment-investigation/*
      backends:
        - serviceName: ledger-gl
          servicePort: 9478
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/payment-investigation/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
