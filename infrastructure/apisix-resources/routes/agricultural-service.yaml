# agricultural-service
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-agricultural-service-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /agricultural/*
          - /agriculture/*
      backends:
        - serviceName: agricultural-service
          servicePort: 8015
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/agricultural/(.*)"
              - "/$1"
              - "^/agriculture/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
        # - name: 54link-access-plugin
        #   enable: true
        #   config:
        #     authorizer_url: "http://auth-service/token"
        #     keycloak_public_key_url: "http://tenant-management/tenant/keycloak-public-key/"
        # - name: ucard-jwt-payload-decoder
        #   enable: true
        #   config:
        #     authorizer_url: "http://auth-service.54link-dev.svc.cluster.local/token/validate"
    - name: rule-2
      priority: 20
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /agent-banking/*
      backends:
        - serviceName: agricultural-service
          servicePort: 8015
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/agent-banking/v1/agent-banking(.*)"
              - "/api/v1/agent-banking$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
