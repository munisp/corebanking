# agri-iot-sensor-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-agri-iot-sensor-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /agri-iot-sensor/*
      backends:
        - serviceName: specialized-agri
          servicePort: 9567
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/agri-iot-sensor/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
