# crop-yield-prediction-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-crop-yield-prediction-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /crop-yield-prediction/*
      backends:
        - serviceName: ai-ml-inference
          servicePort: 9129
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/crop-yield-prediction/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
