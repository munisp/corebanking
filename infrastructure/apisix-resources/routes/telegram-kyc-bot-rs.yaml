# telegram-kyc-bot-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-telegram-kyc-bot-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /telegram-kyc-bot/*
      backends:
        - serviceName: compliance-kyc-aml
          servicePort: 9238
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/telegram-kyc-bot/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
