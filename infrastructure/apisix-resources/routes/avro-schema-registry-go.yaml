# avro-schema-registry-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-avro-schema-registry-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /avro-schema-registry/*
      backends:
        - serviceName: infra-database
          servicePort: 9400
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/avro-schema-registry/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
