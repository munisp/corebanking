# bulk-payments-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-bulk-payments-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /bulk-payments/*
      backends:
        - serviceName: bulk-payments-rs
          servicePort: 8130
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/bulk-payments/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
