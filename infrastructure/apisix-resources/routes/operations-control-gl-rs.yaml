# operations-control-gl-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-operations-control-gl-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /operations-control-gl/*
      backends:
        - serviceName: ledger-gl
          servicePort: 9470
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/operations-control-gl/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
