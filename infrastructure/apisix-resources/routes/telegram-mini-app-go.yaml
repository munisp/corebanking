# telegram-mini-app-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-telegram-mini-app-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /telegram-mini-app/*
      backends:
        - serviceName: channels-messaging
          servicePort: 9158
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/telegram-mini-app/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
