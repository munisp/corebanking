# apm-sentry-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-apm-sentry-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /apm-sentry/*
      backends:
        - serviceName: infra-observability
          servicePort: 9451
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/apm-sentry/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
