# soc2-evidence-collector-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-soc2-evidence-collector-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /soc2-evidence-collector/*
      backends:
        - serviceName: compliance-regulatory
          servicePort: 9267
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/soc2-evidence-collector/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
