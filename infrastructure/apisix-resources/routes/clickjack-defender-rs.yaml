# clickjack-defender-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-clickjack-defender-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /clickjack-defender/*
      backends:
        - serviceName: security-waf
          servicePort: 9541
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/clickjack-defender/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
        # - name: 54link-access-plugin
        #   enable: true
        #   config:
        #     authorizer_url: "http://auth-service/token"
        #     keycloak_public_key_url: "http://tenant-management/tenant/keycloak-public-key/"
