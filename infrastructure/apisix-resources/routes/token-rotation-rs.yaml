# token-rotation-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-token-rotation-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /token-rotation/*
      backends:
        - serviceName: identity-auth
          servicePort: 9381
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/token-rotation/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
