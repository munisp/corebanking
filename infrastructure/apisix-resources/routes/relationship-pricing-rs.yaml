# relationship-pricing-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-relationship-pricing-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /relationship-pricing/*
      backends:
        - serviceName: customer-pricing
          servicePort: 9360
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/relationship-pricing/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
