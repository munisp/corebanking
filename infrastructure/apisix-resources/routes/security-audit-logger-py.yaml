# security-audit-logger-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-security-audit-logger-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /security-audit-logger/*
      backends:
        - serviceName: workflow-operations
          servicePort: 9700
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/security-audit-logger/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
