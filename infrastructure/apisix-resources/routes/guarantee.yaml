# bank guarantees — served by trade-finance-service
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-guarantee-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /guarantees/*
      backends:
        - serviceName: trade-fx
          servicePort: 9624
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/guarantees/v1/(.*)"
              - "/api/v1/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
