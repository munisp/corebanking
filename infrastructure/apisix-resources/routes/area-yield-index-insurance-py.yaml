# area-yield-index-insurance-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-area-yield-index-insurance-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /area-yield-index-insurance/*
      backends:
        - serviceName: specialized-islamic
          servicePort: 9602
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/area-yield-index-insurance/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
