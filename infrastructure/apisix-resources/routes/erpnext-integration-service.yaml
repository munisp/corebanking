# erpnext-integration-service
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-erpnext-integration-service-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /erp/*
          - /v1/connections*
          - /v1/bank-accounts*
          - /v1/payments*
          - /v1/invoices*
          - /v1/loans*
          - /v1/cash-position*
          - /v1/cash-forecast*
          - /v1/reconciliation*
          - /v1/sync*
          - /v1/mappings*
          - /v1/webhooks*
          - /v1/reports*
          - /v1/oauth*
      backends:
        - serviceName: erp-integration
          servicePort: 9751
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/erp(?:/system)?/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
