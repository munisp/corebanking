# beneficial-ownership-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-beneficial-ownership-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /beneficial-ownership/*
      backends:
        - serviceName: beneficial-ownership-go
          servicePort: 9096
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/beneficial-ownership/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
