# customer-360-dashboard-py
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-customer-360-dashboard-py-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /customer-360-dashboard/*
      backends:
        - serviceName: workflow-reporting
          servicePort: 9730
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/customer-360-dashboard/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
