# route-schema-enforcer-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-route-schema-enforcer-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /route-schema-enforcer/*
      backends:
        - serviceName: infra-database
          servicePort: 9411
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/route-schema-enforcer/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
