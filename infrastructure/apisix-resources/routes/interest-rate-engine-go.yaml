# interest-rate-engine-go
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-interest-rate-engine-go-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /interest-rate-engine/*
      backends:
        - serviceName: interest-rate-engine-go
          servicePort: 9373
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/interest-rate-engine/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
