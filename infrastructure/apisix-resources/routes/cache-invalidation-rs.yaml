# cache-invalidation-rs
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-cache-invalidation-rs-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /cache-invalidation/*
      backends:
        - serviceName: infra-caching
          servicePort: 9388
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/cache-invalidation/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "*"
            allow_methods: "*"
            allow_headers: "*"
            expose_headers: "*"
