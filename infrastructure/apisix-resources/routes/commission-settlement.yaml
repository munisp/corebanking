# commission-settlement-service
# Routes /commission/* → commission-settlement-service
# The proxy-rewrite strips the /commission prefix and rewrites to /api/v1/*
# so the upstream receives e.g.  /api/v1/commissions  directly.
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: 54link-dev-commission-settlement-route
  namespace: 54link-dev
spec:
  ingressClassName: apisix
  http:
    - name: rule-1
      priority: 10
      match:
        hosts:
          - 54link-dev.upi.dev
        paths:
          - /commission/*
      backends:
        - serviceName: core-payments
          servicePort: 9333
          resolveGranularity: service
      plugins:
        - name: proxy-rewrite
          enable: true
          config:
            regex_uri:
              - "^/commission/(.*)"
              - "/$1"
        - name: cors
          enable: true
          config:
            allow_origins: "https://54link-dev.upi.dev,http://localhost:3000,http://localhost:5173"
            allow_methods: "GET,POST,PUT,DELETE,OPTIONS"
            allow_headers: "Content-Type,Authorization,x-tenant-id,x-keycloak-id,x-ledger-id,x-idempotency-key"
            expose_headers: "Content-Length"
        # - name: 54link-access-plugin
        #   enable: true
        #   config:
        #     authorizer_url: "http://auth-service/token"
        #     keycloak_public_key_url: "http://tenant-management/tenant/keycloak-public-key/"
