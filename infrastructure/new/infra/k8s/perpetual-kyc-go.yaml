apiVersion: apps/v1
kind: Deployment
metadata:
  name: perpetual-kyc-go
  labels:
    app: perpetual-kyc-go
    tier: platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: perpetual-kyc-go
  template:
    metadata:
      labels:
        app: perpetual-kyc-go
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z postgres 5432; do sleep 2; done"]
        - name: wait-for-kafka
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z kafka 9092; do sleep 2; done"]
      containers:
        - name: perpetual-kyc-go
          image: 54bank/perpetual-kyc-go:latest
          ports:
            - containerPort: 9041
          env:
            - name: PORT
              value: "9041"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            - name: KAFKA_BROKERS
              value: "kafka:9092"
            - name: REDIS_URL
              value: "redis://redis:6379"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 9041
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 9041
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: perpetual-kyc-go
spec:
  selector:
    app: perpetual-kyc-go
  ports:
    - port: 9041
      targetPort: 9041
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: perpetual-kyc-go-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: perpetual-kyc-go
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: perpetual-kyc-go-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: perpetual-kyc-go
