version: '3.8'

# 54Bank Observability Stack
# Prometheus + Alertmanager + Grafana + Exporters

services:
  # ── Prometheus ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: 54bank-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      - '9090:9090'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9090/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Alertmanager ────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: 54bank-alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=:9093'
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - '9093:9093'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:9093/-/healthy']
      interval: 15s
      timeout: 5s
      retries: 3

  # ── Grafana ─────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: 54bank-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-54bank-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/platform-overview.json
    volumes:
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - '3001:3000'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://localhost:3000/api/health']
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      - prometheus

  # ── Postgres Exporter ───────────────────────────────────────
  postgres-exporter:
    image: quay.io/prometheuscommunity/postgres-exporter:v0.15.0
    container_name: 54bank-postgres-exporter
    environment:
      # R4-V5: no credential-bearing default. Required env ref — docker compose
      # fails at parse/up time when POSTGRES_EXPORTER_DSN is unset.
      DATA_SOURCE_NAME: ${POSTGRES_EXPORTER_DSN:?POSTGRES_EXPORTER_DSN is required (no default credentials shipped)}
    ports:
      - '9187:9187'
    restart: unless-stopped

  # ── Redis Exporter ──────────────────────────────────────────
  redis-exporter:
    image: oliver006/redis_exporter:v1.58.0
    container_name: 54bank-redis-exporter
    environment:
      REDIS_ADDR: redis-master:6379
    ports:
      - '9121:9121'
    restart: unless-stopped

  # ── Kafka Exporter ──────────────────────────────────────────
  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.7.0
    container_name: 54bank-kafka-exporter
    command: --kafka.server=kafka:9092
    ports:
      - '9308:9308'
    restart: unless-stopped

  # ── Node Exporter (host metrics) ────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: 54bank-node-exporter
    command:
      - '--path.rootfs=/host'
    volumes:
      - /:/host:ro
    ports:
      - '9100:9100'
    restart: unless-stopped
    network_mode: host
    pid: host

  # ── cAdvisor (container metrics) ────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: 54bank-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - '8080:8080'
    restart: unless-stopped

  # ── Jaeger (distributed tracing) ────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: 54bank-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: 'true'
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: 'false'
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
    volumes:
      - jaeger-data:/badger
    ports:
      - '16686:16686'   # UI
      - '4317:4317'     # OTLP gRPC
      - '4318:4318'     # OTLP HTTP
      - '14268:14268'   # Collector HTTP
    restart: unless-stopped

  # ── Pyroscope (continuous profiling) ─────────────────────────
  pyroscope:
    image: grafana/pyroscope:1.4.0
    container_name: 54bank-pyroscope
    ports:
      - '4040:4040'
    volumes:
      - pyroscope-data:/data
    restart: unless-stopped

volumes:
  prometheus-data:
  alertmanager-data:
  grafana-data:
  jaeger-data:
  pyroscope-data:
