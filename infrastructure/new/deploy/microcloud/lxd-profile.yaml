# ─────────────────────────────────────────────────────────────
# 54Bank MicroCloud / LXD Deployment Profile
# For on-premise deployment on Canonical MicroCloud clusters
#
# Prerequisites:
#   - 3+ bare metal nodes with Ubuntu 22.04+
#   - MicroCloud initialized: sudo snap install microcloud && sudo microcloud init
#   - LXD, MicroCeph, MicroOVN configured via MicroCloud init
#
# Usage:
#   lxc profile create 54bank < deploy/microcloud/lxd-profile.yaml
#   ./deploy/microcloud/deploy.sh
# ─────────────────────────────────────────────────────────────

config:
  # Resource limits
  limits.cpu: "4"
  limits.memory: 16GB
  limits.memory.swap: "false"
  
  # Security — allow nested containers (for K8s)
  security.nesting: "true"
  security.syscalls.intercept.mknod: "true"
  security.syscalls.intercept.setxattr: "true"
  
  # Kernel tuning for Postgres
  linux.kernel_modules: ip_tables,ip6_tables,netlink_diag,nf_nat,overlay,br_netfilter
  
  # Cloud-init for automatic setup
  user.user-data: |
    #cloud-config
    package_update: true
    packages:
      - postgresql-16
      - redis-server
      - pgbouncer
      - curl
      - jq
      - htop
      - iotop
    
    write_files:
      - path: /etc/sysctl.d/99-54bank.conf
        content: |
          vm.overcommit_memory = 2
          vm.overcommit_ratio = 90
          vm.swappiness = 1
          vm.dirty_ratio = 10
          vm.dirty_background_ratio = 3
          net.core.somaxconn = 65535
          net.ipv4.tcp_max_syn_backlog = 65535
          net.ipv4.ip_forward = 1
          net.bridge.bridge-nf-call-iptables = 1
    
    runcmd:
      - sysctl --system
      - echo never > /sys/kernel/mm/transparent_hugepage/enabled

description: 54Bank Core Banking Platform — MicroCloud profile

devices:
  # Root disk on distributed Ceph storage
  root:
    path: /
    pool: remote
    size: 50GB
    type: disk
  
  # Dedicated Postgres data volume (high IOPS)
  pgdata:
    path: /var/lib/postgresql
    pool: remote
    size: 200GB
    type: disk
    
  # Shared network (MicroOVN)
  eth0:
    name: eth0
    network: 54bank-net
    type: nic
