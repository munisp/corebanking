# ─────────────────────────────────────────────────────────────
# 54Bank Ansible Inventory
# Update IPs/hostnames to match your on-premise infrastructure
# ─────────────────────────────────────────────────────────────

[k8s_master]
k8s-master-1 ansible_host=10.54.20.10

[k8s_workers]
k8s-worker-1 ansible_host=10.54.20.11
k8s-worker-2 ansible_host=10.54.20.12
k8s-worker-3 ansible_host=10.54.20.13

[k8s:children]
k8s_master
k8s_workers

[database]
db-primary ansible_host=10.54.10.10
# db-replica-1 ansible_host=10.54.10.11

[monitoring]
# monitor-1 ansible_host=10.54.30.10

[all:vars]
ansible_user=ubuntu
ansible_ssh_private_key_file=~/.ssh/54bank-key
ansible_python_interpreter=/usr/bin/python3

# 54Bank configuration
bank_environment=production
bank_domain=54bank.local
postgres_version=16
postgres_port=5432
pgbouncer_port=6432
redis_port=6379
k3s_version=v1.29.4+k3s1
