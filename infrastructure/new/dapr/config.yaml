apiVersion: dapr.io/v1alpha1
kind: Configuration
metadata:
  name: 54bank-config
  namespace: 54bank
spec:
  tracing:
    samplingRate: "1"
    zipkin:
      endpointAddress: "http://localhost:9411/api/v2/spans"
  metric:
    enabled: true
  mtls:
    enabled: true
    workloadCertTTL: "24h"
    allowedClockSkew: "15m"
  accessControl:
    defaultAction: allow
    trustDomain: "54bank.com"
    policies:
      - appId: gateway
        defaultAction: allow
        trustDomain: "54bank.com"
        namespace: "54bank"
      - appId: teller-operations
        defaultAction: allow
        trustDomain: "54bank.com"
        namespace: "54bank"
        operations:
          - name: /v1/*
            httpVerb: ["GET", "POST", "PUT", "DELETE"]
            action: allow
