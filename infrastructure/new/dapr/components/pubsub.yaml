# OR-09 RESOLVED (W12-B5-P1-G): this component keeps the name 'pubsub'
# (pubsub.kafka, namespace 54bank). The colliding redis component in ns 54link-dev
# was RENAMED to 'pubsub-redis' (infrastructure/manifests/dapr/pubsub.yaml), so the
# bare name 'pubsub' now unambiguously means THIS kafka-backed component fleet-wide.
# All in-code bare-'pubsub' references were audited and intend this kafka component.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: 54bank
spec:
  type: pubsub.kafka
  version: v1
  metadata:
    - name: brokers
      value: "localhost:9092"
    - name: consumerGroup
      value: "54bank-dapr"
    - name: authType
      value: "none"
