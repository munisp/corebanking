replicaCount: 2
image:
  repository: 54bank
  tag: latest
  pullPolicy: IfNotPresent
service:
  type: ClusterIP
  port: 8080
resources:
  limits: { cpu: 500m, memory: 512Mi }
  requests: { cpu: 100m, memory: 128Mi }
autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10 }
readinessProbe: { httpGet: { path: /readyz, port: http }, initialDelaySeconds: 5 }
env:
  DATABASE_URL: ""
  REDIS_URL: ""
  KAFKA_BROKERS: ""
