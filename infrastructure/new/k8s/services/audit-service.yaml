# K8s manifest for audit-service (AU-01/AU-03/CP-07/PL-10).
# The service previously had no manifest under infrastructure/new/k8s/services;
# it is also listed in the compliance-regulatory helm chart SERVICES group.
# Port 8080 matches the existing AUDIT_SERVICE_URL convention used by
# infrastructure/charts/mortgage-service/values.yaml.
apiVersion: v1
kind: Namespace
metadata:
  name: 54bank
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-service
  namespace: 54bank
  labels:
    app: audit-service
    language: python
    tier: microservice
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audit-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: audit-service
        language: python
        tier: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: audit-service
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgresql.54bank.svc.cluster.local 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: audit-service
          image: ghcr.io/54bank/audit-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          env:
            - name: PORT
              value: "80"
            # AU-01/CP-07: ingest + export credentials from the shared secret.
          envFrom:
            - secretRef:
                name: audit-ingest-credentials
            - secretRef:
                name: 54link-shared-database-svc-secret
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: audit-service
  namespace: 54bank
  labels:
    app: audit-service
spec:
  type: ClusterIP
  selector:
    app: audit-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
