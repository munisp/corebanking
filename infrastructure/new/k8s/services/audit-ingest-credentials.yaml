# AU-01 (F15-1): shared credential for service-to-service audit ingestion.
# Referenced (envFrom secretRef) by audit-service and by every audit-shipping
# service chart (see infrastructure/charts/*/templates/deployment.yaml).
#
# BOOTSTRAP VALUES — rotate immediately via the external secret manager
# (sealed-secrets / ExternalSecrets) in real environments. Both sender and
# receiver read the same object, so rotation only requires updating this one
# secret. audit-service fails closed when AUDIT_INGEST_TOKEN is unset, and the
# CP-07 export endpoint fails fast (503) when AUDIT_EXPORT_SECRET is unset.
apiVersion: v1
kind: Secret
metadata:
  name: audit-ingest-credentials
  namespace: 54bank
  labels:
    app: audit-service
    tier: microservice
type: Opaque
stringData:
  # Shared secret presented as the X-Audit-Ingest-Token header by senders.
  AUDIT_INGEST_TOKEN: "CHANGE_ME-bootstrap-audit-ingest-token"
  # HMAC-SHA256 key for signed regulator export bundles (CP-07).
  AUDIT_EXPORT_SECRET: "CHANGE_ME-bootstrap-audit-export-secret"
