# External Secrets Operator for 54Bank
# Syncs secrets from HashiCorp Vault → Kubernetes Secrets
# Works on: AWS (also supports AWS Secrets Manager), OpenStack (Barbican), On-Premise
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
  labels:
    app.kubernetes.io/part-of: 54bank-security

---
# ClusterSecretStore — connects to Vault
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "https://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "external-secrets"
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "external-secrets"
      caProvider:
        type: ConfigMap
        name: vault-ca
        namespace: vault
        key: ca.crt

---
# ClusterSecretStore — AWS Secrets Manager (for AWS deployments)
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  conditions:
    - namespaces: ["production", "staging"]
  provider:
    aws:
      service: SecretsManager
      region: af-south-1
      auth:
        jwt:
          serviceAccountRef:
            name: "external-secrets-sa"
            namespace: "external-secrets"

---
# Database credentials for all services
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: database-credentials
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: database-credentials
    creationPolicy: Owner
    template:
      type: Opaque
      data:
        DATABASE_URL: "postgresql://{{ .username }}:{{ .password }}@postgres.54bank.local:5432/corebanking?sslmode=require"
  data:
    - secretKey: username
      remoteRef:
        key: secret/data/shared/database
        property: username
    - secretKey: password
      remoteRef:
        key: secret/data/shared/database
        property: password

---
# JWT signing keys
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-signing-keys
  namespace: production
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: jwt-signing-keys
    creationPolicy: Owner
  data:
    - secretKey: JWT_SECRET
      remoteRef:
        key: secret/data/shared/jwt
        property: signing_key
    - secretKey: JWT_REFRESH_SECRET
      remoteRef:
        key: secret/data/shared/jwt
        property: refresh_signing_key

---
# Kafka credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: kafka-credentials
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: kafka-credentials
    creationPolicy: Owner
  data:
    - secretKey: KAFKA_BOOTSTRAP_SERVERS
      remoteRef:
        key: secret/data/shared/kafka
        property: bootstrap_servers
    - secretKey: KAFKA_SASL_USERNAME
      remoteRef:
        key: secret/data/shared/kafka
        property: sasl_username
    - secretKey: KAFKA_SASL_PASSWORD
      remoteRef:
        key: secret/data/shared/kafka
        property: sasl_password

---
# Redis credentials
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: redis-credentials
  namespace: production
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: redis-credentials
    creationPolicy: Owner
  data:
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/data/shared/redis
        property: url
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: secret/data/shared/redis
        property: password

---
# NIP gateway credentials (NIBSS)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: nip-credentials
  namespace: production
spec:
  refreshInterval: 24h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: nip-credentials
    creationPolicy: Owner
  data:
    - secretKey: NIP_CLIENT_ID
      remoteRef:
        key: secret/data/services/nip-gateway
        property: client_id
    - secretKey: NIP_CLIENT_SECRET
      remoteRef:
        key: secret/data/services/nip-gateway
        property: client_secret
    - secretKey: NIP_ENCRYPTION_KEY
      remoteRef:
        key: secret/data/services/nip-gateway
        property: encryption_key

---
# ServiceAccount for External Secrets Operator
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets-sa
  namespace: external-secrets
  annotations:
    # AWS IRSA annotation (for AWS deployments)
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/54bank-external-secrets
