apiVersion: apps/v1
kind: Deployment
metadata:
  name: tenant-management-py
  labels:
    app: tenant-management-py
    tier: platform
spec:
  replicas: 3
  selector:
    matchLabels:
      app: tenant-management-py
  template:
    metadata:
      labels:
        app: tenant-management-py
        tier: platform
    spec:
      serviceAccountName: tenant-management-py
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: tenant-management-py
          image: 54bank/tenant-management-py:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: db-credentials
                  key: url
            - name: REDIS_URL
              value: redis-cluster:6379
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /livez
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: tenant-management-py
  labels:
    app: tenant-management-py
spec:
  selector:
    app: tenant-management-py
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tenant-management-py-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tenant-management-py
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tenant-management-py-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: tenant-management-py
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tenant-management-py-netpol
spec:
  podSelector:
    matchLabels:
      app: tenant-management-py
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tier: platform
        - podSelector:
            matchLabels:
              app: api-gateway
      ports:
        - port: 8080
          protocol: TCP
