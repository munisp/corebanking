apiVersion: keda.sh/v1alpha1
kind: ScaledJob
metadata:
  name: sj-efass-report-generation
  namespace: 54bank
  labels:
    app: efass-generator-rs
    tier: batch-processing
    app.kubernetes.io/managed-by: keda
    app.kubernetes.io/part-of: 54bank-platform
spec:
  jobTargetRef:
    template:
      metadata:
        labels:
          app: efass-generator-rs
          job-type: batch
      spec:
        containers:
        - name: efass-generator-rs
          image: ghcr.io/54bank/efass-generator-rs:latest
          command:
          - /app/efass-generator-rs
          - --batch-mode
          env:
          - name: KAFKA_BROKERS
            valueFrom:
              configMapKeyRef:
                name: 54bank-config
                key: kafka-brokers
          - name: DATABASE_URL
            valueFrom:
              secretKeyRef:
                name: efass-generator-rs-secrets
                key: database-url
                optional: true
          - name: BATCH_MODE
            value: 'true'
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
        restartPolicy: OnFailure
        serviceAccountName: efass-generator-rs
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
    parallelism: 3
    completions: 1
    backoffLimit: 3
    ttlSecondsAfterFinished: 3600
  pollingInterval: 30
  maxReplicaCount: 6
  successfulJobsHistoryLimit: 5
  failedJobsHistoryLimit: 3
  rolloutStrategy: gradual
  scalingStrategy:
    strategy: accurate
  triggers:
  - type: kafka
    metadata:
      bootstrapServers: kafka-broker.54bank.svc.cluster.local:9092
      consumerGroup: efass-report-generation-batch
      topic: accounting.ledger
      lagThreshold: '1000'
      offsetResetPolicy: earliest
    authenticationRef:
      name: keda-kafka-auth
