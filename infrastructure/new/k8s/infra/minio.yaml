# MinIO — S3-compatible object storage backing the 54Bank lakehouse
# (LAKEHOUSE_STORAGE=s3 in infrastructure/new/lakehouse/configs/storage.py).
# Idiom follows infrastructure/new/k8s/secrets/ollama-secret.yaml
# (Secret stringData + workload in one file, namespace 54bank).
#
# NOTE: minio-root-user/minio-root-password are bootstrap placeholders.
# Rotate via the external-secrets path (infrastructure/new/k8s/external-secrets/)
# before any non-dev deployment; lakehouse pods consume them through the
# lakehouse-s3 secret keys referenced in the lakehouse manifests.
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: 54bank
  labels:
    app: minio
    app.kubernetes.io/component: object-storage
type: Opaque
stringData:
  minio-root-user: "CHANGE_ME_MINIO_ROOT_USER"
  minio-root-password: "CHANGE_ME_MINIO_ROOT_PASSWORD"
---
# Consumed by lakehouse / lakehouse-etl-py / lakehouse-rs pods as
# LAKEHOUSE_S3_ACCESS_KEY / LAKEHOUSE_S3_SECRET_KEY.
apiVersion: v1
kind: Secret
metadata:
  name: lakehouse-s3
  namespace: 54bank
  labels:
    app: lakehouse
    app.kubernetes.io/component: object-storage
type: Opaque
stringData:
  access-key: "CHANGE_ME_MINIO_ROOT_USER"
  secret-key: "CHANGE_ME_MINIO_ROOT_PASSWORD"
  endpoint: "http://minio:9000"
  bucket: "54bank-lakehouse"
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: 54bank
  labels:
    app: minio
spec:
  type: ClusterIP
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
    - name: console
      port: 9001
      targetPort: 9001
      protocol: TCP
  selector:
    app: minio
---
# Headless service for stable StatefulSet identity.
apiVersion: v1
kind: Service
metadata:
  name: minio-headless
  namespace: 54bank
  labels:
    app: minio
spec:
  clusterIP: None
  ports:
    - name: api
      port: 9000
      targetPort: 9000
      protocol: TCP
  selector:
    app: minio
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: 54bank
  labels:
    app: minio
    app.kubernetes.io/component: object-storage
spec:
  serviceName: minio-headless
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/minio/v2/metrics/cluster"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: minio
          image: minio/minio:RELEASE.2024-07-16T23-46-41Z
          imagePullPolicy: IfNotPresent
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - name: api
              containerPort: 9000
              protocol: TCP
            - name: console
              containerPort: 9001
              protocol: TCP
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-root-password
            # Prometheus metrics without auth for the in-cluster collector.
            - name: MINIO_PROMETHEUS_AUTH_TYPE
              value: "public"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
---
# One-shot bucket bootstrap Job (idempotent: mc mb --ignore-existing).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-create-buckets
  namespace: 54bank
  labels:
    app: minio
    app.kubernetes.io/component: object-storage-bootstrap
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: minio-create-buckets
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z minio.54bank.svc.cluster.local 9000; do echo "Waiting for MinIO..."; sleep 2; done']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: mc
          image: minio/mc:RELEASE.2024-07-15T17-46-45Z
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -e
              mc alias set local http://minio:9000 "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/54bank-lakehouse
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-root-user
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-credentials
                  key: minio-root-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
