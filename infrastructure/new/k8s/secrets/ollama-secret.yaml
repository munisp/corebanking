# Kubernetes Secret for Ollama LLM backend
# Ollama does not require an API key by default.
# Only populate ollama-api-key if your Ollama instance is behind an auth proxy.
apiVersion: v1
kind: Secret
metadata:
  name: 54bank-ollama
  namespace: 54bank
  labels:
    app.kubernetes.io/name: 54bank-ollama
    app.kubernetes.io/component: llm-backend
type: Opaque
stringData:
  # Ollama server URL — use the K8s service name
  ollama-api-base: "http://ollama-service:11434"
  # API key — leave empty for standard Ollama (no auth required)
  ollama-api-key: ""
---
# Ollama Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: 54bank
  labels:
    app: ollama
    app.kubernetes.io/component: llm-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          ports:
            - containerPort: 11434
          env:
            - name: OLLAMA_KEEP_ALIVE
              value: "24h"
            - name: OLLAMA_NUM_PARALLEL
              value: "4"
          volumeMounts:
            - name: ollama-data
              mountPath: /root/.ollama
          resources:
            requests:
              memory: "4Gi"
              cpu: "2"
            limits:
              memory: "16Gi"
              cpu: "8"
          livenessProbe:
            httpGet:
              path: /api/tags
              port: 11434
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: ollama-data
          persistentVolumeClaim:
            claimName: ollama-pvc
---
# Ollama Service
apiVersion: v1
kind: Service
metadata:
  name: ollama-service
  namespace: 54bank
spec:
  selector:
    app: ollama
  ports:
    - protocol: TCP
      port: 11434
      targetPort: 11434
  type: ClusterIP
---
# Ollama PersistentVolumeClaim
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
  namespace: 54bank
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
