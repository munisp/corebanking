# corebanking observability stack (wave-9, builder B1)
# Pinned images, non-root, no committed secrets (secretKeyRef targets
# 'grafana-admin' and 'otel-metrics-credentials' are created out-of-band).
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: observability
  labels:
    app.kubernetes.io/name: tempo-config
    app.kubernetes.io/part-of: corebanking-observability
data:
  tempo.yaml: "# Tempo \u2014 trace backend for the corebanking observability stack\
    \ (wave-9 B1)\n# Single-binary, local filesystem storage. Dev/single-node profile:\
    \ blocks and\n# WAL live under /var/tempo (named volume in compose, emptyDir in\
    \ k8s \u2014 see\n# README for the durability caveat).\n\nserver:\n  http_listen_port:\
    \ 3200\n  grpc_listen_port: 9095\n  log_level: info\n\ndistributor:\n  receivers:\n\
    \    otlp:\n      protocols:\n        grpc:\n          endpoint: 0.0.0.0:4317\n\
    \        http:\n          endpoint: 0.0.0.0:4318\n\ningester:\n  max_block_duration:\
    \ 5m\n\ncompactor:\n  compaction:\n    block_retention: 48h\n\nstorage:\n  trace:\n\
    \    backend: local\n    wal:\n      path: /var/tempo/wal\n    local:\n      path:\
    \ /var/tempo/traces\n\nquerier:\n  frontend_worker:\n    frontend_address: 127.0.0.1:9095\n\
    \nusage_report:\n  reporting_enabled: false\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: observability
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: corebanking-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tempo
        app.kubernetes.io/part-of: corebanking-observability
        app: tempo
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: tempo
        image: grafana/tempo:2.6.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3200
          protocol: TCP
        - name: otlp-grpc
          containerPort: 4317
          protocol: TCP
        - name: otlp-http
          containerPort: 4318
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/tempo/tempo.yaml
          readOnly: true
          subPath: tempo.yaml
        - name: data
          mountPath: /var/tempo
          readOnly: false
        - name: tmp
          mountPath: /tmp
          readOnly: false
        readinessProbe:
          httpGet:
            path: /ready
            port: 3200
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /ready
            port: 3200
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        args:
        - -config.file=/etc/tempo/tempo.yaml
      volumes:
      - name: config
        configMap:
          name: tempo-config
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: observability
  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/part-of: corebanking-observability
spec:
  type: ClusterIP
  selector:
    app: tempo
  ports:
  - name: http
    port: 3200
    targetPort: 3200
    protocol: TCP
  - name: otlp-grpc
    port: 4317
    targetPort: 4317
    protocol: TCP
  - name: otlp-http
    port: 4318
    targetPort: 4318
    protocol: TCP
