# corebanking observability stack (wave-9, builder B1)
# Pinned images, non-root, no committed secrets (secretKeyRef targets
# 'grafana-admin' and 'otel-metrics-credentials' are created out-of-band).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: observability
  labels:
    app.kubernetes.io/name: loki-config
    app.kubernetes.io/part-of: corebanking-observability
data:
  loki-config.yaml: "# Loki \u2014 log backend, single-binary + local filesystem (wave-9\
    \ B1)\n# Loki 3.x profile: TSDB index, filesystem object store, in-memory ring.\n\
    # Receives OTLP logs from the collector at http://loki:3100/otlp (native OTLP\n\
    # support; no auth in-cluster \u2014 multi-tenancy is disabled deliberately).\n\
    \nauth_enabled: false\n\nserver:\n  http_listen_port: 3100\n  grpc_listen_port:\
    \ 9096\n  log_level: info\n\ncommon:\n  instance_addr: 127.0.0.1\n  path_prefix:\
    \ /loki\n  storage:\n    filesystem:\n      chunks_directory: /loki/chunks\n \
    \     rules_directory: /loki/rules\n  replication_factor: 1\n  ring:\n    kvstore:\n\
    \      store: inmemory\n\nquery_range:\n  results_cache:\n    cache:\n      embedded_cache:\n\
    \        enabled: true\n        max_size_mb: 100\n\nschema_config:\n  configs:\n\
    \    - from: \"2024-01-01\"\n      store: tsdb\n      object_store: filesystem\n\
    \      schema: v13\n      index:\n        prefix: index_\n        period: 24h\n\
    \nlimits_config:\n  retention_period: 168h        # 7d local retention for the\
    \ dev profile\n  allow_structured_metadata: true\n  # tenant.id arrives as structured\
    \ metadata via OTLP -> queryable with\n  # LogQL label filters without exploding\
    \ the label set.\n\ncompactor:\n  working_directory: /loki/compactor\n  retention_enabled:\
    \ true\n\nanalytics:\n  reporting_enabled: false\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: corebanking-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki
  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/part-of: corebanking-observability
        app: loki
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: loki
        image: grafana/loki:3.2.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3100
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /etc/loki/loki-config.yaml
          readOnly: true
          subPath: loki-config.yaml
        - name: data
          mountPath: /loki
          readOnly: false
        - name: tmp
          mountPath: /tmp
          readOnly: false
        readinessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /ready
            port: 3100
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        args:
        - -config.file=/etc/loki/loki-config.yaml
      volumes:
      - name: config
        configMap:
          name: loki-config
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: observability
  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/part-of: corebanking-observability
spec:
  type: ClusterIP
  selector:
    app: loki
  ports:
  - name: http
    port: 3100
    targetPort: 3100
    protocol: TCP
