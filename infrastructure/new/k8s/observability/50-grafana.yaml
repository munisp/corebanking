# corebanking observability stack (wave-9, builder B1)
# Pinned images, non-root, no committed secrets (secretKeyRef targets
# 'grafana-admin' and 'otel-metrics-credentials' are created out-of-band).
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana-datasources
    app.kubernetes.io/part-of: corebanking-observability
data:
  datasources.yaml: "# Grafana datasources \u2014 corebanking observability (wave-9\
    \ B1)\n# Cross-links: Tempo <-> Loki <-> Prometheus so a trace can pivot to its\
    \ logs\n# (by trace id + service) and to metrics, and Loki log lines carrying\
    \ a trace\n# id link back into Tempo.\napiVersion: 1\n\ndatasources:\n  - name:\
    \ Prometheus\n    uid: prometheus\n    type: prometheus\n    access: proxy\n \
    \   url: http://prometheus:9090\n    isDefault: true\n    editable: true\n   \
    \ jsonData:\n      timeInterval: 15s\n\n  - name: Tempo\n    uid: tempo\n    type:\
    \ tempo\n    access: proxy\n    url: http://tempo:3200\n    editable: true\n \
    \   jsonData:\n      httpMethod: GET\n      nodeGraph:\n        enabled: true\n\
    \      search:\n        hide: false\n      # Trace -> logs: opens Loki filtered\
    \ by trace id (+service name tag).\n      tracesToLogsV2:\n        datasourceUid:\
    \ loki\n        spanStartTimeShift: -1h\n        spanEndTimeShift: 1h\n      \
    \  filterByTraceID: true\n        filterBySpanID: true\n        tags:\n      \
    \    - key: service.name\n            value: service.name\n      # Trace -> metrics:\
    \ jump to Prometheus for the span's service.\n      tracesToMetrics:\n       \
    \ datasourceUid: prometheus\n        tags:\n          - key: service.name\n  \
    \          value: service_name\n      # Service graph backed by Prometheus (requires\
    \ Tempo metrics-generator\n      # or collector spanmetrics; empty until one of\
    \ those is enabled).\n      serviceMap:\n        datasourceUid: prometheus\n \
    \     lokiSearch:\n        datasourceUid: loki\n\n  - name: Loki\n    uid: loki\n\
    \    type: loki\n    access: proxy\n    url: http://loki:3100\n    editable: true\n\
    \    jsonData:\n      maxLines: 1000\n      # Log line -> trace: picks up trace_id/traceID/traceId\
    \ printed by the\n      # kits' log correlation and opens the trace in Tempo.\n\
    \      derivedFields:\n        - name: TraceID\n          datasourceUid: tempo\n\
    \          matcherRegex: '(?:trace_id|traceID|traceId)[\"=: ]+([0-9a-f]{32})'\n\
    \          url: '$${__value.raw}'\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana-dashboard-provider
    app.kubernetes.io/part-of: corebanking-observability
data:
  dashboards.yaml: "# Grafana dashboard provider \u2014 loads /var/lib/grafana/dashboards\
    \ (wave-9 B1)\napiVersion: 1\n\nproviders:\n  - name: corebanking\n    orgId:\
    \ 1\n    folder: Core Banking\n    folderUid: corebanking\n    type: file\n  \
    \  disableDeletion: false\n    allowUiUpdates: true\n    updateIntervalSeconds:\
    \ 30\n    options:\n      path: /var/lib/grafana/dashboards\n      foldersFromFilesStructure:\
    \ false\n"
---
