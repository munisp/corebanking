    ,\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n     \
    \   \"defaults\": {\n          \"unit\": \"reqps\",\n          \"custom\": {\n\
    \            \"drawStyle\": \"line\",\n            \"fillOpacity\": 10,\n    \
    \        \"showPoints\": \"never\",\n            \"spanNulls\": false\n      \
    \    }\n        },\n        \"overrides\": []\n      },\n      \"options\": {\n\
    \        \"legend\": {\n          \"displayMode\": \"table\",\n          \"placement\"\
    : \"bottom\",\n          \"showLegend\": true\n        },\n        \"tooltip\"\
    : {\n          \"mode\": \"multi\",\n          \"sort\": \"desc\"\n        }\n\
    \      },\n      \"targets\": [\n        {\n          \"refId\": \"A\",\n    \
    \      \"expr\": \"sum by (tenant_id, service_name) (rate(http_server_request_duration_seconds_count{tenant_id=~\\\
    \"$tenant_id\\\", service_name=~\\\"payment-processing-service|payment-hub|mojaloop-connector\\\
    \"}[5m]))\",\n          \"legendFormat\": \"{{service_name}} {{tenant_id}}\",\n\
    \          \"datasource\": {\n            \"type\": \"prometheus\",\n        \
    \    \"uid\": \"prometheus\"\n          }\n        }\n      ]\n    },\n    {\n\
    \      \"id\": 5,\n      \"type\": \"table\",\n      \"title\": \"Money-path traces\
    \ for selected tenant (Tempo)\",\n      \"description\": \"TraceQL search scoped\
    \ to span.tenant.id. tenant.id is preserved end-to-end (collector never drops\
    \ it; tail-sampling keeps 100% of these spans).\",\n      \"gridPos\": {\n   \
    \     \"h\": 10,\n        \"w\": 24,\n        \"x\": 0,\n        \"y\": 16\n \
    \     },\n      \"datasource\": {\n        \"type\": \"tempo\",\n        \"uid\"\
    : \"tempo\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {},\n \
    \       \"overrides\": []\n      },\n      \"options\": {\n        \"showHeader\"\
    : true\n      },\n      \"targets\": [\n        {\n          \"refId\": \"A\"\
    ,\n          \"datasource\": {\n            \"type\": \"tempo\",\n           \
    \ \"uid\": \"tempo\"\n          },\n          \"queryType\": \"traceqlSearch\"\
    ,\n          \"query\": \"{span.tenant.id = \\\"$tenant_id\\\"}\",\n         \
    \ \"limit\": 50,\n          \"tableType\": \"traces\"\n        }\n      ]\n  \
    \  },\n    {\n      \"id\": 6,\n      \"type\": \"logs\",\n      \"title\": \"\
    Money-path service logs (Loki)\",\n      \"gridPos\": {\n        \"h\": 8,\n \
    \       \"w\": 24,\n        \"x\": 0,\n        \"y\": 26\n      },\n      \"datasource\"\
    : {\n        \"type\": \"loki\",\n        \"uid\": \"loki\"\n      },\n      \"\
    options\": {\n        \"showTime\": true,\n        \"showLabels\": false,\n  \
    \      \"wrapLogMessage\": true,\n        \"sortOrder\": \"Descending\",\n   \
    \     \"dedupStrategy\": \"none\"\n      },\n      \"targets\": [\n        {\n\
    \          \"refId\": \"A\",\n          \"datasource\": {\n            \"type\"\
    : \"loki\",\n            \"uid\": \"loki\"\n          },\n          \"expr\":\
    \ \"{service_namespace=\\\"corebanking\\\"} |= `` | json | tenant_id=~\\\"$tenant_id\\\
    \"\"\n        }\n      ]\n    }\n  ]\n}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: corebanking-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/part-of: corebanking-observability
        app: grafana
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: grafana
        image: grafana/grafana:11.3.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: ds
          mountPath: /etc/grafana/provisioning/datasources/datasources.yaml
          readOnly: true
          subPath: datasources.yaml
        - name: prov
          mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
          readOnly: true
          subPath: dashboards.yaml
        - name: dash
          mountPath: /var/lib/grafana/dashboards
          readOnly: true
        - name: data
          mountPath: /var/lib/grafana
          readOnly: false
        - name: tmp
          mountPath: /tmp
          readOnly: false
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        env:
        - name: GF_AUTH_ANONYMOUS_ENABLED
          value: 'false'
        - name: GF_PATHS_PROVISIONING
          value: /etc/grafana/provisioning
        - name: GF_SECURITY_ADMIN_USER
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-user
        - name: GF_SECURITY_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: grafana-admin
              key: admin-password
      volumes:
      - name: ds
        configMap:
          name: grafana-datasources
      - name: prov
        configMap:
          name: grafana-dashboard-provider
      - name: dash
        configMap:
          name: grafana-dashboards
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: observability
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/part-of: corebanking-observability
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
