# corebanking observability stack (wave-9, builder B1)
# Pinned images, non-root, no committed secrets (secretKeyRef targets
# 'grafana-admin' and 'otel-metrics-credentials' are created out-of-band).
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus-config
    app.kubernetes.io/part-of: corebanking-observability
data:
  prometheus.yml: "# Prometheus \u2014 corebanking observability (wave-9, builder\
    \ B1)\n# Federation model: the OTel Collector re-exports everything (OTLP SDK\
    \ metrics\n# + scraped middleware exporters + postgresql/redis receivers) on :8889;\n\
    # Prometheus scrapes that one endpoint plus the stack's own self-metrics.\n# External\
    \ label cluster=54bank per mission contract.\n\nglobal:\n  scrape_interval: 15s\n\
    \  evaluation_interval: 15s\n  scrape_timeout: 10s\n  external_labels:\n    cluster:\
    \ 54bank\n    monitor: corebanking-observability\n\nscrape_configs:\n  # Primary\
    \ federation point: everything the collector exports.\n  # honor_labels preserves\
    \ the exporter's own job/service labels so\n  # middleware job names (kafka-jmx,\
    \ postgres-exporter, ...) survive.\n  - job_name: otel-collector-federation\n\
    \    honor_labels: true\n    static_configs:\n      - targets: [\"otel-collector:8889\"\
    ]\n\n  # Collector internal telemetry (queue sizes, refused spans, memory).\n\
    \  # Powers the CollectorQueueBackpressure alert family (SPEC \xA74).\n  - job_name:\
    \ otel-collector-internal\n    static_configs:\n      - targets: [\"otel-collector:8888\"\
    ]\n\n  # Stack self-monitoring.\n  - job_name: prometheus\n    static_configs:\n\
    \      - targets: [\"localhost:9090\"]\n\n  - job_name: tempo\n    static_configs:\n\
    \      - targets: [\"tempo:3200\"]\n\n  - job_name: loki\n    static_configs:\n\
    \      - targets: [\"loki:3100\"]\n\n  - job_name: grafana\n    static_configs:\n\
    \      - targets: [\"grafana:3000\"]\n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: corebanking-observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prometheus
        app.kubernetes.io/part-of: corebanking-observability
        app: prometheus
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: prometheus
        image: prom/prometheus:v2.55.1
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 9090
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 512Mi
          limits:
            cpu: '1'
            memory: 2Gi
        volumeMounts:
        - name: config
          mountPath: /etc/prometheus/prometheus.yml
          readOnly: true
          subPath: prometheus.yml
        - name: data
          mountPath: /prometheus
          readOnly: false
        - name: tmp
          mountPath: /tmp
          readOnly: false
        readinessProbe:
          httpGet:
            path: /-/ready
            port: 9090
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 6
        livenessProbe:
          httpGet:
            path: /-/healthy
            port: 9090
          initialDelaySeconds: 20
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
        args:
        - --config.file=/etc/prometheus/prometheus.yml
        - --storage.tsdb.path=/prometheus
        - --storage.tsdb.retention.time=15d
        - --web.enable-lifecycle
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: observability
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/part-of: corebanking-observability
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
  - name: http
    port: 9090
    targetPort: 9090
    protocol: TCP
