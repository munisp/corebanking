# 54Bank HAProxy Configuration — On-Premise Load Balancer
# Runs on dedicated LB nodes or as K8s DaemonSet
# Provides: SSL termination, rate limiting, health checks, sticky sessions

global
    log /dev/log local0
    log /dev/log local1 notice
    maxconn 50000
    tune.ssl.default-dh-param 2048
    ssl-default-bind-ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305
    ssl-default-bind-options ssl-min-ver TLSv1.2 no-tls-tickets
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option http-server-close
    option forwardfor except 127.0.0.0/8
    timeout connect 5s
    timeout client  30s
    timeout server  30s
    timeout http-request 10s
    timeout http-keep-alive 5s
    timeout queue 30s
    timeout tunnel 3600s
    retries 3
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# ── Stats Dashboard ──────────────────────────────────────────────────────────

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if LOCALHOST
    stats auth admin:REPLACE_WITH_STATS_PASSWORD

# ── Rate Limiting ────────────────────────────────────────────────────────────

# Stick tables for rate limiting
frontend rate_limiter
    bind *:80
    bind *:443 ssl crt /etc/haproxy/certs/54bank.pem alpn h2,http/1.1

    # Redirect HTTP to HTTPS
    http-request redirect scheme https unless { ssl_fc }

    # Security headers
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload"
    http-response set-header X-Frame-Options "DENY"
    http-response set-header X-Content-Type-Options "nosniff"
    http-response set-header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'"
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Referrer-Policy "strict-origin-when-cross-origin"

    # Rate limiting: 100 requests per 10 seconds per IP
    stick-table type ip size 100k expire 10s store http_req_rate(10s),conn_cur
    http-request track-sc0 src
    http-request deny deny_status 429 if { sc_http_req_rate(0) gt 100 }

    # Block known bad user agents
    http-request deny if { req.hdr(User-Agent) -m sub sqlmap }
    http-request deny if { req.hdr(User-Agent) -m sub nikto }

    # Request size limit: 1MB
    http-request deny deny_status 413 if { req.body_size gt 1048576 }

    # Route to backends
    acl is_api path_beg /v1/ /api/ /healthz /readyz /metrics
    acl is_web path_beg / /app /static /assets

    use_backend api_backend if is_api
    use_backend web_backend if is_web
    default_backend api_backend

# ── API Backend (Kubernetes Ingress) ─────────────────────────────────────────

backend api_backend
    balance roundrobin
    option httpchk GET /healthz
    http-check expect status 200

    # Retry on connection failure
    retry-on conn-failure empty-response response-timeout

    # Circuit breaker: mark server down after 3 consecutive failures
    default-server inter 5s fall 3 rise 2

    # Sticky sessions for stateful operations
    cookie SRVID insert indirect nocache

    # K8s worker nodes (MetalLB EXTERNAL-IP or NodePort)
    server k8s-worker-1 10.0.1.20:30080 check cookie w1 weight 100
    server k8s-worker-2 10.0.1.21:30080 check cookie w2 weight 100
    server k8s-worker-3 10.0.1.22:30080 check cookie w3 weight 100
    server k8s-worker-4 10.0.1.23:30080 check cookie w4 weight 100
    server k8s-worker-5 10.0.1.24:30080 check cookie w5 weight 50
    server k8s-worker-6 10.0.1.25:30080 check cookie w6 weight 50

# ── Web/Frontend Backend ─────────────────────────────────────────────────────

backend web_backend
    balance roundrobin
    option httpchk GET /
    http-check expect status 200

    server k8s-worker-1 10.0.1.20:30443 check ssl verify none
    server k8s-worker-2 10.0.1.21:30443 check ssl verify none

# ── K8s API Backend (for kubectl access) ─────────────────────────────────────

frontend k8s_api
    bind *:6443
    mode tcp
    option tcplog
    default_backend k8s_api_backend

backend k8s_api_backend
    mode tcp
    balance roundrobin
    option tcp-check

    server k8s-master-1 10.0.1.10:6443 check
    server k8s-master-2 10.0.1.11:6443 check
    server k8s-master-3 10.0.1.12:6443 check

# ── PostgreSQL Backend (PgBouncer) ───────────────────────────────────────────

frontend postgres
    bind *:5432
    mode tcp
    option tcplog
    default_backend postgres_backend

backend postgres_backend
    mode tcp
    balance roundrobin
    option pgsql-check user haproxy

    server db-node-1 10.0.1.40:6432 check port 8008
    server db-node-2 10.0.1.41:6432 check port 8008 backup
    server db-node-3 10.0.1.42:6432 check port 8008 backup

# ── Redis Backend (Sentinel-aware) ───────────────────────────────────────────

frontend redis
    bind *:6379
    mode tcp
    option tcplog
    default_backend redis_backend

backend redis_backend
    mode tcp
    balance first
    option tcp-check

    server redis-1 10.0.1.40:6379 check
    server redis-2 10.0.1.41:6379 check backup
    server redis-3 10.0.1.42:6379 check backup
