apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: 54link-dev
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-master.redis.svc.cluster.local:6379
    - name: redisPassword
      # PREREQUISITE (not expressed here - secret values don't belong in git):
      # a `redis-secret` Secret must exist in this namespace with a `password`
      # key holding the real Redis password.
      #   kubectl create secret generic redis-secret -n 54link-dev \
      #     --from-literal=password=<real redis password>
      secretKeyRef:
        name: redis-secret
        key: password
    - name: enableTLS
      value: "false"
    - name: dialTimeout
      value: "10s"
    - name: readTimeout
      value: "10s"
    - name: writeTimeout
      value: "10s"
    - name: poolSize
      value: "20"
    - name: poolTimeout
      value: "10s"
    - name: maxConnAge
      value: "30m"
    - name: minIdleConns
      value: "5"
    - name: idleTimeout
      value: "5m"
    - name: idleCheckFrequency
      value: "1m"
  auth:
    secretStore: kubernetes
