# OR-09 RESOLVED (W12-B5-P1-G): component RENAMED 'pubsub' -> 'pubsub-redis'
# (pubsub.redis, namespace 54link-dev). It previously collided with the
# kafka-backed 'pubsub' (ns 54bank, infrastructure/new/dapr/components/pubsub.yaml);
# same name, different broker, silent redis<->kafka switch by namespace.
# Reference audit (fleet-wide grep for bare-'pubsub' component usage):
#  - 54link-dev plane resolves the name via shared env: docker-compose.consolidated.yml
#    DAPR_PUBSUB / DAPR_PUBSUB_NAME — updated to 'pubsub-redis' with this rename.
#  - Every in-code bare-'pubsub' default was verified to intend the KAFKA component
#    (opensearch-indexer-py ns 54bank deployment; standing-orders-go ns 54bank;
#    sanctions-screening-service + erpnext-integration-service comments name the
#    kafka component; notification-service subscribes 54bank kafka topics;
#    payment-processing-service publishes kafka topics) — left unchanged.
#  - orchestrator-service keeps a SELF-CONTAINED local-dev pair (code default +
#    services/orchestrator-service/dapr/components/pubsub.yaml, pubsub.redis,
#    localhost:6379, no namespace) — consistent pair, left unchanged.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub-redis
  namespace: 54link-dev
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-master.redis.svc.cluster.local:6379
    - name: redisPassword
      secretKeyRef:
        name: redis-credentials
        key: password
    - name: enableTLS
      value: "false"
    - name: dialTimeout
      value: "10s"
    - name: readTimeout
      value: "10s"
    - name: writeTimeout
      value: "10s"
    - name: poolSize
      value: "20"
    - name: poolTimeout
      value: "10s"
    - name: maxConnAge
      value: "30m"
    - name: minIdleConns
      value: "5"
    - name: idleTimeout
      value: "5m"
    - name: idleCheckFrequency
      value: "1m"
  auth:
    secretStore: kubernetes
