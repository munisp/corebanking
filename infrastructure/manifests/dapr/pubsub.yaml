# OR-09 NAME-COLLISION WARNING: this component is named 'pubsub' (pubsub.redis,
# namespace 54link-dev). A DIFFERENT component also named 'pubsub' (pubsub.kafka,
# namespace 54bank) exists at infrastructure/new/dapr/components/pubsub.yaml.
# They are scoped to different namespaces, but any service that moves between
# deploy planes, or any manifest applied to the wrong namespace, silently switches
# backing store (redis <-> kafka). Do NOT apply both to the same namespace.
# Rename was considered and rejected: 573 manifests target ns 54link-dev and a
# fleet-wide bare-'pubsub' reference audit cannot conclusively prove zero
# references in that plane, so renaming risks breaking live subscribers.
apiVersion: dapr.io/v1alpha1
kind: Component
metadata:
  name: pubsub
  namespace: 54link-dev
spec:
  type: pubsub.redis
  version: v1
  metadata:
    - name: redisHost
      value: redis-master.redis.svc.cluster.local:6379
    - name: redisPassword
      secretKeyRef:
        name: redis-credentials
        key: password
    - name: enableTLS
      value: "false"
    - name: dialTimeout
      value: "10s"
    - name: readTimeout
      value: "10s"
    - name: writeTimeout
      value: "10s"
    - name: poolSize
      value: "20"
    - name: poolTimeout
      value: "10s"
    - name: maxConnAge
      value: "30m"
    - name: minIdleConns
      value: "5"
    - name: idleTimeout
      value: "5m"
    - name: idleCheckFrequency
      value: "1m"
  auth:
    secretStore: kubernetes
