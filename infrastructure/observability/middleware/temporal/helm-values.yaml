# =============================================================================
# Temporal server — Prometheus metrics on :8000
#
# Collector scrape job contract (SPEC §3): `temporal` -> :8000.
#
# W14-B2: an in-tree server manifest now exists at
# infrastructure/new/k8s/infra/temporal.yaml (namespace `temporal`, Service
# temporal-frontend:7233, metrics :8000). Use EITHER that manifest OR the
# `temporalio/temporal` Helm chart with these values — not both.
#
# Two files in one document:
#   1) Helm values fragment for temporalio/temporal chart
#   2) dynamicconfig (development-defaults) — NOT needed for metrics; kept as
#      the place to pin server tuning. Metrics come from STATIC config below.
# =============================================================================

# --- 1) Helm values fragment -------------------------------------------------
# Merge into your `helm upgrade temporal temporalio/temporal -f <values>`.
server:
  config:
    global:
      metrics:
        prometheus:
          timerType: histogram
          listenAddress: "0.0.0.0:8000"   # SPEC §3 contract: temporal :8000
        tags:
          service: temporal
          namespace: corebanking
  # Expose the metrics port on the server pods so the collector can scrape it.
  service:
    extraPorts:
      - name: metrics
        port: 8000
        targetPort: 8000
# Keep chart-bundled prometheus OFF — platform Prometheus/Collector owns scrape.
prometheus:
  enabled: false
grafana:
  enabled: false

# --- 2) dynamicconfig (optional, server-side feature toggles) ----------------
# dynamicconfig is for runtime-tunable knobs, NOT for enabling the metrics
# listener (that is static config above). Left intentionally minimal.
# Save as dynamicconfig/development.yaml when using docker-compose deploys.
# dynamicconfig:
#   system.forceSearchAttributesCacheRefreshOnRead:
#     - value: true
