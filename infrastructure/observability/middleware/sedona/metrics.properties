# =============================================================================
# Spark / Apache Sedona — metrics configuration
#
# Contract (SPEC §3): collector scrape job `spark-jmx` -> :8090.
#
# Sedona itself has NO telemetry surface — it is a Spark library (geospatial
# UDFs/UDTs). All metrics come from the Spark runtime hosting it (see README).
#
# Two options — pick ONE per Spark deployment:
#   (A) metrics.properties — Spark's built-in PrometheusServlet (Spark >= 3.0),
#       served on the driver/executors' metrics UI endpoint.
#   (B) spark-jmx-exporter-configmap.yaml — jmx_prometheus_javaagent on :8090
#       (matches the contract port exactly; works on any Spark version).
# =============================================================================

# Option A: metrics.properties (Spark PrometheusServlet)
# Mount into $SPARK_CONF_DIR. The servlet is served by the Spark UI process
# (driver :4040 by default, path /metrics/prometheus, executors :4041...).
# If the :8090 contract must be hit literally, use Option B instead.
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus

# Driver/executor source wiring
driver.source.jvm.class=org.apache.spark.metrics.source.JvmSource
executor.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Master/worker sources (standalone deploy mode only)
master.source.jvm.class=org.apache.spark.metrics.source.JvmSource
worker.source.jvm.class=org.apache.spark.metrics.source.JvmSource

# Sedona note: no Sedona-specific metric keys exist; geospatial job health is
# inferred from Spark job/stage/executor metrics (and app-level spans from the
# service driving the job, via otelkit).
