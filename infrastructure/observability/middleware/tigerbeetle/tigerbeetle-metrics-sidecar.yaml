# =============================================================================
# TigerBeetle — metrics sidecar stub (StatsD → Prometheus bridge)
#
# Target (verified-static): StatefulSet/tigerbeetle ns `54bank`,
# image ghcr.io/tigerbeetle/tigerbeetle:0.16.11,
# command: ["start", "--addresses=0.0.0.0:3001", "--cluster-id=0"] — no metrics
# flags configured in-tree.
#
# Contract (SPEC §3): collector scrape job `tigerbeetle-sidecar` -> :9090.
#
# Pattern: TigerBeetle emits DogStatsD (`--experimental --statsd=127.0.0.1:8125`,
# metrics namespaced `tb.`, tagged cluster/replica — per vendor monitoring
# docs). Telegraf sidecar receives StatsD and re-exports Prometheus on :9090.
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: tigerbeetle-telegraf
  namespace: 54bank
  labels:
    app.kubernetes.io/part-of: corebanking-observability
    observability.corebanking/component: tigerbeetle-sidecar
data:
  telegraf.conf: |
    [agent]
      interval = "10s"
      flush_interval = "10s"
      omit_hostname = true

    # TigerBeetle DogStatsD stream from the co-located TB process
    [[inputs.statsd]]
      protocol = "udp"
      service_address = ":8125"
      datadog_extensions = true        # TB uses DogStatsD tag format
      metric_separator = "."
      allowed_pending_messages = 10000

    # Prometheus scrape endpoint — SPEC §3 contract port 9090
    [[outputs.prometheus_client]]
      listen = ":9090"
      path = "/metrics"
      metric_version = 2
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tigerbeetle
  namespace: 54bank
spec:
  template:
    metadata:
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: tigerbeetle
          # Adds the StatsD emitter to the existing start command.
          # requires-deployment: confirm 0.16.11 supports these flags:
          #   tigerbeetle start --help | grep -i statsd
          #   tigerbeetle inspect metrics
          command: ["start", "--addresses=0.0.0.0:3001", "--cluster-id=0",
                    "--experimental", "--statsd=127.0.0.1:8125"]
        - name: metrics-sidecar
          image: telegraf:1.30-alpine    # pin per policy before deploy
          ports:
            - containerPort: 8125
              name: statsd
              protocol: UDP
            - containerPort: 9090
              name: metrics
          volumeMounts:
            - name: telegraf-config
              mountPath: /etc/telegraf/telegraf.conf
              subPath: telegraf.conf
          resources:
            requests: { cpu: "25m", memory: "32Mi" }
            limits: { cpu: "200m", memory: "128Mi" }
      volumes:
        - name: telegraf-config
          configMap:
            name: tigerbeetle-telegraf
---
apiVersion: v1
kind: Service
metadata:
  name: tigerbeetle-metrics
  namespace: 54bank
  labels:
    observability.corebanking/scrape: "true"
spec:
  selector:
    app: tigerbeetle
  ports:
    - name: metrics
      port: 9090                  # SPEC §3 contract: tigerbeetle-sidecar :9090
      targetPort: 9090
