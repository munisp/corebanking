# Grafana dashboard provider — loads /var/lib/grafana/dashboards (wave-9 B1)
apiVersion: 1

providers:
  - name: corebanking
    orgId: 1
    folder: Core Banking
    folderUid: corebanking
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
