# Grafana datasources — corebanking observability (wave-9 B1)
# Cross-links: Tempo <-> Loki <-> Prometheus so a trace can pivot to its logs
# (by trace id + service) and to metrics, and Loki log lines carrying a trace
# id link back into Tempo.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: 15s

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      httpMethod: GET
      nodeGraph:
        enabled: true
      search:
        hide: false
      # Trace -> logs: opens Loki filtered by trace id (+service name tag).
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: -1h
        spanEndTimeShift: 1h
        filterByTraceID: true
        filterBySpanID: true
        tags:
          - key: service.name
            value: service.name
      # Trace -> metrics: jump to Prometheus for the span's service.
      tracesToMetrics:
        datasourceUid: prometheus
        tags:
          - key: service.name
            value: service_name
      # Service graph backed by Prometheus (requires Tempo metrics-generator
      # or collector spanmetrics; empty until one of those is enabled).
      serviceMap:
        datasourceUid: prometheus
      lokiSearch:
        datasourceUid: loki

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: true
    jsonData:
      maxLines: 1000
      # Log line -> trace: picks up trace_id/traceID/traceId printed by the
      # kits' log correlation and opens the trace in Tempo.
      derivedFields:
        - name: TraceID
          datasourceUid: tempo
          matcherRegex: '(?:trace_id|traceID|traceId)["=: ]+([0-9a-f]{32})'
          url: '$${__value.raw}'
