# Grafana provisioning — notification policies
# Target tree path: infrastructure/observability/grafana/provisioning/alerting/policies.yaml
#
# Label-name note: the OTel metric attribute `service.name` / `tenant.id` (SPEC §2.2/2.3)
# arrive in Prometheus as `service_name` / `tenant_id` (dots are illegal in Prometheus
# label names and are sanitized by the collector's prometheus exporter / remote-write).
# All matchers and groupBy below therefore use the sanitized names.
apiVersion: 1

# Reset the org-default policy tree before applying this file (single source of truth).
resetPolicies:
  - orgId: 1

muteTimes:
  - orgId: 1
    name: maintenance-window-weekend
    # Example mute timing: planned maintenance window, Saturdays 02:00–06:00 UTC.
    time_intervals:
      - times:
          - start_time: "02:00"
            end_time: "06:00"
        weekdays: ["saturday"]
        location: UTC

policies:
  # Root policy: default receiver, grouped by service + severity.
  - orgId: 1
    receiver: platform-email
    group_by: ["service_name", "severity"]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      # ---- Per-tenant routing: any alert carrying a tenant_id label (SPEC §2.3) ----
      - receiver: tenant-webhook
        object_matchers:
          - ["tenant_id", "=~", ".+"] # "tenant_id exists" — only tenant-attributed alerts
        group_by: ["tenant_id", "alertname"]
        group_wait: 60s
        group_interval: 10m
        repeat_interval: 6h
        continue: true # still fall through to severity routing below
        mute_time_intervals:
          - maintenance-window-weekend

      # ---- Money-path critical: tighter escalation cadence ----
      - receiver: slack-alerts
        object_matchers:
          - ["severity", "=", "critical"]
          - ["money_path", "=", "true"]
        group_by: ["service_name", "tenant_id", "alertname"]
        group_wait: 15s
        group_interval: 2m
        repeat_interval: 30m # tighter repeat than root (4h)
        continue: true

      # ---- All remaining criticals ----
      - receiver: slack-alerts
        object_matchers:
          - ["severity", "=", "critical"]
        group_by: ["service_name", "severity"]
        repeat_interval: 1h

      # ---- Warnings to the generic webhook ----
      - receiver: generic-webhook
        object_matchers:
          - ["severity", "=", "warning"]
        group_by: ["service_name", "severity"]
        repeat_interval: 12h
