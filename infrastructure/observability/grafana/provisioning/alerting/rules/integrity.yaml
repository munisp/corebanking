apiVersion: 1
groups:
- orgId: 1
  name: corebanking-integrity
  folder: Corebanking Alerts
  interval: 1m
  rules:
  - uid: cb-high-error-rate
    title: HighErrorRate
    condition: B
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: sum by (service_name, tenant_id) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
          / sum by (service_name, tenant_id) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      queryType: ''
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0.05
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
    noDataState: NoData
    execErrState: Error
    for: 10m
    annotations:
      summary: 5xx ratio on {{ $labels.service_name }} (tenant {{ $labels.tenant_id }}) above 5% for 10 minutes.
      runbook_hint: "Pivot to Tempo/Loki for the service; cross-check HighErrorRate with the audit findings \u2014 fraud-service\
        \ /api/v1/fraud/check 500s on every call by construction (F15-14). If only fraud/check fails, follow the fraud runbook\
        \ instead of rolling back."
    labels:
      severity: critical
      team: platform-ops
    isPaused: false
  - uid: cb-audit-ship-failures
    title: AuditShipFailureRate
    condition: B
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: sum by (service_name, tenant_id) (increase(audit_ship_failures_total[5m])) > 0
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      queryType: ''
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
    noDataState: NoData
    execErrState: Error
    for: 1m
    annotations:
      summary: "Audit ship failures on {{ $labels.service_name }} \u2014 mutating requests are producing NO audit records."
      runbook_hint: 'Audit F15-1/F15-2: 22 services ship audit events with no credential to a fail-closed, unreachable audit-service
        (401/NXDOMAIN, errors swallowed). This wave surfaces the failures as a metric; fix requires wiring sender auth + a
        real audit-service deployment. Treat every firing minute as a regulatory audit-trail gap.'
    labels:
      severity: critical
      team: compliance
      finding: F15-1
    isPaused: false
  - uid: cb-sanctions-screen-errors
    title: SanctionsScreenErrorRate
    condition: B
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: sum by (service_name, tenant_id) (increase(sanctions_screen_errors_total[10m])) > 0
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      queryType: ''
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
    noDataState: NoData
    execErrState: Error
    for: 0m
    annotations:
      summary: "Sanctions screening errors on {{ $labels.service_name }} \u2014 screens returning proceed-on-error mean unscreened\
        \ money movement."
      runbook_hint: 'Audit F12-01: sanctions screen errors return ''proceed''. Identify the transactions screened during the
        error window, re-screen them manually, and fix the upstream screen endpoint before the next batch.'
    labels:
      severity: critical
      team: compliance
      money_path: 'true'
      finding: F12-01
    isPaused: false
  - uid: cb-fraud-precheck-errors
    title: FraudPrecheckErrorRate
    condition: B
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: sum by (service_name, tenant_id) (increase(fraud_precheck_errors_total[10m])) > 0
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      queryType: ''
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
    noDataState: NoData
    execErrState: Error
    for: 0m
    annotations:
      summary: "Fraud precheck failures on {{ $labels.service_name }} \u2014 payments are executing with ZERO fraud screening\
        \ (fail-open)."
      runbook_hint: 'Audit F15-15: payment-processing-service prechecks http://fraud-engine.54agent.svc.cluster.local, a service
        that does not exist, and proceeds on error. Point FRAUD_ENGINE_SVC_URL at fraud-service /api/v1/fraud/check (mind
        F15-14) or suspend withdrawals until the gate is real.'
    labels:
      severity: critical
      team: money-ops
      money_path: 'true'
      finding: F15-15
    isPaused: false
  - uid: cb-tenant-traffic-anomaly
    title: TenantTrafficAnomaly
    condition: B
    data:
    - refId: A
      queryType: ''
      relativeTimeRange:
        from: 900
        to: 0
      datasourceUid: prometheus
      model:
        editorMode: code
        expr: (sum by (tenant_id) (rate(http_server_request_duration_seconds_count{tenant_id!=""}[5m])) - avg_over_time((sum
          by (tenant_id) (rate(http_server_request_duration_seconds_count{tenant_id!=""}[5m])))[24h:5m])) / stddev_over_time((sum
          by (tenant_id) (rate(http_server_request_duration_seconds_count{tenant_id!=""}[5m])))[24h:5m]) > 3
        instant: true
        intervalMs: 1000
        legendFormat: __auto
        maxDataPoints: 43200
        range: false
        refId: A
    - refId: B
      queryType: ''
      relativeTimeRange:
        from: 0
        to: 0
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 3
            type: gt
          operator:
            type: and
          query:
            params:
            - B
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        refId: B
        type: classic_conditions
    noDataState: OK
    execErrState: Error
    for: 30m
    annotations:
      summary: Tenant {{ $labels.tenant_id }} request rate is >3 sigma above its 24h baseline.
      runbook_hint: "Compare with deployment/marketing events; if unexplained, check for credential stuffing or a misconfigured\
        \ client loop. Per SPEC \xA72.3 the tenant.id label exists ONLY on money-path services \u2014 non-money services cannot\
        \ produce this alert (cardinality guard)."
    labels:
      severity: warning
      team: platform-ops
    isPaused: false
