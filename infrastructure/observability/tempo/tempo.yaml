# Tempo — trace backend for the corebanking observability stack (wave-9 B1)
# Single-binary, local filesystem storage. Dev/single-node profile: blocks and
# WAL live under /var/tempo (named volume in compose, emptyDir in k8s — see
# README for the durability caveat).

server:
  http_listen_port: 3200
  grpc_listen_port: 9095
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/traces

querier:
  frontend_worker:
    frontend_address: 127.0.0.1:9095

usage_report:
  reporting_enabled: false
