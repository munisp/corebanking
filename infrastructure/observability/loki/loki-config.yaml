# Loki — log backend, single-binary + local filesystem (wave-9 B1)
# Loki 3.x profile: TSDB index, filesystem object store, in-memory ring.
# Receives OTLP logs from the collector at http://loki:3100/otlp (native OTLP
# support; no auth in-cluster — multi-tenancy is disabled deliberately).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 168h        # 7d local retention for the dev profile
  allow_structured_metadata: true
  # tenant.id arrives as structured metadata via OTLP -> queryable with
  # LogQL label filters without exploding the label set.

compactor:
  working_directory: /loki/compactor
  retention_enabled: true

analytics:
  reporting_enabled: false
