apiVersion: batch/v1
kind: CronJob
metadata:
  name: smoke-test-runner
  namespace: 54link-dev
  labels:
    app: smoke-test-runner
    component: testing
spec:
  # Runs every day at midnight UTC
  schedule: "0 0 * * *"
  concurrencyPolicy: Forbid       # don't overlap runs
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Kill the job if it runs longer than 30 minutes
      activeDeadlineSeconds: 1800
      template:
        metadata:
          labels:
            app: smoke-test-runner
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: credential
          containers:
            - name: smoke-test-runner
              image: registry.digitalocean.com/talentgraph-auth/smoke-test-runner:0.0.2
              imagePullPolicy: Always
              env:
                - name: CLUSTER_BASE_URL
                  value: "https://54link-dev.upi.dev"
                - name: PYTHONUNBUFFERED
                  value: "1"
                # PREREQUISITE (not expressed here - secret values don't belong in git):
                # a `smoke-test-db` Secret must exist in this namespace with a
                # `database-url` key holding the real Postgres connection string.
                #   kubectl create secret generic smoke-test-db -n <namespace> \
                #     --from-literal=database-url=<real connection string>
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef: {name: smoke-test-db, key: database-url}
              resources:
                requests:
                  cpu: "250m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
