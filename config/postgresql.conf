# ─────────────────────────────────────────────────────────────
# 54Bank PostgreSQL 16 Production Tuning
# Baseline: 16 GB RAM, 4 vCPU, NVMe SSD, 267 tables, ~10K TPS
# ─────────────────────────────────────────────────────────────

# ── Memory ──────────────────────────────────────────────────
shared_buffers = '4GB'                  # 25% of RAM
effective_cache_size = '12GB'           # 75% of RAM
work_mem = '64MB'                       # per-sort/hash, tune down if many concurrent queries
maintenance_work_mem = '1GB'            # VACUUM, CREATE INDEX, ALTER TABLE
huge_pages = 'try'                      # Reduce TLB misses on Linux

# ── WAL / Durability ───────────────────────────────────────
wal_level = 'replica'                   # Required for streaming replication
wal_buffers = '64MB'                    # 1/64 of shared_buffers, capped
max_wal_size = '4GB'                    # Before forced checkpoint
min_wal_size = '1GB'                    # Recycle threshold
checkpoint_completion_target = 0.9      # Spread checkpoint I/O
checkpoint_timeout = '15min'            # Less frequent checkpoints
wal_compression = 'zstd'               # Compress WAL for replication bandwidth
archive_mode = 'on'                     # Enable WAL archiving for PITR
archive_command = 'cp %p /var/lib/postgresql/wal_archive/%f'

# ── Write Ahead Log Tuning ─────────────────────────────────
synchronous_commit = 'on'               # Keep on for banking (ACID compliance)
full_page_writes = 'on'                 # Required for crash recovery
wal_writer_delay = '200ms'              # Batch WAL writes
commit_delay = 100                      # Microseconds — batch commits (high TPS)
commit_siblings = 5                     # Only delay if 5+ txns active

# ── Query Planner ──────────────────────────────────────────
random_page_cost = 1.1                  # SSD: nearly sequential cost
effective_io_concurrency = 200          # NVMe SSD concurrent reads
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025
default_statistics_target = 500         # More accurate query plans
jit = 'on'                              # JIT for complex analytical queries
jit_above_cost = 100000                 # Only JIT expensive queries

# ── Parallelism ────────────────────────────────────────────
max_parallel_workers_per_gather = 2     # Workers per parallel scan
max_parallel_workers = 4                # Total parallel workers
max_parallel_maintenance_workers = 2    # VACUUM, INDEX parallel
parallel_tuple_cost = 0.01
parallel_setup_cost = 1000.0
min_parallel_table_scan_size = '8MB'
min_parallel_index_scan_size = '512kB'

# ── Connections ────────────────────────────────────────────
max_connections = 200                   # Behind PgBouncer, so keep moderate
superuser_reserved_connections = 3
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# ── Background Writer ─────────────────────────────────────
bgwriter_delay = '200ms'
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0
bgwriter_flush_after = '512kB'

# ── Autovacuum (aggressive for banking workloads) ──────────
autovacuum = 'on'
autovacuum_max_workers = 4
autovacuum_naptime = '30s'              # Check every 30s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.02   # 2% of table (default 20% too high)
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.01  # 1% of table
autovacuum_vacuum_cost_delay = '2ms'    # Faster vacuum
autovacuum_vacuum_cost_limit = 1000     # More aggressive

# ── Logging (production) ──────────────────────────────────
log_min_duration_statement = 100        # Log queries > 100ms
log_checkpoints = 'on'
log_connections = 'off'                 # Too noisy via PgBouncer
log_disconnections = 'off'
log_lock_waits = 'on'
log_temp_files = '10MB'                 # Log temp file usage
log_autovacuum_min_duration = '1s'
log_line_prefix = '%m [%p] %q%u@%d '
log_statement = 'ddl'                   # Only log schema changes
deadlock_timeout = '1s'

# ── Lock Management ────────────────────────────────────────
max_locks_per_transaction = 256
lock_timeout = '10s'                    # Prevent indefinite lock waits
idle_in_transaction_session_timeout = '30s'  # Kill idle-in-txn connections
statement_timeout = '60s'               # Kill runaway queries

# ── Replication (read replicas) ────────────────────────────
max_wal_senders = 10
max_replication_slots = 10
hot_standby = 'on'
hot_standby_feedback = 'on'

# ── Table Partitioning Support ─────────────────────────────
enable_partition_pruning = 'on'
enable_partitionwise_join = 'on'
enable_partitionwise_aggregate = 'on'

# ── Disk ───────────────────────────────────────────────────
temp_buffers = '32MB'
temp_file_limit = '10GB'
