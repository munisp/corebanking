; ─────────────────────────────────────────────────────────────
; 54Bank PgBouncer — Production Connection Pooling
; Sits between Express/microservices and PostgreSQL 16
; Usage: pgbouncer config/pgbouncer.ini
; ─────────────────────────────────────────────────────────────

[databases]
; Primary (read-write)
ndsep_db = host=localhost port=5432 dbname=ndsep_db auth_user=ndsep_user pool_size=30
; Read replica (read-only queries routed here)
ndsep_db_ro = host=localhost port=5433 dbname=ndsep_db auth_user=ndsep_user pool_size=20

[pgbouncer]
; ── Pool Mode ──────────────────────────────────────────────
; transaction: release connection after each transaction (best for OLTP)
pool_mode = transaction

; ── Pool Sizing ────────────────────────────────────────────
; Postgres max_connections = 200, so total pool < 200
default_pool_size = 30               ; Connections per user/db pair
min_pool_size = 10                   ; Keep warm connections ready
max_client_conn = 1000               ; Many microservices connect here
max_db_connections = 80              ; Hard cap to Postgres per database
reserve_pool_size = 10               ; Emergency overflow pool
reserve_pool_timeout = 3             ; Seconds before using reserve

; ── Connection Lifecycle ───────────────────────────────────
server_lifetime = 1800               ; Recycle connections every 30 min
server_idle_timeout = 300            ; Close idle server connections after 5 min
server_connect_timeout = 5           ; Fast fail on Postgres unreachable
server_login_retry = 3               ; Retry failed logins
server_check_delay = 10              ; Health check interval
server_check_query = SELECT 1       ; Lightweight health check

; ── Client Lifecycle ───────────────────────────────────────
client_idle_timeout = 120            ; Close idle clients after 2 min
client_login_timeout = 30            ; Login must complete in 30s
query_timeout = 30                   ; Kill queries running > 30s
query_wait_timeout = 60              ; Wait max 60s for a connection
cancel_wait_timeout = 10             ; Cancel wait timeout

; ── Listening ──────────────────────────────────────────────
listen_addr = 0.0.0.0               ; Accept from all interfaces (K8s)
listen_port = 6432
unix_socket_dir = /var/run/pgbouncer
listen_backlog = 2048                ; High backlog for burst traffic
so_reuseport = 1                     ; SO_REUSEPORT for multi-core

; ── Authentication ─────────────────────────────────────────
auth_type = scram-sha-256            ; Modern auth (not md5)
auth_file = /etc/pgbouncer/userlist.txt
auth_query = SELECT usename, passwd FROM pg_shadow WHERE usename=$1

; ── Logging ────────────────────────────────────────────────
log_connections = 0                  ; Too noisy at scale
log_disconnections = 0
log_pooler_errors = 1
stats_period = 30                    ; Stats every 30s
verbose = 0

; ── Admin ──────────────────────────────────────────────────
admin_users = postgres,ndsep_user
stats_users = monitoring

; ── Performance ────────────────────────────────────────────
pkt_buf = 4096                       ; Packet buffer size
max_packet_size = 2147483647         ; 2GB max packet
sbuf_loopcnt = 5                     ; Processing loops before returning to event loop
tcp_defer_accept = 45                ; Defer accept for connection coalescing
tcp_keepalive = 1
tcp_keepcnt = 6
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_socket_buffer = 0                ; OS default

; ── TLS (production) ──────────────────────────────────────
; Uncomment for production TLS termination
; client_tls_sslmode = require
; client_tls_cert_file = /etc/ssl/certs/pgbouncer.crt
; client_tls_key_file = /etc/ssl/private/pgbouncer.key
; client_tls_protocols = tlsv1.3
; server_tls_sslmode = verify-full
; server_tls_ca_file = /etc/ssl/certs/ca.crt
