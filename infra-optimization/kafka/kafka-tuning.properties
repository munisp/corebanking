# 54Bank Kafka 3.7+ Tuning — Millions TPS
# Assumes 64GB RAM, NVMe SSD, 10Gbps network, 6-node cluster

# --- Broker Core ---
num.network.threads=16
num.io.threads=16
num.replica.fetchers=4

# --- Socket ---
socket.send.buffer.bytes=1048576
socket.receive.buffer.bytes=1048576
socket.request.max.bytes=104857600

# --- Log (Segments) ---
log.dirs=/data/kafka-logs
num.partitions=24
default.replication.factor=3
min.insync.replicas=2
log.segment.bytes=1073741824
log.retention.hours=168
log.retention.bytes=-1
log.cleanup.policy=delete
log.segment.delete.delay.ms=60000

# --- Batch / Buffer (Producer-side, but broker defaults) ---
message.max.bytes=10485760
replica.fetch.max.bytes=10485760

# --- In-memory page cache ---
log.flush.interval.messages=50000
log.flush.interval.ms=1000

# --- Zero-Copy Transfer ---
# Kafka uses sendfile() by default for consumer fetches.
# Ensure OS has sufficient page cache (don't set vm.dirty_ratio too low).

# --- Compression ---
compression.type=lz4
log.message.timestamp.type=CreateTime

# --- Consumer Group ---
group.initial.rebalance.delay.ms=3000
offsets.topic.replication.factor=3
offsets.topic.num.partitions=50

# --- Transaction ---
transaction.state.log.replication.factor=3
transaction.state.log.min.isr=2
transaction.max.timeout.ms=900000

# --- Quotas (per-client throttling) ---
# Set per-service quotas to prevent any one service from starving others
# quota.producer.default=104857600   # 100MB/s per producer
# quota.consumer.default=209715200   # 200MB/s per consumer

# --- Metrics ---
metric.reporters=org.apache.kafka.common.metrics.JmxReporter
auto.leader.rebalance.enable=true
leader.imbalance.check.interval.seconds=300
leader.imbalance.per.broker.percentage=10

# --- ZooKeeper / KRaft ---
# For KRaft mode (no ZooKeeper):
# process.roles=broker,controller
# controller.quorum.voters=1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093
