# 54Bank PostgreSQL 16 Tuning — Millions TPS
# Assumes 64GB RAM, NVMe SSD, 32-core CPU

# --- Memory ---
shared_buffers = 16GB                   # 25% of RAM
effective_cache_size = 48GB             # 75% of RAM (OS cache + shared_buffers)
work_mem = 64MB                         # Per-sort/hash operation
maintenance_work_mem = 2GB              # VACUUM, CREATE INDEX
huge_pages = try                        # Use huge pages if available

# --- WAL (Write-Ahead Log) ---
wal_level = replica                     # Minimal for max perf, replica for replication
wal_buffers = 256MB                     # WAL write buffer
max_wal_size = 16GB                     # Before forced checkpoint
min_wal_size = 4GB
checkpoint_completion_target = 0.9      # Spread checkpoint I/O
checkpoint_timeout = 15min
wal_compression = zstd                  # Compress WAL (PG16+)
wal_writer_delay = 200ms
wal_writer_flush_after = 1MB

# --- Synchronous Commit ---
synchronous_commit = off                # Async commit for max throughput
                                        # Risk: lose up to wal_writer_delay of data on crash
                                        # For financial: set to 'on' per-transaction for critical writes

# --- Connection Handling (use PgBouncer in front) ---
max_connections = 500                   # Direct connections (PgBouncer pools to this)
superuser_reserved_connections = 5

# --- Parallelism ---
max_parallel_workers = 16
max_parallel_workers_per_gather = 4
max_parallel_maintenance_workers = 4
max_worker_processes = 32
parallel_leader_participation = on

# --- Disk I/O ---
effective_io_concurrency = 200          # NVMe SSD
random_page_cost = 1.1                  # SSD (not spinning disk)
seq_page_cost = 1.0

# --- Background Writer ---
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 4.0
bgwriter_flush_after = 512kB

# --- Autovacuum ---
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 10s
autovacuum_vacuum_threshold = 50
autovacuum_vacuum_scale_factor = 0.05   # Vacuum at 5% dead tuples (default 20%)
autovacuum_analyze_threshold = 50
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 2ms
autovacuum_vacuum_cost_limit = 2000

# --- Query Planner ---
default_statistics_target = 200         # More stats for better plans
jit = on                                # JIT compilation for complex queries
jit_above_cost = 100000

# --- Logging ---
log_min_duration_statement = 500        # Log queries > 500ms
log_checkpoints = on
log_connections = off                   # Reduce log noise
log_disconnections = off
log_lock_waits = on
log_temp_files = 0                      # Log all temp files

# --- Replication ---
max_wal_senders = 10
max_replication_slots = 10
hot_standby = on
hot_standby_feedback = on

# --- Partitioning ---
enable_partition_pruning = on
enable_partitionwise_join = on
enable_partitionwise_aggregate = on

# --- Lock Management ---
deadlock_timeout = 1s
max_locks_per_transaction = 256
