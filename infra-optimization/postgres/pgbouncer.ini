; 54Bank PgBouncer Configuration — Connection Pooling for Millions TPS
; Sits between all Go/Rust/Python services and PostgreSQL

[databases]
; Per-service databases with dedicated pools
core_banking = host=postgres-primary port=5432 dbname=core_banking pool_size=50
payments = host=postgres-primary port=5432 dbname=payments pool_size=80
lending = host=postgres-primary port=5432 dbname=lending pool_size=40
compliance = host=postgres-primary port=5432 dbname=compliance pool_size=30
accounting = host=postgres-primary port=5432 dbname=accounting pool_size=60
identity = host=postgres-primary port=5432 dbname=identity pool_size=40
agriculture = host=postgres-primary port=5432 dbname=agriculture pool_size=20
treasury = host=postgres-primary port=5432 dbname=treasury pool_size=30
analytics = host=postgres-readonly port=5432 dbname=analytics pool_size=40
audit = host=postgres-primary port=5432 dbname=audit pool_size=20

; Read replicas for analytics and reporting
core_banking_ro = host=postgres-readonly port=5432 dbname=core_banking pool_size=40
payments_ro = host=postgres-readonly port=5432 dbname=payments pool_size=60

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Pool mode: transaction = release conn after each transaction (best for TPS)
pool_mode = transaction

; Pool sizing
default_pool_size = 50
max_client_conn = 10000
min_pool_size = 10
reserve_pool_size = 20
reserve_pool_timeout = 5

; Timeouts
server_lifetime = 3600
server_idle_timeout = 600
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 300
query_wait_timeout = 120
server_connect_timeout = 15

; Limits
max_db_connections = 400
max_user_connections = 400

; TCP keepalive
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepintvl = 10
tcp_keepcnt = 3

; Logging
log_connections = 0
log_disconnections = 0
log_pooler_errors = 1
stats_period = 60

; Application name
application_name_add_host = 1

; DNS
dns_max_ttl = 15
dns_nxdomain_ttl = 15
