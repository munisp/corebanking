# Kafka Broker Failure — Tests DLQ and consumer rebalancing
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: kafka-broker-failure-test
  namespace: 54bank
spec:
  appinfo:
    appns: 54bank
    applabel: "app=kafka"
    appkind: statefulset
  engineState: active
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-network-loss
      spec:
        components:
          env:
            - name: TARGET_PODS
              value: "kafka-0"
            - name: NETWORK_INTERFACE
              value: "eth0"
            - name: NETWORK_PACKET_LOSS_PERCENTAGE
              value: "100"
            - name: TOTAL_CHAOS_DURATION
              value: "30"
        probe:
          - name: kafka-streaming-health
            type: httpProbe
            mode: Continuous
            httpProbe/inputs:
              url: "http://kafka-streaming-go.54bank.svc:9377/healthz"
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            runProperties:
              probeTimeout: 5
              interval: 5
              retry: 3
          - name: dlq-populated
            type: httpProbe
            mode: EOT
            httpProbe/inputs:
              url: "http://kafka-streaming-go.54bank.svc:9377/dlq"
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            runProperties:
              probeTimeout: 10
              interval: 5
              retry: 2
---
# Temporal Server Failure — Tests workflow recovery
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: temporal-server-failure-test
  namespace: 54bank
spec:
  appinfo:
    appns: 54bank
    applabel: "app=temporal-server"
    appkind: deployment
  engineState: active
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TOTAL_CHAOS_DURATION
              value: "45"
            - name: FORCE
              value: "true"
        probe:
          - name: temporal-worker-health
            type: httpProbe
            mode: Continuous
            httpProbe/inputs:
              url: "http://temporal-worker-go.54bank.svc:9445/healthz"
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            runProperties:
              probeTimeout: 5
              interval: 5
              retry: 5 # Higher retry — Temporal reconnect can take time
---
# TigerBeetle Cluster Partition — Tests consensus
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: tigerbeetle-partition-test
  namespace: 54bank
spec:
  appinfo:
    appns: 54bank
    applabel: "app=tigerbeetle"
    appkind: statefulset
  engineState: active
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-network-partition
      spec:
        components:
          env:
            - name: TARGET_PODS
              value: "tigerbeetle-2" # Partition one replica
            - name: TOTAL_CHAOS_DURATION
              value: "30"
            - name: DESTINATION_IPS
              value: "tigerbeetle-0.tigerbeetle,tigerbeetle-1.tigerbeetle"
        probe:
          - name: tb-balance-assertions-consistent
            type: httpProbe
            mode: EOT
            httpProbe/inputs:
              url: "http://tigerbeetle-ledger-rs.54bank.svc:8301/balance/assert"
              method:
                post:
                  body: '{"account_id":1001,"expected_credits":500000000,"expected_debits":200000000,"tolerance_kobo":0}'
                  contentType: "application/json"
                  criteria: "=="
                  responseCode: "200"
            runProperties:
              probeTimeout: 10
              interval: 5
              retry: 3
