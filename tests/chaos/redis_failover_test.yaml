# Chaos Engineering: Redis Cluster Failover Test
# Tests that the banking platform survives Redis master node failure
# Uses LitmusChaos (https://litmuschaos.io)
# Run: kubectl apply -f tests/chaos/redis_failover_test.yaml
apiVersion: litmuschaos.io/v1alpha1
kind: ChaosEngine
metadata:
  name: redis-failover-test
  namespace: 54bank
spec:
  appinfo:
    appns: 54bank
    applabel: "app=redis-cluster"
    appkind: statefulset
  engineState: active
  chaosServiceAccount: litmus-admin
  experiments:
    - name: pod-delete
      spec:
        components:
          env:
            - name: TARGET_PODS
              value: "redis-cluster-0" # Kill master node
            - name: FORCE
              value: "true"
            - name: TOTAL_CHAOS_DURATION
              value: "60"
            - name: CHAOS_INTERVAL
              value: "10"
        probe:
          - name: redis-session-store-health
            type: httpProbe
            mode: Continuous
            httpProbe/inputs:
              url: "http://redis-session-store-go.54bank.svc:9417/healthz"
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            runProperties:
              probeTimeout: 5
              interval: 3
              retry: 2
              probePollingInterval: 2
          - name: cache-metrics-available
            type: httpProbe
            mode: EOT # End of Test
            httpProbe/inputs:
              url: "http://redis-session-store-go.54bank.svc:9417/v1/redis-session-store/cache/metrics"
              method:
                get:
                  criteria: "=="
                  responseCode: "200"
            runProperties:
              probeTimeout: 10
              interval: 5
              retry: 3
