# 54Bank Core Banking Platform — Docker Compose
# A6: Container orchestration with all infrastructure dependencies
#
# Usage:
#   docker compose up -d                          # Start all infrastructure
#   docker compose up -d postgres redis kafka      # Start just infra
#   docker compose --profile services up -d        # Start services too

version: "3.9"

services:
  # ── Infrastructure ──

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking54
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking_dev_password
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking54"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4.6-alpine  # CVE-2025-49844 fix: Lua use-after-free RCE (CVSS 10.0)
    ports: ["6379:6379"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru --protected-mode yes --lua-time-limit 5000 --rename-command EVAL "" --rename-command EVALSHA ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.5  # mina-core, jinja2, jetty, netty CVE fixes
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: "54bank-kafka-dev-cluster"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.19.0  # CVE-2024-32007 and HIGH/MEDIUM CVE fixes
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports: ["9200:9200"]
    volumes:
      - osdata:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  # TigerBeetle — Financial ledger for double-entry accounting
  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.11
    command: ["start", "--addresses=0.0.0.0:3001", "--cluster-id=0"]
    ports: ["3001:3001"]
    volumes:
      - tbdata:/var/lib/tigerbeetle
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak — Identity & access management (OIDC/OAuth2)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.9  # CVE-2024-10451, CVE-2024-1132, CVE-2025-13881 fixes
    command: start-dev
    environment:
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/banking54
      KC_DB_USERNAME: banking
      KC_DB_PASSWORD: banking_dev_password
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Permify — Zanzibar-style authorization engine
  permify:
    image: ghcr.io/permify/permify:v1.1.4
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: "postgres://banking:banking_dev_password@postgres:5432/banking54"
    ports: ["3476:3476", "3478:3478"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3476 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # APISIX — API Gateway with dynamic routing, rate limiting, TLS
  apisix:
    image: apache/apisix:3.11.0-debian  # CVE-2024-32638, CVE-2026-39999 fixes
    ports: ["9080:9080", "9443:9443", "9180:9180"]
    volumes:
      - ./config/apisix.yml:/usr/local/apisix/conf/apisix.yaml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9080/apisix/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Dapr — Distributed application runtime (sidecar)
  dapr-placement:
    image: daprio/dapr:1.13.4
    command: ["./placement", "-port", "50005"]
    ports: ["50005:50005"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50005 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Fluvio — Streaming platform (SC + SPU)
  fluvio:
    image: infinyon/fluvio:0.11.9
    command: ["fluvio", "cluster", "start", "--local"]
    ports: ["9003:9003", "9005:9005"]
    environment:
      FLUVIO_LOG: "info"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9003 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Temporal — Durable workflow orchestration server
  temporal:
    image: temporalio/auto-setup:1.30.3  # CVE-2026-33186 fix: gRPC auth bypass (CRITICAL)
    ports: ["7233:7233"]
    environment:
      DB: postgresql
      DB_PORT: "5432"
      POSTGRES_USER: banking
      POSTGRES_PWD: banking_dev_password
      POSTGRES_SEEDS: postgres
      TEMPORAL_ADDRESS: "0.0.0.0:7233"
      TEMPORAL_BROADCAST_ADDRESS: "temporal"
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 7233 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Temporal UI — Web interface for workflow visibility
  temporal-ui:
    image: temporalio/ui:2.44.0  # CVE-2026-34986, CVE-2026-33186 fixes
    ports: ["8088:8080"]
    environment:
      TEMPORAL_ADDRESS: "temporal:7233"
      TEMPORAL_CORS_ORIGINS: "http://localhost:3000"
    depends_on:
      temporal: { condition: service_healthy }
    profiles: ["monitoring"]

  # OpenAppSec — Open-source ML-based WAF (Web Application Firewall)
  openappsec:
    image: openappsec/agent:latest
    ports: ["8085:8080"]
    environment:
      OPENAPPSEC_TOKEN: "${OPENAPPSEC_TOKEN:-local-dev-token}"
      OPENAPPSEC_UPSTREAM: "http://apisix:9080"
      OPENAPPSEC_LOG_LEVEL: "info"
      OPENAPPSEC_LEARNING_MODE: "true"
      OPENAPPSEC_PREVENT_MODE: "false"
    volumes:
      - ./config/openappsec:/etc/openappsec
    depends_on:
      apisix: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    profiles: ["security"]

  # Dapr Dashboard — Web UI for Dapr observability
  dapr-dashboard:
    image: daprio/dashboard:0.14.0
    ports: ["8082:8082"]
    environment:
      DAPR_DASHBOARD_PORT: "8082"
    depends_on:
      - dapr-placement
    profiles: ["monitoring"]

  # ── Express Gateway (BFF) ──

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    ports: ["3000:3000"]
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: "postgresql://banking:banking_dev_password@postgres:5432/banking54"
      REDIS_URL: "redis://redis:6379"
      KAFKA_BOOTSTRAP_SERVERS: "kafka:9092"
      OPENSEARCH_URL: "http://opensearch:9200"
      TIGERBEETLE_ADDRESS: "tigerbeetle:3001"
      KEYCLOAK_ISSUER_URL: "http://keycloak:8080/realms/54bank"
      PERMIFY_URL: "http://permify:3476"
      APISIX_ADMIN_URL: "http://apisix:9180"
      DAPR_HTTP_PORT: "3500"
      FLUVIO_ENDPOINT: "fluvio:9003"
      MOJALOOP_HUB_URL: "http://mojaloop-hub:4000"
      OPENAPPSEC_URL: "http://openappsec:8080"
      LAKEHOUSE_API_URL: "http://lakehouse:8020"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    profiles: ["gateway"]

  # ── Go Services ──

  teller-operations:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: teller-operations-go } }
    environment: { PORT: "8090" }
    ports: ["8090:8090"]
    profiles: ["services"]

  payments-hub:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: payments-hub-go } }
    environment: { PORT: "8091" }
    ports: ["8091:8091"]
    profiles: ["services"]

  trade-finance:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: trade-finance-go } }
    environment: { PORT: "8093" }
    ports: ["8093:8093"]
    profiles: ["services"]

  esusu-groups:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: esusu-groups-go } }
    environment: { PORT: "8095" }
    ports: ["8095:8095"]
    profiles: ["services"]

  group-lending:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: group-lending-go } }
    environment: { PORT: "8096" }
    ports: ["8096:8096"]
    profiles: ["services"]

  virtual-accounts:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: virtual-accounts-go } }
    environment: { PORT: "8097" }
    ports: ["8097:8097"]
    profiles: ["services"]

  cheque-clearing:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: cheque-clearing-go } }
    environment: { PORT: "8132" }
    ports: ["8132:8132"]
    profiles: ["services"]

  nibss-direct-debit:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: nibss-direct-debit-go } }
    environment: { PORT: "8134" }
    ports: ["8134:8134"]
    profiles: ["services"]

  card-management:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: card-management-go } }
    environment: { PORT: "8140" }
    ports: ["8140:8140"]
    profiles: ["services"]

  agent-banking:
    build: { context: ., dockerfile: docker/Dockerfile.go, args: { SERVICE: agent-banking-go } }
    environment: { PORT: "8143" }
    ports: ["8143:8143"]
    profiles: ["services"]

  # ── Python Services ──

  islamic-banking:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: islamic-banking-py } }
    environment: { PORT: "8092" }
    ports: ["8092:8092"]
    profiles: ["services"]

  batch-processing:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: batch-processing-py } }
    environment: { PORT: "8117" }
    ports: ["8117:8117"]
    profiles: ["services"]

  customer-360:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: customer-360-py } }
    environment: { PORT: "8133" }
    ports: ["8133:8133"]
    profiles: ["services"]

  kyc-aml:
    build: { context: ., dockerfile: docker/Dockerfile.python, args: { SERVICE: kyc-aml-screening-py } }
    environment: { PORT: "8136" }
    ports: ["8136:8136"]
    profiles: ["services"]

  # ── Rust Services ──

  bulk-payments:
    build: { context: ., dockerfile: docker/Dockerfile.rust, args: { SERVICE: bulk-payments-rs } }
    environment: { PORT: "8139" }
    ports: ["8139:8139"]
    profiles: ["services"]

  treasury-liquidity:
    build: { context: ., dockerfile: docker/Dockerfile.rust, args: { SERVICE: treasury-liquidity-rs } }
    environment: { PORT: "8142" }
    ports: ["8142:8142"]
    profiles: ["services"]

volumes:
  pgdata:
  osdata:
  tbdata:
