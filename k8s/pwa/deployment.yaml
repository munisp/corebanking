apiVersion: apps/v1
kind: Deployment
metadata:
  name: pwa
  labels:
    app: pwa
    tier: frontend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: pwa
  template:
    metadata:
      labels:
        app: pwa
        tier: frontend
    spec:
      containers:
        - name: pwa
          image: 54bank/pwa:latest
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
          livenessProbe:
            httpGet:
              path: /
              port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: pwa
spec:
  selector:
    app: pwa
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pwa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pwa
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pwa
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: pwa
