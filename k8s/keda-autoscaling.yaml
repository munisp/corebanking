---
# KEDA ScaledObjects for 54Bank Platform (LEGACY — see k8s/keda/ for comprehensive setup)
# Comprehensive KEDA configs are in k8s/keda/:
#   - operator.yaml        — KEDA operator HA deployment (v2.14)
#   - trigger-auth.yaml    — Kafka/Postgres/Redis TriggerAuthentication
#   - scaled-objects.yaml  — 28 ScaledObjects for all Kafka consumers
#   - scaled-jobs.yaml     — 8 ScaledJobs for batch processing
#   - monitoring.yaml      — Prometheus ServiceMonitor + Grafana dashboard + alerts
#
# Original 8 ScaledObjects kept below for backward compatibility:
# kubectl apply -f https://github.com/kedacore/keda/releases/download/v2.14.0/keda-2.14.0.yaml

apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: so-core-banking
  namespace: 54bank
  labels:
    app: core-banking-go
    tier: critical-financial
spec:
  scaleTargetRef:
    name: core-banking-go
  minReplicaCount: 3
  maxReplicaCount: 20
  cooldownPeriod: 300
  pollingInterval: 30
  triggers:
    - type: kafka
      metadata:
        bootstrapServers: kafka-broker.54bank.svc.cluster.local:9092
        consumerGroup: core-banking
        topic: core-banking.transactions
        lagThreshold: "100"
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.monitoring.svc.cluster.local:9090
        query: rate(http_requests_total{service="core-banking-go"}[5m])
        threshold: "500"
---
