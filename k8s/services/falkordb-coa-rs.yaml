# Auto-generated K8s manifest for falkordb-coa-rs
apiVersion: v1
kind: Namespace
metadata:
  name: 54bank
  labels:
    istio-injection: enabled
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: falkordb-coa-rs
  namespace: 54bank
  labels:
    app: falkordb-coa-rs
    language: rust
    tier: microservice
spec:
  replicas: 3
  selector:
    matchLabels:
      app: falkordb-coa-rs
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: falkordb-coa-rs
        language: rust
        tier: microservice
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8504"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: falkordb-coa-rs
      terminationGracePeriodSeconds: 30
      restartPolicy: Always
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka-broker.54bank.svc.cluster.local 9092; do echo "Waiting for Kafka..."; sleep 2; done']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgresql.54bank.svc.cluster.local 5432; do echo "Waiting for PostgreSQL..."; sleep 2; done']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis-cache.54bank.svc.cluster.local 6379; do echo "Waiting for Redis..."; sleep 2; done']
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
      containers:
        - name: falkordb-coa-rs
          image: ghcr.io/54bank/falkordb-coa-rs:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8504
              name: http
              protocol: TCP
          env:
            - name: PORT
              value: "8504"
            - name: SERVICE_NAME
              value: "falkordb-coa-rs"
            - name: ENV
              valueFrom:
                configMapKeyRef:
                  name: 54bank-config
                  key: ENV
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: 54bank-db
                  key: url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: 54bank-redis
                  key: url
            - name: NEO4J_BOLT_URL
              valueFrom:
                secretKeyRef:
                  name: 54bank-neo4j
                  key: bolt_url
                  optional: true
            - name: FALKORDB_URL
              valueFrom:
                secretKeyRef:
                  name: 54bank-falkordb
                  key: url
                  optional: true
            - name: QDRANT_URL
              valueFrom:
                secretKeyRef:
                  name: 54bank-qdrant
                  key: url
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: 54bank-openai
                  key: api_key
                  optional: true
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /livez
              port: 8504
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8504
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: 8504
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 10
---
