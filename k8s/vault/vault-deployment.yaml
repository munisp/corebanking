# HashiCorp Vault Deployment for 54Bank
# Manages: JWT secrets, DB credentials, API keys, TLS certificates
# Backend: Raft integrated storage (HA)
# Works on: AWS EKS, OpenStack Magnum, On-Premise kubeadm
---
apiVersion: v1
kind: Namespace
metadata:
  name: vault
  labels:
    app.kubernetes.io/name: vault
    app.kubernetes.io/part-of: 54bank-security

---
# Vault ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    ui = true
    disable_mlock = true

    storage "raft" {
      path = "/vault/data"
      node_id = "${HOSTNAME}"

      retry_join {
        leader_api_addr = "https://vault-0.vault-internal:8200"
      }
      retry_join {
        leader_api_addr = "https://vault-1.vault-internal:8200"
      }
      retry_join {
        leader_api_addr = "https://vault-2.vault-internal:8200"
      }
    }

    listener "tcp" {
      address = "0.0.0.0:8200"
      tls_cert_file = "/vault/tls/tls.crt"
      tls_key_file  = "/vault/tls/tls.key"
      tls_min_version = "tls12"
    }

    seal "transit" {
      address = "https://vault-transit.54bank.local:8200"
      disable_renewal = "false"
      key_name = "autounseal"
      mount_path = "transit/"
    }

    telemetry {
      prometheus_retention_time = "24h"
      disable_hostname = true
    }

    # Audit logging — CBN requirement
    audit {
      type = "file"
      path = "file"
      options = {
        file_path = "/vault/audit/vault-audit.log"
        log_raw   = false
      }
    }

---
# Vault StatefulSet (HA with 3 replicas)
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
  labels:
    app.kubernetes.io/name: vault
spec:
  serviceName: vault-internal
  replicas: 3
  podManagementPolicy: Parallel
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: vault
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vault
    spec:
      serviceAccountName: vault
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
      terminationGracePeriodSeconds: 30

      containers:
        - name: vault
          image: hashicorp/vault:1.15
          command:
            - vault
            - server
            - -config=/vault/config/vault.hcl
          ports:
            - containerPort: 8200
              name: https
            - containerPort: 8201
              name: cluster
          env:
            - name: VAULT_ADDR
              value: "https://127.0.0.1:8200"
            - name: VAULT_SKIP_VERIFY
              value: "true"
            - name: VAULT_K8S_POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: VAULT_K8S_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          readinessProbe:
            exec:
              command:
                - vault
                - status
                - -tls-skip-verify
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=204&uninitcode=204
              port: 8200
              scheme: HTTPS
            initialDelaySeconds: 30
            periodSeconds: 15
          volumeMounts:
            - name: vault-data
              mountPath: /vault/data
            - name: vault-config
              mountPath: /vault/config
            - name: vault-tls
              mountPath: /vault/tls
              readOnly: true
            - name: vault-audit
              mountPath: /vault/audit
      volumes:
        - name: vault-config
          configMap:
            name: vault-config
        - name: vault-tls
          secret:
            secretName: vault-tls
        - name: vault-audit
          emptyDir:
            sizeLimit: 5Gi
  volumeClaimTemplates:
    - metadata:
        name: vault-data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: ceph-block  # On-prem: Rook-Ceph; AWS: gp3
        resources:
          requests:
            storage: 50Gi

---
# Internal headless service for Raft cluster
apiVersion: v1
kind: Service
metadata:
  name: vault-internal
  namespace: vault
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: https
      port: 8200
    - name: cluster
      port: 8201

---
# External service for client access
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: vault
  ports:
    - name: https
      port: 8200
      targetPort: 8200

---
# RBAC
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault
  namespace: vault

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-server-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault

---
# Vault policy for 54Bank services
apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-policies
  namespace: vault
data:
  banking-services.hcl: |
    # Core banking services can read their own secrets
    path "secret/data/services/{{identity.entity.aliases.auth_kubernetes_*.metadata.service_account_name}}/*" {
      capabilities = ["read", "list"]
    }

    # All services can read shared secrets (e.g., Kafka, Redis endpoints)
    path "secret/data/shared/*" {
      capabilities = ["read", "list"]
    }

    # Database credential rotation
    path "database/creds/{{identity.entity.aliases.auth_kubernetes_*.metadata.service_account_name}}" {
      capabilities = ["read"]
    }

    # PKI certificate issuance
    path "pki/issue/54bank-internal" {
      capabilities = ["create", "update"]
    }

  admin.hcl: |
    # Full admin access — restricted to SRE team
    path "*" {
      capabilities = ["create", "read", "update", "delete", "list", "sudo"]
    }

  audit-reader.hcl: |
    # Compliance team — read-only access to audit logs
    path "sys/audit" {
      capabilities = ["read", "list"]
    }
    path "sys/audit/*" {
      capabilities = ["read", "list"]
    }
