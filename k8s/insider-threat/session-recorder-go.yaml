apiVersion: apps/v1
kind: Deployment
metadata:
  name: session-recorder-go
  namespace: 54bank-security
  labels:
    app: session-recorder-go
    domain: security
    tier: insider-threat
spec:
  replicas: 2
  selector:
    matchLabels:
      app: session-recorder-go
  template:
    metadata:
      labels:
        app: session-recorder-go
        domain: security
        tier: insider-threat
    spec:
      restartPolicy: Always
      initContainers:
        - name: wait-for-kafka
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z kafka-bootstrap.kafka.svc.cluster.local 9092; do echo waiting for kafka; sleep 2; done']
        - name: wait-for-postgres
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z postgres-primary.database.svc.cluster.local 5432; do echo waiting for postgres; sleep 2; done']
        - name: wait-for-redis
          image: busybox:1.36
          command: ['sh', '-c', 'until nc -z redis-cluster.cache.svc.cluster.local 6379; do echo waiting for redis; sleep 2; done']
      containers:
        - name: session-recorder-go
          image: 54bank/session-recorder-go:latest
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: SERVICE_NAME
              value: "session-recorder-go"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: security-db-credentials
                  key: DATABASE_URL
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: kafka-config
                  key: KAFKA_BROKERS
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: redis-config
                  key: REDIS_URL
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: session-recorder-go
  namespace: 54bank-security
  labels:
    app: session-recorder-go
spec:
  selector:
    app: session-recorder-go
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: session-recorder-go-pdb
  namespace: 54bank-security
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: session-recorder-go
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: session-recorder-go-hpa
  namespace: 54bank-security
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: session-recorder-go
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
