      args:
        SERVICES: "data-intelligence,document-intelligence-py,lakehouse-etl-py,lakehouse-rs,materialized-view-engine-go"
        PRIMARY_LANG: "python"
    environment:
      <<: *common-env
      SERVICE_GROUP: "ai-data-pipeline"
      SERVICES: "data-intelligence,document-intelligence-py,lakehouse-etl-py,lakehouse-rs,materialized-view-engine-go"
      PORT_BASE: "9100"
    ports: ["9100-9104:9100-9104"]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 448M
    labels:
      - "com.54link-dev.group=ai-data-pipeline"
      - "com.54link-dev.services=5"
      - "com.54link-dev.ports=9100-9104"
      - "com.54link-dev.description=Data pipeline — lakehouse, ETL, CDC, analytics, insights"
