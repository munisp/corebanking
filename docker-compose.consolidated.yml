# 54Bank Core Banking Platform — Consolidated Docker Compose
# Optimized: 496 services consolidated into 41 service containers + 12 infrastructure
#
# Total containers: 53 (down from 496+ individual containers)
#
# Usage:
#   docker compose -f docker-compose.consolidated.yml up -d                    # Infrastructure only
#   docker compose -f docker-compose.consolidated.yml --profile services up -d # All services
#
# Architecture:
#   - 12 infrastructure containers (Postgres, Redis, Kafka, OpenSearch, TigerBeetle,
#     Keycloak, Permify, APISIX, Dapr, Fluvio, Gateway, ML Inference)
#   - 41 consolidated service containers (each runs multiple microservices via supervisor)
#   - Each microservice within a container listens on its own unique port
#   - Service discovery via config/service-registry.json

version: "3.9"

x-common-env: &common-env
  DATABASE_URL: postgresql://banking:banking_dev_password@postgres:5432/banking54
  REDIS_URL: redis://redis:6379
  KAFKA_BROKER: kafka:9092
  KEYCLOAK_URL: http://keycloak:8080
  OPENSEARCH_URL: http://opensearch:9200
  TIGERBEETLE_ADDRESS: tigerbeetle:3001
  PERMIFY_URL: http://permify:3476
  APISIX_ADMIN_URL: http://apisix:9180
  DAPR_HTTP_PORT: "3500"
  FLUVIO_ENDPOINT: fluvio:9003
  MOJALOOP_HUB_URL: http://mojaloop-hub:4000
  LAKEHOUSE_API_URL: http://lakehouse:8020

services:
  # ══════════════════════════════════════════════════════════════════════════════
  # INFRASTRUCTURE (12 containers)
  # ══════════════════════════════════════════════════════════════════════════════

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: banking54
      POSTGRES_USER: banking
      POSTGRES_PASSWORD: banking_dev_password
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banking -d banking54"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: "54bank-kafka-dev-cluster"
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 5

  opensearch:
    image: opensearchproject/opensearch:2.12.0
    environment:
      - discovery.type=single-node
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - DISABLE_SECURITY_PLUGIN=true
    ports: ["9200:9200"]
    volumes: [osdata:/usr/share/opensearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5

  tigerbeetle:
    image: ghcr.io/tigerbeetle/tigerbeetle:0.16.11
    command: ["start", "--addresses=0.0.0.0:3001", "--cluster-id=0"]
    ports: ["3001:3001"]
    volumes: [tbdata:/var/lib/tigerbeetle]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3001 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_password
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/banking54
      KC_DB_USERNAME: banking
      KC_DB_PASSWORD: banking_dev_password
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /health HTTP/1.1\r\nHost: localhost\r\n\r\n' >&3 && cat <&3 | grep -q UP || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  permify:
    image: ghcr.io/permify/permify:v1.1.4
    command: serve
    environment:
      PERMIFY_DATABASE_ENGINE: postgres
      PERMIFY_DATABASE_URI: "postgres://banking:banking_dev_password@postgres:5432/banking54"
    ports: ["3476:3476", "3478:3478"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 3476 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  apisix:
    image: apache/apisix:3.9.1-debian
    ports: ["9080:9080", "9443:9443", "9180:9180"]
    volumes: [./config/apisix.yml:/usr/local/apisix/conf/apisix.yaml:ro]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9080/apisix/status || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  dapr-placement:
    image: daprio/dapr:1.13.4
    command: ["./placement", "-port", "50005"]
    ports: ["50005:50005"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50005 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  fluvio:
    image: infinyon/fluvio:0.11.9
    command: ["fluvio", "cluster", "start", "--local"]
    ports: ["9003:9003"]
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9003 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build: { context: ., dockerfile: Dockerfile }
    ports: ["3000:3000"]
    environment:
      <<: *common-env
      NODE_ENV: production
      PORT: "3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  ml-inference:
    build: { context: ., dockerfile: docker/Dockerfile.ml }
    ports: ["8500:8500", "8501:8501"]
    environment:
      <<: *common-env
      PORT: "8500"
      MONITORING_PORT: "8501"
    depends_on:
      postgres: { condition: service_healthy }
    profiles: ["services"]

  # ══════════════════════════════════════════════════════════════════════════════
  # CONSOLIDATED SERVICE CONTAINERS (41 containers, 496 services)
  # ══════════════════════════════════════════════════════════════════════════════

  # Data pipeline — lakehouse, ETL, CDC, analytics, insights
  # Services: 4 | Ports: 9100-9103 | Primary: python
  ai-data-pipeline:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "document-intelligence-py,lakehouse-etl-py,lakehouse-rs,materialized-view-engine-go"
        PRIMARY_LANG: "python"
    environment:
      <<: *common-env
      SERVICE_GROUP: "ai-data-pipeline"
      SERVICES: "document-intelligence-py,lakehouse-etl-py,lakehouse-rs,materialized-view-engine-go"
      PORT_BASE: "9100"
    ports: ["9100-9103:9100-9103"]
    depends_on: [postgres, redis, kafka]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "com.54bank.group=ai-data-pipeline"
      - "com.54bank.services=4"
      - "com.54bank.ports=9100-9103"
      - "com.54bank.description=Data pipeline — lakehouse, ETL, CDC, analytics, insights"
    profiles: ["services"]

  # Graph & Search — Neo4j, FalkorDB, Qdrant, KGQA, LangChain
  # Services: 23 | Ports: 9105-9127 | Primary: rust
  ai-graph-search:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "cocoindex-pipeline-py,epr-kgqa-engine-py,epr-kgqa-go,epr-kgqa-py,epr-kgqa-rs,falkordb-coa-go,falkordb-coa-py,falkordb-coa-rs,falkordb-graph-engine-rs,falkordb-graph-rs,kgqa-reasoning-engine-py,langchain-agent-go,langchain-agent-py,langchain-agent-rs,neo4j-coa-graph-go,neo4j-coa-graph-py,neo4j-coa-graph-rs,neo4j-knowledge-graph-go,ollama-inference-go,qdrant-financial-search-go,qdrant-financial-search-py,qdrant-financial-search-rs,qdrant-vector-store-rs"
        PRIMARY_LANG: "rust"
    environment:
      <<: *common-env
      SERVICE_GROUP: "ai-graph-search"
      SERVICES: "cocoindex-pipeline-py,epr-kgqa-engine-py,epr-kgqa-go,epr-kgqa-py,epr-kgqa-rs,falkordb-coa-go,falkordb-coa-py,falkordb-coa-rs,falkordb-graph-engine-rs,falkordb-graph-rs,kgqa-reasoning-engine-py,langchain-agent-go,langchain-agent-py,langchain-agent-rs,neo4j-coa-graph-go,neo4j-coa-graph-py,neo4j-coa-graph-rs,neo4j-knowledge-graph-go,ollama-inference-go,qdrant-financial-search-go,qdrant-financial-search-py,qdrant-financial-search-rs,qdrant-vector-store-rs"
      PORT_BASE: "9105"
    ports: ["9105-9127:9105-9127"]
    depends_on: [postgres, redis, kafka]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1472M
    labels:
      - "com.54bank.group=ai-graph-search"
      - "com.54bank.services=23"
      - "com.54bank.ports=9105-9127"
      - "com.54bank.description=Graph & Search — Neo4j, FalkorDB, Qdrant, KGQA, LangChain"
    profiles: ["services"]

  # ML inference — fraud, credit, AML, churn, anomaly, GNN models
  # Services: 4 | Ports: 9129-9132 | Primary: python
  ai-ml-inference:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "art-adversarial-robustness-py,crop-yield-prediction-py,customer-insights-py,soil-analysis-py"
        PRIMARY_LANG: "python"
    environment:
      <<: *common-env
      SERVICE_GROUP: "ai-ml-inference"
      SERVICES: "art-adversarial-robustness-py,crop-yield-prediction-py,customer-insights-py,soil-analysis-py"
      PORT_BASE: "9129"
    ports: ["9129-9132:9129-9132"]
    depends_on: [postgres, redis, kafka]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "com.54bank.group=ai-ml-inference"
      - "com.54bank.services=4"
      - "com.54bank.ports=9129-9132"
      - "com.54bank.description=ML inference — fraud, credit, AML, churn, anomaly, GNN models"
    profiles: ["services"]

  # AI Agents — conversational banking agents
  # Services: 8 | Ports: 9134-9141 | Primary: python
  channels-agents:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "agent-banking-go,agent-cash-management-py,agent-customer-360-py,agent-dormancy-prevention-py,agent-farmer-onboarding-go,agent-nl-reporting-py,agent-reconciliation-py,agent-transaction-investigation-py"
        PRIMARY_LANG: "python"
    environment:
      <<: *common-env
      SERVICE_GROUP: "channels-agents"
      SERVICES: "agent-banking-go,agent-cash-management-py,agent-customer-360-py,agent-dormancy-prevention-py,agent-farmer-onboarding-go,agent-nl-reporting-py,agent-reconciliation-py,agent-transaction-investigation-py"
      PORT_BASE: "9134"
    ports: ["9134-9141:9134-9141"]
    depends_on: [postgres, redis, kafka]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "com.54bank.group=channels-agents"
      - "com.54bank.services=8"
      - "com.54bank.ports=9134-9141"
      - "com.54bank.description=AI Agents — conversational banking agents"
    profiles: ["services"]

  # Messaging — WhatsApp, Telegram, SMS, push notifications, email
  # Services: 16 | Ports: 9143-9158 | Primary: go
  channels-messaging:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "branded-comms-py,notification-router-go,notification-service-go,sms-alert-notification-py,sms-banking-gateway-go,sms-email-gateway-go,sms-otp-service-rs,telegram-banking-commands-rs,telegram-bot-gateway-go,telegram-mini-app-go,telegram-notification-py,whatsapp-banking-flows-rs,whatsapp-business-gateway-go,whatsapp-cloud-api-go,whatsapp-document-service-rs,whatsapp-notification-py"
        PRIMARY_LANG: "go"
    environment:
      <<: *common-env
      SERVICE_GROUP: "channels-messaging"
      SERVICES: "branded-comms-py,notification-router-go,notification-service-go,sms-alert-notification-py,sms-banking-gateway-go,sms-email-gateway-go,sms-otp-service-rs,telegram-banking-commands-rs,telegram-bot-gateway-go,telegram-mini-app-go,telegram-notification-py,whatsapp-banking-flows-rs,whatsapp-business-gateway-go,whatsapp-cloud-api-go,whatsapp-document-service-rs,whatsapp-notification-py"
      PORT_BASE: "9143"
    ports: ["9143-9158:9143-9158"]
    depends_on: [postgres, redis, kafka]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1024M
    labels:
      - "com.54bank.group=channels-messaging"
      - "com.54bank.services=16"
      - "com.54bank.ports=9143-9158"
      - "com.54bank.description=Messaging — WhatsApp, Telegram, SMS, push notifications, email"
    profiles: ["services"]

  # Mobile/Web — open banking, BaaS, developer portal, webhooks
  # Services: 4 | Ports: 9160-9163 | Primary: go
  channels-mobile-web:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "custom-domain-go,developer-portal-go,open-banking-baas-go,open-banking-go"
        PRIMARY_LANG: "go"
    environment:
      <<: *common-env
      SERVICE_GROUP: "channels-mobile-web"
      SERVICES: "custom-domain-go,developer-portal-go,open-banking-baas-go,open-banking-go"
      PORT_BASE: "9160"
    ports: ["9160-9163:9160-9163"]
    depends_on: [postgres, redis, kafka]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
    labels:
      - "com.54bank.group=channels-mobile-web"
      - "com.54bank.services=4"
      - "com.54bank.ports=9160-9163"
      - "com.54bank.description=Mobile/Web — open banking, BaaS, developer portal, webhooks"
    profiles: ["services"]

  # Voice — IVR, voice banking, USSD, chatbot
  # Services: 14 | Ports: 9165-9178 | Primary: python
  channels-voice:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "chatbot-py,interactive-ussd-agri-py,ussd-banking-gateway-go,ussd-multilingual-py,ussd-sim-toolkit-go,ussd-transaction-engine-rs,voice-agent-escalation-go,voice-asr-nigerian-py,voice-banking-gateway-go,voice-biometric-auth-rs,voice-call-analytics-py,voice-ivr-menu-go,voice-nlu-banking-py,voice-tts-nigerian-rs"
        PRIMARY_LANG: "python"
    environment:
      <<: *common-env
      SERVICE_GROUP: "channels-voice"
      SERVICES: "chatbot-py,interactive-ussd-agri-py,ussd-banking-gateway-go,ussd-multilingual-py,ussd-sim-toolkit-go,ussd-transaction-engine-rs,voice-agent-escalation-go,voice-asr-nigerian-py,voice-banking-gateway-go,voice-biometric-auth-rs,voice-call-analytics-py,voice-ivr-menu-go,voice-nlu-banking-py,voice-tts-nigerian-rs"
      PORT_BASE: "9165"
    ports: ["9165-9178:9165-9178"]
    depends_on: [postgres, redis, kafka]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 896M
    labels:
      - "com.54bank.group=channels-voice"
      - "com.54bank.services=14"
      - "com.54bank.ports=9165-9178"
      - "com.54bank.description=Voice — IVR, voice banking, USSD, chatbot"
    profiles: ["services"]

  # Fraud — detection, scoring, anomaly, GNN, fusion
  # Services: 8 | Ports: 9180-9187 | Primary: python
  compliance-fraud:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "agent-fraud-detection-py,ai-fraud-scoring-rs,anomaly-detector-py,fraud-detection-rs,fraudfusion-ensemble-rs,gnn-fraud-detection-py,mcmc-bayesian-risk-py,txn-pattern-analyzer-py"
        PRIMARY_LANG: "python"
    environment:
      <<: *common-env
      SERVICE_GROUP: "compliance-fraud"
      SERVICES: "agent-fraud-detection-py,ai-fraud-scoring-rs,anomaly-detector-py,fraud-detection-rs,fraudfusion-ensemble-rs,gnn-fraud-detection-py,mcmc-bayesian-risk-py,txn-pattern-analyzer-py"
      PORT_BASE: "9180"
    ports: ["9180-9187:9180-9187"]
    depends_on: [postgres, redis, kafka]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
    labels:
      - "com.54bank.group=compliance-fraud"
      - "com.54bank.services=8"
      - "com.54bank.ports=9180-9187"
      - "com.54bank.description=Fraud — detection, scoring, anomaly, GNN, fusion"
    profiles: ["services"]

  # KYC/AML — verification, screening, sanctions, PEP, adverse media
  # Services: 33 | Ports: 9189-9221 | Primary: python
  compliance-kyc-aml:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "address-verification-py,adverse-media-scanner-py,adverse-media-screening-py,agent-kyc-capture-go,aml-case-manager-go,aml-compliance-dashboard-py,aml-engine-rs,aml-risk-scoring-rs,aml-training-tracker-go,beneficial-ownership-go,bvn-nin-verification-go,cbn-tiered-kyc-rs,corporate-doc-verification-py,efass-kyc-returns-py,goaml-integration-go,kyb-engine-go,kyb-engine-py,kyc-aml-screening-py,kyc-analytics-dashboard-py,kyc-data-quality-py,kyc-engine-py,kyc-event-consumer-py,kyc-self-service-py,kyc-workflow-orchestration-py,multi-bureau-verification-go,pep-enhanced-dd-py,sanctions-batch-rescreener-rs,sanctions-engine-rs,sanctions-screening-rs,signature-verification-rs,telegram-kyc-bot-rs,video-kyc-py,watchlist-manager-rs"
        PRIMARY_LANG: "python"
    environment:
      <<: *common-env
      SERVICE_GROUP: "compliance-kyc-aml"
      SERVICES: "address-verification-py,adverse-media-scanner-py,adverse-media-screening-py,agent-kyc-capture-go,aml-case-manager-go,aml-compliance-dashboard-py,aml-engine-rs,aml-risk-scoring-rs,aml-training-tracker-go,beneficial-ownership-go,bvn-nin-verification-go,cbn-tiered-kyc-rs,corporate-doc-verification-py,efass-kyc-returns-py,goaml-integration-go,kyb-engine-go,kyb-engine-py,kyc-aml-screening-py,kyc-analytics-dashboard-py,kyc-data-quality-py,kyc-engine-py,kyc-event-consumer-py,kyc-self-service-py,kyc-workflow-orchestration-py,multi-bureau-verification-go,pep-enhanced-dd-py,sanctions-batch-rescreener-rs,sanctions-engine-rs,sanctions-screening-rs,signature-verification-rs,telegram-kyc-bot-rs,video-kyc-py,watchlist-manager-rs"
      PORT_BASE: "9189"
    ports: ["9189-9221:9189-9221"]
    depends_on: [postgres, redis, kafka]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2112M
    labels:
      - "com.54bank.group=compliance-kyc-aml"
      - "com.54bank.services=33"
      - "com.54bank.ports=9189-9221"
      - "com.54bank.description=KYC/AML — verification, screening, sanctions, PEP, adverse media"
    profiles: ["services"]

  # Regulatory — CBN returns, NFIU, NDIC, EFASS, Basel, IFRS9
  # Services: 21 | Ports: 9223-9243 | Primary: python
  compliance-regulatory:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "agent-regulatory-returns-py,basel-engine-rs,cbn-agri-returns-py,cbn-agsmeis-go,cbn-anchor-borrowers-go,cbn-compliance-checker-py,cbn-returns-py,ctr-auto-filer-go,efass-generator-rs,fatca-crs-rs,gl-regulatory-pipeline-py,ifrs9-ecl-engine-rs,ifrs9-engine-rs,lcr-nsfr-rs,nfiu-ctr-str-filing-py,regulatory-automation-py,regulatory-reporting-go,regulatory-reporting-py,regulatory-sandbox-go,sar-filing-engine-go,soc2-evidence-collector-py"
        PRIMARY_LANG: "python"
    environment:
      <<: *common-env
      SERVICE_GROUP: "compliance-regulatory"
      SERVICES: "agent-regulatory-returns-py,basel-engine-rs,cbn-agri-returns-py,cbn-agsmeis-go,cbn-anchor-borrowers-go,cbn-compliance-checker-py,cbn-returns-py,ctr-auto-filer-go,efass-generator-rs,fatca-crs-rs,gl-regulatory-pipeline-py,ifrs9-ecl-engine-rs,ifrs9-engine-rs,lcr-nsfr-rs,nfiu-ctr-str-filing-py,regulatory-automation-py,regulatory-reporting-go,regulatory-reporting-py,regulatory-sandbox-go,sar-filing-engine-go,soc2-evidence-collector-py"
      PORT_BASE: "9223"
    ports: ["9223-9243:9223-9243"]
    depends_on: [postgres, redis, kafka]
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1344M
    labels:
      - "com.54bank.group=compliance-regulatory"
      - "com.54bank.services=21"
      - "com.54bank.ports=9223-9243"
      - "com.54bank.description=Regulatory — CBN returns, NFIU, NDIC, EFASS, Basel, IFRS9"
    profiles: ["services"]

  # Risk — scoring, assessment, credit risk, operational risk
  # Services: 5 | Ports: 9245-9249 | Primary: rust
  compliance-risk:
    build:
      context: .
      dockerfile: docker/Dockerfile.consolidated
      args:
        SERVICES: "contingent-liabilities-rs,risk-based-approach-py,risk-scoring-rs,tenant-provisioning-go,tenant-provisioning-py"
        PRIMARY_LANG: "rust"
    environment:
